<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic FUI Dependency Visualizer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #05070f; /* Un fundal și mai închis pentru contrast maxim cu neonul */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        #btn-back {
            display: none;
            background: #ff0055;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            pointer-events: auto;
            margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(250, 0, 85, 0.4);
            transition: all 0.2s;
        }

        #btn-back:hover {
            background: #d00044;
            box-shadow: 0 0 25px rgba(250, 0, 85, 0.7);
        }

        #breadcrumbs {
            color: #00ffcc;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(5, 7, 15, 0.85);
            padding: 8px 16px;
            border-radius: 4px;
            display: inline-block;
            border: 1px solid #111936;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
        }
    </style>

    <!-- INCLUDEREA LIBRĂRIILOR LOCALE - ORDINE STRICTĂ CORECTATĂ -->
    <script src="res/three.js"></script>
    <script src="res/OrbitControls.js"></script>
    <script src="res/gsap.js"></script>
    
    <!-- Post-Procesare Core Stack -->
    <script src="res/EffectComposer.js"></script>
    <script src="res/RenderPass.js"></script>
    <script src="res/ShaderPass.js"></script>
    
    <!-- Shaders & Dependencies (Trebuie să fie ÎNAINTEA pasului de Bloom) -->
    <script src="res/CopyShader.js"></script>
    <script src="res/LuminosityHighPassShader.js"></script>
    
    <!-- Efectul Final -->
    <script src="res/UnrealBloomPass.js"></script>
    




</head>
<body>

    <div id="ui-container">
        <button id="btn-back">← SYSTEM BACK</button>
        <div id="breadcrumbs">SYS_CORE // HOME</div>
    </div>

    <canvas id="webgl-canvas"></canvas>

    <script>
        // 1. COMPONENTELE DE BAZĂ
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05070f, 0.0025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(90, 110, 130); 

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        // Activăm maparea corectă a tonurilor de culoare pentru reflexii realiste de sticlă
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Împiedică camera să coboare sub podea

        // ILUMINARE (Esențială pentru reflexiile materialului de sticlă SF)
        const luminaAmbientala = new THREE.AmbientLight(0x0a1128, 1.5);
        scene.add(luminaAmbientala);

        const luminaDirectie1 = new THREE.DirectionalLight(0x00ffff, 2.0);
        luminaDirectie1.position.set(1, 1, 1);
        scene.add(luminaDirectie1);

        const luminaDirectie2 = new THREE.DirectionalLight(0xff0055, 1.5);
        luminaDirectie2.position.set(-1, 1, -1);
        scene.add(luminaDirectie2);

        // 2. CONFIGURAREA MOTORULUI DE STRĂLUCIRE NEON (CORRECTAT PENTRU NON-MODULE)
        const renderPass = new THREE.RenderPass(scene, camera);
        
        // Inițializăm Bloom-ul
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight), 
            1.5,  // Intensitate Glow
            0.4,  // Razā Blur
            0.15  // Prag luminozitate
        );
        
        // !!! ACEASTA ESTE LINIA CRUCIALĂ PENTRU COPIILE DE POST-PROCESARE CLASICE !!!
        // Îi spune plăcii video că acesta este ultimul filtru și trebuie trimis direct pe monitor
        bloomPass.renderToScreen = true;

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderPass);
        composer.addPass(bloomPass);


        // Stiva pentru istoricul breadcrumbs
        const istoricNavigare = [];

        // 3. STRUCTURA DE DATE JSON REALĂ (Graf de Dependențe pe Etaje)
        const dateProiect = {
            etaje: [
                {
                    nume: "DATABASE_LAYER",
                    culoare: 0x00ffcc, // Cyan Neon
                    functii: [
                        { id: "db_init", nume: "initPool()", x: -25, z: -20 },
                        { id: "db_query", nume: "executeQuery()", x: 0, z: -30 },
                        { id: "db_close", nume: "closeConnection()", x: 25, z: -20 }
                    ]
                },
                {
                    nume: "CORE_LOGIC_LAYER",
                    culoare: 0xff0055, // Roz Neon
                    functii: [
                        { id: "auth_main", nume: "validateToken()", x: -30, z: 10 },
                        { id: "calc_salary", nume: "calculateSalar()", x: 0, z: 0 },
                        { id: "pdf_gen", nume: "generateReport()", x: 30, z: 10 }
                    ]
                },
                {
                    nume: "API_GATEWAY_LAYER",
                    culoare: 0x9900ff, // Violet Neon
                    functii: [
                        { id: "api_router", nume: "routeRequest()", x: -15, z: 30 },
                        { id: "api_cors", nume: "handleCORS()", x: 15, z: 30 }
                    ]
                }
            ],
            legaturi: [
                { deLa: "auth_main", la: "db_query" },
                { deLa: "calc_salary", la: "db_query" },
                { deLa: "api_router", la: "auth_main" },
                { deLa: "api_router", la: "calc_salary" },
                { deLa: "pdf_gen", la: "db_query" }
            ]
        };

        // Containere pentru animații
        const masinaPanouriSticla = [];
        const dictionarPozitiiGlobale = {}; // Folosit pentru a trasa liniile corect între id-uri

        // CONSTRUIREA SCENEI FUI
        dateProiect.etaje.forEach(function(etajDate, indexEtaj) {
            const inaltimeY = indexEtaj * 45; // Distanța pe înălțime între etaje

            const etajGrup = new THREE.Group();
            etajGrup.position.y = inaltimeY;

            // Podele Holografice High-Tech (Cercuri concentrice de date)
            for(let r = 1; r <= 4; r++) {
                const geomCerc = new THREE.RingGeometry(r * 15 - 0.3, r * 15, 64);
                geomCerc.rotateX(-Math.PI / 2);
                const matCerc = new THREE.MeshBasicMaterial({
                    color: etajDate.culoare,
                    transparent: true,
                    opacity: 0.05,
                    side: THREE.DoubleSide
                });
                etajGrup.add(new THREE.Mesh(geomCerc, matCerc));
            }

            // Construirea Panourilor de Sticlă pentru Fiecare Funcție
            etajDate.functii.forEach(function(functie) {
                // Geometria panoului plat sci-fi (ca un ecran tactil orizontal)
                const geomSticla = new THREE.BoxGeometry(16, 0.4, 10);
                
                // MATERIALUL AVANSAT DE STICLĂ SF REPREZENTAT ÎN IMAGINILE TALE
                const matSticla = new THREE.MeshPhysicalMaterial({
                    color: 0x0a1128,          // Bază de albastru închis cibernetic
                    transparent: true,
                    opacity: 0.5,
                    roughness: 0.1,           // Foarte lucioasă
                    metalness: 0.2,
                    transmission: 0.6,        // Creează efectul de "frosted/cloudy glass"
                    ior: 1.5,                 // Indicele de refracție al sticlei
                    thickness: 1.0,           // Grosimea refracției luminii
                    clearcoat: 1.0,           // Strat lucios suplimentar de reflexie
                    clearcoatRoughness: 0.05
                });

                const panouMesh = new THREE.Mesh(geomSticla, matSticla);
                panouMesh.position.set(functie.x, 0, function.z);

                // Adăugăm o margine luminoasă neon în jurul panoului de sticlă (Wireframe Outline)
                const geomMargine = new THREE.EdgesGeometry(geomSticla);
                const matMargine = new THREE.LineBasicMaterial({ 
                    color: etajDate.culoare, 
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending 
                });
                const margineNeon = new THREE.LineSegments(geomMargine, matMargine);
                panouMesh.add(margineNeon);

                // Salvăm datele esențiale pentru click (Raycasting)
                panouMesh.userData = { 
                    inaltimeY: inaltimeY, 
                    numeEtaj: etajDate.nume + " // " + functie.nume,
                    estePanou: true 
                };

                etajGrup.add(panouMesh);
                masinaPanouriSticla.push(panouMesh);

                // Salvăm coordonatele globale ale acestei funcții pentru a putea trasa liniile de legătură
                dictionarPozitiiGlobale[functie.id] = new THREE.Vector3(functie.x, inaltimeY, functie.z);
            });

            scene.add(etajGrup);
        });

        // TRASAREA REȚELEI DE LEBUGĂTURI INTER-ETAJ (Data Streams)
        const coordonateLinii = [];
        dateProiect.legaturi.forEach(function(legatura) {
            const p1 = dictionarPozitiiGlobale[legatura.deLa];
            const p2 = dictionarPozitiiGlobale[legatura.la];

            if (p1 && p2) {
                coordonateLinii.push(p1.x, p1.y, p1.z);
                coordonateLinii.push(p2.x, p2.y, p2.z);
            }
        });

        const geomRetea = new THREE.BufferGeometry();
        geomRetea.setAttribute('position', new THREE.Float32BufferAttribute(coordonateLinii, 3));
        
        const matRetea = new THREE.LineBasicMaterial({
            color: 0x00ffff, 
            transparent: true,
            opacity: 0.35,
            blending: THREE.AdditiveBlending
        });
        const sistemLegaturiConexiuni = new THREE.LineSegments(geomRetea, matRetea);
        scene.add(sistemLegaturiConexiuni);

        // MATRIX DATA DUST (Ploaie de biți luminate în fundal)
        const geomPraf = new THREE.BufferGeometry();
        const pozitiiPraf = [];
        for(let p = 0; p < 400; p++) {
            pozitiiPraf.push((Math.random() - 0.5) * 250);
            pozitiiPraf.push(Math.random() * 160 - 20);
            pozitiiPraf.push((Math.random() - 0.5) * 250);
        }
        geomPraf.setAttribute('position', new THREE.Float32BufferAttribute(pozitiiPraf, 3));
        const matPraf = new THREE.PointsMaterial({
            color: 0x00ffcc,
            size: 1.2,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending
        });
        const norPraf = new THREE.Points(geomPraf, matPraf);
        scene.add(norPraf);


        // 4. RAYCASTING INTELIGENT (CLICK MAGNETIC PE PANOURI)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let sX = 0, sY = 0;

        window.addEventListener('mousedown', function(e) {
            sX = e.clientX; sY = e.clientY;
        });

        window.addEventListener('mouseup', function(e) {
            if (Math.abs(e.clientX - sX) > 4 || Math.abs(e.clientY - sY) > 4) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersectii = raycaster.intersectObjects(scene.children, true);

            if (intersectii.length > 0) {
                let panouSelectat = null;
                for (let i = 0; i < intersectii.length; i++) {
                    if (intersectii[i].object.userData && intersectii[i].object.userData.estePanou) {
                        panouSelectat = intersectii[i].object;
                        break;
                    }
                }

                if (panouSelectat) {
                    const tY = panouSelectat.userData.inaltimeY;
                    const lbl = panouSelectat.userData.numeEtaj;
                    window.navigheazaCatre(tY, lbl);
                }
            }
        });


        // 5. FLIGHT INTERPOLATION (GSAP CAMERA SYSTEM)
        window.navigheazaCatre = function(tintaY, eticheta, salveazaIstoric = true) {
