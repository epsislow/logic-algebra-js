<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic FUI Dependency Visualizer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #05070f; /* Un fundal și mai închis pentru contrast maxim cu neonul */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        #btn-back {
            display: none;
            background: #ff0055;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            pointer-events: auto;
            margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(250, 0, 85, 0.4);
            transition: all 0.2s;
        }

        #btn-back:hover {
            background: #d00044;
            box-shadow: 0 0 25px rgba(250, 0, 85, 0.7);
        }

        #breadcrumbs {
            color: #00ffcc;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(5, 7, 15, 0.85);
            padding: 8px 16px;
            border-radius: 4px;
            display: inline-block;
            border: 1px solid #111936;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
        }
    </style>

    <!-- INCLUDEREA LIBRĂRIILOR LOCALE - ORDINE STRICTĂ CORECTATĂ -->
    <script src="res/three.js"></script>
    <script src="res/OrbitControls.js"></script>
    <script src="res/gsap.js"></script>
    
    <!-- Post-Procesare Core Stack -->
    <script src="res/EffectComposer.js"></script>
    <script src="res/RenderPass.js"></script>
    <script src="res/ShaderPass.js"></script>
    
    <!-- Shaders & Dependencies (Trebuie să fie ÎNAINTEA pasului de Bloom) -->
    <script src="res/CopyShader.js"></script>
    <script src="res/LuminosityHighPassShader.js"></script>
    
    <!-- Efectul Final -->
    <script src="res/UnrealBloomPass.js"></script>
    




</head>
<body>

    <div id="ui-container">
        <button id="btn-back">← SYSTEM BACK</button>
        <div id="breadcrumbs">SYS_CORE // HOME</div>
    </div>

    <canvas id="webgl-canvas"></canvas>

    <script>
        // 1. COMPONENTELE DE BAZĂ
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05070f, 0.0025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(90, 110, 130); 

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        // Activăm maparea corectă a tonurilor de culoare pentru reflexii realiste de sticlă
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Împiedică camera să coboare sub podea

        // ILUMINARE (Esențială pentru reflexiile materialului de sticlă SF)
        const luminaAmbientala = new THREE.AmbientLight(0x0a1128, 1.5);
        scene.add(luminaAmbientala);

        const luminaDirectie1 = new THREE.DirectionalLight(0x00ffff, 2.0);
        luminaDirectie1.position.set(1, 1, 1);
        scene.add(luminaDirectie1);

        const luminaDirectie2 = new THREE.DirectionalLight(0xff0055, 1.5);
        luminaDirectie2.position.set(-1, 1, -1);
        scene.add(luminaDirectie2);

        // 2. CONFIGURAREA MOTORULUI DE STRĂLUCIRE NEON (CORRECTAT PENTRU NON-MODULE)
        const renderPass = new THREE.RenderPass(scene, camera);
        
        // Inițializăm Bloom-ul
        /*const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight), 
            1.5,  // Intensitate Glow
            0.4,  // Razā Blur
            0.15  // Prag luminozitate
        );*/

        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight), 
            1.1,  // AM SCĂZUT INTENSITATEA BLOOM (era 1.8) pentru a nu mai fi spălată imaginea
            0.4,  
            0.15  // Am mărit pragul ca să ignore reflexiile slabe ale sticlei
        );
        
        // !!! ACEASTA ESTE LINIA CRUCIALĂ PENTRU COPIILE DE POST-PROCESARE CLASICE !!!
        // Îi spune plăcii video că acesta este ultimul filtru și trebuie trimis direct pe monitor
        bloomPass.renderToScreen = true;

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderPass);
        composer.addPass(bloomPass);


        // Stiva pentru istoricul breadcrumbs
        const istoricNavigare = [];

        // 3. STRUCTURA DE DATE JSON REALĂ (Graf de Dependențe pe Etaje)
        const dateProiect = {
            etaje: [
                {
                    nume: "DATABASE_LAYER",
                    culoare: 0x00ffcc, // Cyan Neon
                    functii: [
                        { id: "db_init", nume: "initPool()", x: -25, z: -20 },
                        { id: "db_query", nume: "executeQuery()", x: 0, z: -30 },
                        { id: "db_close", nume: "closeConnection()", x: 25, z: -20 }
                    ]
                },
                {
                    nume: "CORE_LOGIC_LAYER",
                    culoare: 0xff0055, // Roz Neon
                    functii: [
                        { id: "auth_main", nume: "validateToken()", x: -30, z: 10 },
                        { id: "calc_salary", nume: "calculateSalar()", x: 0, z: 0 },
                        { id: "pdf_gen", nume: "generateReport()", x: 30, z: 10 }
                    ]
                },
                {
                    nume: "API_GATEWAY_LAYER",
                    culoare: 0x9900ff, // Violet Neon
                    functii: [
                        { id: "api_router", nume: "routeRequest()", x: -15, z: 30 },
                        { id: "api_cors", nume: "handleCORS()", x: 15, z: 30 }
                    ]
                }
            ],
            legaturi: [
                { deLa: "auth_main", la: "db_query" },
                { deLa: "calc_salary", la: "db_query" },
                { deLa: "api_router", la: "auth_main" },
                { deLa: "api_router", la: "calc_salary" },
                { deLa: "pdf_gen", la: "db_query" }
            ]
        };

        // Containere pentru animații
        const masinaPanouriSticla = [];
        const dictionarPozitiiGlobale = {}; // Folosit pentru a trasa liniile corect între id-uri

        // CONSTRUIREA SCENEI FUI
        dateProiect.etaje.forEach(function(etajDate, indexEtaj) {
            const inaltimeY = indexEtaj * 45; // Distanța pe înălțime între etaje

            const etajGrup = new THREE.Group();
            etajGrup.position.y = inaltimeY;

            // Podele Holografice High-Tech (Cercuri concentrice de date)
            for(let r = 1; r <= 4; r++) {
                const geomCerc = new THREE.RingGeometry(r * 15 - 0.3, r * 15, 64);
                geomCerc.rotateX(-Math.PI / 2);
                const matCerc = new THREE.MeshBasicMaterial({
                    color: etajDate.culoare,
                    transparent: true,
                    opacity: 0.05,
                    side: THREE.DoubleSide
                });
                etajGrup.add(new THREE.Mesh(geomCerc, matCerc));
            }

            // Construirea Panourilor de Sticlă pentru Fiecare Funcție
            etajDate.functii.forEach(function(functie) {
                // Geometria panoului plat sci-fi (ca un ecran tactil orizontal)
                const geomSticla = new THREE.BoxGeometry(16, 0.4, 10);
                
                // MATERIALUL AVANSAT DE STICLĂ SF REPREZENTAT ÎN IMAGINILE TALE
                const matSticla = new THREE.MeshPhysicalMaterial({
                    color: 0x050b1e,          // Un albastru închis și mai profund pentru opacitate
                    transparent: true,
                    opacity: 0.85,            // AM MĂRIT OPACITATEA (era 0.5) - panoul devine mai solid
                    roughness: 0.5,           // AM MĂRIT ROUGHNESS (era 0.1) - sticla devine mată, nu mai reflectă ca o oglindă
                    metalness: 0.1,           // Am scăzut reflexia metalică
                    transmission: 0.3,        // AM SCĂZUT TRANSMISSION (era 0.6) - trece mai puțină lumină prin el, devenind mai vizibil
                    ior: 1.2,                 // Am scăzut indicele de refracție pentru a fi mai discret
                    thickness: 0.5,           
                    clearcoat: 0.1,           // AM SCĂZUT CLEARCOAT (era 1.0) - am eliminat aproape complet stratul lucios de deasupra
                    clearcoatRoughness: 0.5
                });

                const panouMesh = new THREE.Mesh(geomSticla, matSticla);
                panouMesh.position.set(functie.x, 0, functie.z);

                // Adăugăm o margine luminoasă neon în jurul panoului de sticlă (Wireframe Outline)
                const geomMargine = new THREE.EdgesGeometry(geomSticla);
                const matMargine = new THREE.LineBasicMaterial({ 
                    color: etajDate.culoare, 
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending 
                });
                const margineNeon = new THREE.LineSegments(geomMargine, matMargine);
                panouMesh.add(margineNeon);

                // Salvăm datele esențiale pentru click (Raycasting)
                panouMesh.userData = { 
                    inaltimeY: inaltimeY, 
                    numeEtaj: etajDate.nume + " // " + functie.nume,
                    estePanou: true 
                };

                etajGrup.add(panouMesh);
                masinaPanouriSticla.push(panouMesh);

                // Salvăm coordonatele globale ale acestei funcții pentru a putea trasa liniile de legătură
                dictionarPozitiiGlobale[functie.id] = new THREE.Vector3(functie.x, inaltimeY, functie.z);
            });

            scene.add(etajGrup);
        });

        // TRASAREA REȚELEI DE FLUX INTER-ETAJ (Data Streams animate)
        const grupFluxLegaturi = new THREE.Group();
        const materialeFlux = [];

        const fluxVertexShader = [
            'attribute float lineDistance;',
            'varying float vLineDistance;',
            'void main() {',
            '    vLineDistance = lineDistance;',
            '    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
            '}'
        ].join('\n');

        const fluxFragmentShader = [
            'uniform float uTime;',
            'uniform vec3 uColor;',
            'uniform float uSpeed;',
            'uniform float uPulseScale;',
            'uniform float uSeed;',
            'uniform float uPhase;',
            'varying float vLineDistance;',
            'float hash(float n) {',
            '    return fract(sin(n) * 43758.5453123);',
            '}',
            'float impulsAleator(float travel, float seed) {',
            '    float celula = floor(travel);',
            '    float local = fract(travel);',
            '    float hActiv = hash(celula * 17.0 + seed);',
            '    float hPoz = hash(celula * 31.0 + seed + 7.0);',
            '    float hLatime = hash(celula * 53.0 + seed + 13.0);',
            '    float hIntens = hash(celula * 71.0 + seed + 19.0);',
            '    if (hActiv < 0.42) return 0.0;',
            '    float start = hPoz * 0.78;',
            '    float latime = 0.035 + hLatime * 0.14;',
            '    float dist = local - start;',
            '    if (dist < 0.0) dist += 1.0;',
            '    float forma = smoothstep(0.0, latime * 0.25, dist) * (1.0 - smoothstep(latime * 0.25, latime, dist));',
            '    return forma * (0.55 + hIntens * 0.65);',
            '}',
            'void main() {',
            '    float travel = vLineDistance * uPulseScale - uTime * uSpeed + uPhase;',
            '    float pulse = impulsAleator(travel, uSeed);',
            '    pulse += impulsAleator(travel * 1.37 + 3.7, uSeed + 41.0) * 0.6;',
            '    pulse = min(pulse, 1.0);',
            '    float brightness = 0.16 + pulse * 1.35;',
            '    float alpha = 0.115 + pulse * 0.90;',
            '    gl_FragColor = vec4(uColor * brightness, alpha);',
            '}'
        ].join('\n');

        function construiesteTraseuCircuit(p1, p2) {
            const midY = (p1.y + p2.y) * 0.5;
            return [
                p1.clone(),
                new THREE.Vector3(p1.x, midY, p1.z),
                new THREE.Vector3(p2.x, midY, p2.z),
                p2.clone()
            ];
        }

        function offsetPuncteParalele(puncte, indexLinie, totalLinii, spacing) {
            const offsetAmount = (indexLinie - (totalLinii - 1) / 2) * spacing;
            const up = new THREE.Vector3(0, 1, 0);
            const rezultat = [];

            for (let i = 0; i < puncte.length; i++) {
                const copie = puncte[i].clone();
                let tangenta;

                if (i === 0) {
                    tangenta = puncte[1].clone().sub(puncte[0]).normalize();
                } else if (i === puncte.length - 1) {
                    tangenta = puncte[i].clone().sub(puncte[i - 1]).normalize();
                } else {
                    tangenta = puncte[i + 1].clone().sub(puncte[i - 1]).normalize();
                }

                let perpendiculara = new THREE.Vector3().crossVectors(tangenta, up);
                if (perpendiculara.lengthSq() < 0.0001) {
                    perpendiculara = new THREE.Vector3().crossVectors(tangenta, new THREE.Vector3(1, 0, 0));
                }
                perpendiculara.normalize();

                copie.add(perpendiculara.multiplyScalar(offsetAmount));
                rezultat.push(copie);
            }

            return rezultat;
        }

        function creeazaGeometrieFlux(puncte) {
            const pozitii = [];
            puncte.forEach(function(p) {
                pozitii.push(p.x, p.y, p.z);
            });

            const geometrie = new THREE.BufferGeometry();
            geometrie.setAttribute('position', new THREE.Float32BufferAttribute(pozitii, 3));

            const distante = [0];
            let distantaCurenta = 0;
            for (let i = 1; i < puncte.length; i++) {
                distantaCurenta += puncte[i].distanceTo(puncte[i - 1]);
                distante.push(distantaCurenta);
            }
            geometrie.setAttribute('lineDistance', new THREE.Float32BufferAttribute(distante, 1));

            return geometrie;
        }

        function creeazaMaterialFlux(viteza, culoare, seed, faza) {
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uColor: { value: new THREE.Color(culoare) },
                    uSpeed: { value: viteza },
                    uPulseScale: { value: 0.055 + Math.random() * 0.04 },
                    uSeed: { value: seed },
                    uPhase: { value: faza }
                },
                vertexShader: fluxVertexShader,
                fragmentShader: fluxFragmentShader,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            materialeFlux.push(material);
            return material;
        }

        function adaugaNodFlux(pozitie, culoare) {
            const geomNod = new THREE.SphereGeometry(0.35, 8, 8);
            const matNod = new THREE.MeshBasicMaterial({
                color: culoare,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });
            const nod = new THREE.Mesh(geomNod, matNod);
            nod.position.copy(pozitie);
            nod.userData.fazaPuls = Math.random() * Math.PI * 2;
            nod.userData.vitezaPuls = 2.5 + Math.random() * 3.5;
            grupFluxLegaturi.add(nod);
        }

        const NUMAR_LINII_PARALELE = 4;
        const SPATIERE_FLUX = 0.32;
        const CULOARE_FLUX = 0x00ffcc;

        dateProiect.legaturi.forEach(function(legatura, indexLegatura) {
            const p1 = dictionarPozitiiGlobale[legatura.deLa];
            const p2 = dictionarPozitiiGlobale[legatura.la];
            if (!p1 || !p2) return;

            const traseu = construiesteTraseuCircuit(p1, p2);

            // Traseu de bază discret (cadru static al circuitului)
            const geomBaza = creeazaGeometrieFlux(traseu);
            const linieBaza = new THREE.Line(geomBaza, new THREE.LineBasicMaterial({
                color: CULOARE_FLUX,
                transparent: true,
                opacity: 0.10,
                blending: THREE.AdditiveBlending
            }));
            grupFluxLegaturi.add(linieBaza);

            adaugaNodFlux(p1, CULOARE_FLUX);
            adaugaNodFlux(p2, CULOARE_FLUX);
            adaugaNodFlux(traseu[1], CULOARE_FLUX);
            adaugaNodFlux(traseu[2], CULOARE_FLUX);

            for (let linie = 0; linie < NUMAR_LINII_PARALELE; linie++) {
                const puncteOffset = offsetPuncteParalele(traseu, linie, NUMAR_LINII_PARALELE, SPATIERE_FLUX);
                const geometrie = creeazaGeometrieFlux(puncteOffset);
                const viteza = 0.7 + Math.random() * 1.6;
                const seed = Math.random() * 1000 + indexLegatura * 47 + linie * 13;
                const faza = Math.random() * 12;
                const material = creeazaMaterialFlux(viteza, CULOARE_FLUX, seed, faza);
                const linieFlux = new THREE.Line(geometrie, material);
                grupFluxLegaturi.add(linieFlux);
            }
        });

        scene.add(grupFluxLegaturi);

        // MATRIX DATA DUST (Ploaie de biți luminate în fundal)
        const geomPraf = new THREE.BufferGeometry();
        const pozitiiPraf = [];
        for(let p = 0; p < 400; p++) {
            pozitiiPraf.push((Math.random() - 0.5) * 250);
            pozitiiPraf.push(Math.random() * 160 - 20);
            pozitiiPraf.push((Math.random() - 0.5) * 250);
        }
        geomPraf.setAttribute('position', new THREE.Float32BufferAttribute(pozitiiPraf, 3));
        const matPraf = new THREE.PointsMaterial({
            color: 0x00ffcc,
            size: 1.2,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending
        });
        const norPraf = new THREE.Points(geomPraf, matPraf);
        scene.add(norPraf);


        // 4. RAYCASTING INTELIGENT (CLICK MAGNETIC PE PANOURI)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let sX = 0, sY = 0;

        window.addEventListener('mousedown', function(e) {
            sX = e.clientX; sY = e.clientY;
        });

        window.addEventListener('mouseup', function(e) {
            if (Math.abs(e.clientX - sX) > 4 || Math.abs(e.clientY - sY) > 4) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersectii = raycaster.intersectObjects(scene.children, true);

            if (intersectii.length > 0) {
                let panouSelectat = null;
                for (let i = 0; i < intersectii.length; i++) {
                    if (intersectii[i].object.userData && intersectii[i].object.userData.estePanou) {
                        panouSelectat = intersectii[i].object;
                        break;
                    }
                }

                if (panouSelectat) {
                    const tY = panouSelectat.userData.inaltimeY;
                    const lbl = panouSelectat.userData.numeEtaj;
                    window.navigheazaCatre(tY, lbl);
                }
            }
        });


        // 5. FLIGHT INTERPOLATION (GSAP CAMERA SYSTEM)
        window.navigheazaCatre = function(tintaY, eticheta, salveazaIstoric = true) {
            if (salveazaIstoric) {
                istoricNavigare.push({
                    cPoz: camera.position.clone(),
                    cTinta: controls.target.clone(),
                    eticheta: eticheta
                });
                actualizeazaUI();
            }

            controls.enabled = false;

            // Camera zboară cinematic direct în fața panoului selectat la acel etaj
            gsap.to(camera.position, {
                x: 45,
                y: tintaY + 22, 
                z: 55,
                duration: 1.4,
                ease: "power3.inOut"
            });

            gsap.to(controls.target, {
                x: 0,
                y: tintaY,
                z: 0,
                duration: 1.4,
                ease: "power3.inOut",
                onComplete: function() { controls.enabled = true; }
            });
        };

        window.mergiInapoi = function() {
            if (istoricNavigare.length === 0) return;
            const stareaAnterioara = istoricNavigare.pop();

            controls.enabled = false;

            gsap.to(camera.position, {
                x: stareaAnterioara.cPoz.x,
                y: stareaAnterioara.cPoz.y,
                z: stareaAnterioara.cPoz.z,
                duration: 1.4,
                ease: "power3.inOut"
            });

            gsap.to(controls.target, {
                x: stareaAnterioara.cTinta.x,
                y: stareaAnterioara.cTinta.y,
                z: stareaAnterioara.cTinta.z,
                duration: 1.4,
                ease: "power3.inOut",
                onComplete: function() { controls.enabled = true; }
            });

            actualizeazaUI();
        };

        function actualizeazaUI() {
            const txtB = document.getElementById('breadcrumbs');
            const btnB = document.getElementById('btn-back');

            btnB.style.display = istoricNavigare.length > 0 ? 'block' : 'none';

            let textStiva = 'SYS_CORE // HOME';
            istoricNavigare.forEach(function(pas) {
                textStiva += ' &gt; ' + pas.eticheta;
            });
            txtB.innerHTML = textStiva;
        }

        document.getElementById('btn-back').addEventListener('click', function() { window.mergiInapoi(); });


        // 6. LOOP-UL DE RANDARE CU EFFECT COMPOSER
        let ceas = 0;

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            
            ceas += 0.008;

            // Animație plutire panouri de sticlă
            masinaPanouriSticla.forEach(function(panou, index) {
                panou.position.y = Math.sin(ceas * 1.5 + index) * 0.4;
            });

            // Animație flux pe liniile de legătură
            materialeFlux.forEach(function(mat) {
                mat.uniforms.uTime.value = ceas;
            });

            // Pulsație noduri de intersecție (fază random per nod)
            grupFluxLegaturi.children.forEach(function(copil) {
                if (copil.isMesh) {
                    const f = copil.userData.fazaPuls || 0;
                    const v = copil.userData.vitezaPuls || 3;
                    const unda = Math.sin(ceas * v + f);
                    copil.scale.setScalar(0.6 + unda * 0.35);
                    copil.material.opacity = 0.40 + unda * 0.52;
                }
            });

            norPraf.rotation.y += 0.0003;

            // Rulăm prin EffectComposer pentru a procesa lumina de Neon/Glow
            composer.render();
        }
        animate();


        // 7. RESPONSIVENESS
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
