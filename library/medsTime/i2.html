<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Avansat Medicamente</title>
    <style>
        :root {
            --primary: #2b6cb0;
            --primary-dark: #2c5282;
            --success: #2f855a;
            --danger: #e53e3e;
            --bg: #f7fafc;
            --card-bg: #ffffff;
            --text: #2d3748;
            --border: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 { margin-bottom: 5px; color: var(--primary-dark); }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }
        @media(min-width: 768px) {
            .grid { grid-template-columns: 350px 1fr; }
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
        }
        .card h2 { margin-top: 0; font-size: 1.25rem; color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
        input, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        .dose-inputs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .days-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 5px;
        }
        .day-checkbox {
            display: flex;
            align-items: center;
            font-size: 0.8rem;
            background: #edf2f7;
            padding: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .day-checkbox input { width: auto; margin-right: 5px; }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; padding: 4px 8px; font-size: 0.85rem; width: auto; }
        .btn-reset { background: #718096; color: white; margin-top: 15px; }
        .med-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .med-table th, .med-table td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .med-table th { background: #edf2f7; color: #4a5568; }
        .qty-actions { display: flex; align-items: center; gap: 5px; }
        .qty-input { width: 70px; padding: 4px; text-align: center; }
        .status-badge {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        .status-ok { background: #c6f6d5; color: #22543d; }
        .status-alert { background: #fed7d7; color: #742a2a; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💊 Asistent Planificare Medicamente</h1>
        <p>Calcul exact calendaristic bazat pe stoc și frecvență personalizată</p>
    </header>

    <div class="grid">
        <!-- Formular adaugare -->
        <div class="card">
            <h2>Adaugă Medicament Nou</h2>
            <div class="form-group">
                <label for="medName">Nume Medicament</label>
                <input type="text" id="medName" placeholder="Ex: Aspenter">
            </div>
            <div class="form-group">
                <label for="medQty">Stoc Inițial (capsule)</label>
                <input type="number" id="medQty" min="1" placeholder="Ex: 30">
            </div>
            <div class="form-group">
                <label>Doza per moment al zilei</label>
                <div class="dose-inputs">
                    <div>
                        <label style="font-size:0.75rem; font-weight:normal;">Dimineața</label>
                        <input type="number" id="doseDim" min="0" value="0">
                    </div>
                    <div>
                        <label style="font-size:0.75rem; font-weight:normal;">Prânz</label>
                        <input type="number" id="dosePranz" min="0" value="0">
                    </div>
                    <div>
                        <label style="font-size:0.75rem; font-weight:normal;">Seara</label>
                        <input type="number" id="doseSeara" min="0" value="0">
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="frequencyType">Frecvență Administrare</label>
                <select id="frequencyType" onchange="toggleFrequencyOptions()">
                    <option value="zilnic">În fiecare zi</option>
                    <option value="zile_specifice">Zile specifice din săptămână</option>
                    <option value="o_zi_da_nu">O zi da, o zi nu (Alternativ)</option>
                    <option value="doua_zile">O dată la 2 zile (A 3-a zi)</option>
                </select>
            </div>

            <!-- Optiuni zile specifice -->
            <div id="specificDaysWrapper" class="form-group hidden">
                <label>Selectează zilele:</label>
                <div class="days-selector">
                    <label class="day-checkbox"><input type="checkbox" value="1">Lu</label>
                    <label class="day-checkbox"><input type="checkbox" value="2">Ma</label>
                    <label class="day-checkbox"><input type="checkbox" value="3">Mi</label>
                    <label class="day-checkbox"><input type="checkbox" value="4">Jo</label>
                    <label class="day-checkbox"><input type="checkbox" value="5">Vi</label>
                    <label class="day-checkbox"><input type="checkbox" value="6">Sâ</label>
                    <label class="day-checkbox"><input type="checkbox" value="0">Du</label>
                </div>
            </div>

            <button class="btn-primary" onclick="addMedication()">Adaugă în Plan</button>
            <button class="btn-reset" onclick="resetAllData()">Șterge Tot (Reset complet)</button>
        </div>

        <!-- Tabel stocuri si predictie -->
        <div class="card">
            <h2>Plan Tratament și Predicție Epuizare Stoc</h2>
            <div style="overflow-x: auto;">
                <table class="med-table" id="medTable">
                    <thead>
                        <tr>
                            <th>Medicament</th>
                            <th>Stoc Actual</th>
                            <th>Orar & Frecvență</th>
                            <th>Data Epuizării Stocului</th>
                            <th>Acțiuni</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dinamic -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let medications = [];

    // Încărcare inițială din localStorage
    window.onload = function() {
        if (localStorage.getItem('medications')) {
            medications = JSON.parse(localStorage.getItem('medications'));
            renderTable();
        }
    };

    function saveToStorage() {
        localStorage.setItem('medications', JSON.stringify(medications));
    }

    function toggleFrequencyOptions() {
        const type = document.getElementById('frequencyType').value;
        const wrapper = document.getElementById('specificDaysWrapper');
        if (type === 'zile_specifice') {
            wrapper.classList.remove('hidden');
        } else {
            wrapper.classList.add('hidden');
        }
    }

    function addMedication() {
        const name = document.getElementById('medName').value.trim();
        const qty = parseInt(document.getElementById('medQty').value);
        const dim = parseInt(document.getElementById('doseDim').value) || 0;
        const pranz = parseInt(document.getElementById('dosePranz').value) || 0;
        const seara = parseInt(document.getElementById('doseSeara').value) || 0;
        const freqType = document.getElementById('frequencyType').value;

        if (!name || isNaN(qty) || qty <= 0) {
            alert("Introdu un nume valid și stocul curent.");
            return;
        }
        
        const dosePerActiveDay = dim + pranz + seara;
        if (dosePerActiveDay <= 0) {
            alert("Introdu cel puțin o capsulă într-un moment al zilei.");
            return;
        }

        let specificDays = [];
        if (freqType === 'zile_specifice') {
            const checkboxes = document.querySelectorAll('#specificDaysWrapper input:checked');
            checkboxes.forEach(cb => specificDays.push(parseInt(cb.value)));
            if (specificDays.length === 0) {
                alert("Selectează cel puțin o zi din săptămână.");
                return;
            }
        }

        const totalDaily = dim + pranz + seara;
        if (freqType === 'daily' && totalDaily === 0) {
            alert("Introdu doza zilnică (dimineața, prânz sau seara).");
            return;
        }

        const newMed = {
            id: Date.now().toString(),
            name,
            qty,
            freqType,
            interval: intervalDays,
            specificDays,
            dim,
            pranz,
            seara
        };

        medications.push(newMed);
        saveToStorage();
        renderTable();
        resetForm();
    }

    // Calculează data exactă a epuizării stocului luând în considerare frecvența complexă
    function calculateEndDate(med) {
        let currentQty = med.qty;
        let checkDate = new Date(); // Începe de astăzi
        const dailyDose = med.dim + med.pranz + med.seara;

        if (med.freqType === 'daily' && dailyDose === 0) return "Nu se consumă";
        if (med.freqType === 'days' && dailyDose === 0) return "Nu se consumă";
        if (med.freqType === 'interval' && dailyDose === 0) return "Nu se consumă";

        let daysCounter = 0;
        const maxSafetyIterations = 5000; // Previne blocarea browserului în buclă infinită

        while (currentQty > 0 && daysCounter < maxSafetyIterations) {
            let takesMedicineToday = false;

            if (med.freqType === 'daily') {
                takesMedicineToday = true;
            } 
            else if (med.freqType === 'interval') {
                // 'intervalDays' reprezintă din cât în cât timp se ia medicamentul (ex: din 2 în 2 zile)
                if (daysCounter % med.interval === 0) {
                    takesMedicineToday = true;
                }
            } 
            else if (med.freqType === 'days') {
                // Zilele în JavaScript: 0 = Duminică, 1 = Luni, ..., 6 = Sâmbătă
                const currentDayOfWeek = checkDate.getDay().toString();
                if (med.specificDays.includes(currentDayOfWeek)) {
                    takesMedicineToday = true;
                }
            }

            if (takesMedicineToday) {
                // Dacă stocul rămas e mai mic decât doza zilei, se termină în această zi
                if (currentQty < dailyDose) {
                    break;
                }
                currentQty -= dailyDose;
            }

            if (currentQty <= 0) {
                break;
            }

            // Trecem la următoarea zi calendaristică
            checkDate.setDate(checkDate.getDate() + 1);
            daysCounter++;
        }

        if (daysCounter >= maxSafetyIterations) return "Peste 10+ ani";

        // Formatare dată finală în format românesc
        const day = String(checkDate.getDate()).padStart(2, '0');
        const month = String(checkDate.getMonth() + 1).padStart(2, '0');
        const year = checkDate.getFullYear();
        
        const daysOfWeekRo = ["Duminică", "Luni", "Marți", "Miercuri", "Joi", "Vineri", "Sâmbătă"];
        const dayName = daysOfWeekRo[checkDate.getDay()];

        return `${dayName}, ${day}.${month}.${year}`;
    }

    // Afișează tabelul actualizat cu toate medicamentele
    function renderTable() {
        const tableBody = document.querySelector('#medTable tbody');
        tableBody.innerHTML = '';

        medications.forEach(med => {
            const row = document.createElement('tr');
            const totalDaily = med.dim + med.pranz + med.seara;
            const endDateStr = calculateEndDate(med);

            // Generare text descriptiv pentru coloana Frecvență
            let freqText = '';
            if (med.freqType === 'daily') freqText = 'Zilnic';
            else if (med.freqType === 'interval') {
                freqText = med.interval === 2 ? 'O zi da, o zi nu' : `La fiecare ${med.interval} zile`;
            } else if (med.freqType === 'days') {
                const daysMap = { '1': 'Lu', '2': 'Ma', '3': 'Mi', '4': 'Jo', '5': 'Vi', '6': 'Sâ', '0': 'Du' };
                freqText = med.specificDays.map(d => daysMap[d]).join(', ');
            }

            row.innerHTML = `
                <td><strong>${med.name}</strong></td>
                <td>
                    <div class="edit-stock-container">
                        <input type="number" class="inline-qty" value="${med.qty}" onchange="updateStock('${med.id}', this.value)">
                        <span>capsule</span>
                    </div>
                </td>
                <td>${med.dim}</td>
                <td>${med.pranz}</td>
                <td>${med.seara}</td>
                <td>${freqText} (${totalDaily}/zi)</td>
                <td class="status-alert">${endDateStr}</td>
                <td><button class="delete-btn" onclick="deleteMedication('${med.id}')">Șterge</button></td>
            `;

            tableBody.appendChild(row);
        });
    }

    // Modifică numărul de capsule direct din tabel
    function updateStock(id, newQty) {
        const qtyValue = parseInt(newQty);
        if (isNaN(qtyValue) || qtyValue < 0) {
            alert("Introdu un număr valid de capsule.");
            renderTable();
            return;
        }
        const med = medications.find(m => m.id === id);
        if (med) {
            med.qty = qtyValue;
            saveToStorage();
            renderTable(); // Re-calculare automată a datelor de expirare
        }
    }

    // Șterge un medicament
    function deleteMedication(id) {
        if (confirm("Sigur vrei să ștergi acest medicament din listă?")) {
            medications = medications.filter(m => m.id !== id);
            saveToStorage();
            renderTable();
        }
    }

    // Resetează complet aplicația (șterge tot)
    function resetAll() {
        if (confirm("Sigur vrei să ștergi TOATE medicamentele salvate? Datele nu vor mai putea fi recuperate.")) {
            medications = [];
            saveToStorage();
            renderTable();
        }
    }

    // Resetează câmpurile formularului de adăugare
    function resetForm() {
        document.getElementById('medName').value = '';
        document.getElementById('medQty').value = '';
        document.getElementById('freqType').value = 'daily';
        document.getElementById('doseDim').value = '0';
        document.getElementById('dosePranz').value = '0';
        document.getElementById('doseSeara').value = '0';
        document.getElementById('intervalDays').value = '2';
        
        document.querySelectorAll('.day-checkbox').forEach(cb => cb.checked = false);
        toggleFreqFields();
    }

    // Salvare în localStorage
    function saveToStorage() {
        localStorage.setItem('medicationsStockApp', JSON.stringify(medications));
    }

    // Încărcare inițială la pornirea paginii web
    window.onload = function() {
        const stored = localStorage.getItem('medicationsStockApp');
        if (stored) {
            medications = JSON.parse(stored);
        }
        renderTable();
    };
</script>

</body>
</html>
