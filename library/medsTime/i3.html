    function savePersonsToStorage() {
        localStorage.setItem(PERSONS_STORAGE_KEY, JSON.stringify(persons));
    }

    function migrateToPersons() {
        const storedPersons = localStorage.getItem(PERSONS_STORAGE_KEY);
        if (storedPersons) {
            persons = JSON.parse(storedPersons);
        } else {
            const defaultPerson = { id: 'person_default', name: DEFAULT_PERSON_NAME, icon: DEFAULT_PERSON_ICON };
            persons = [defaultPerson];
            medications = medications.map(med => ({
                ...med,
                personId: med.personId || defaultPerson.id
            }));
            savePersonsToStorage();
            saveToStorage();
        }

        if (persons.length === 0) {
            const defaultPerson = { id: `person_${Date.now()}`, name: DEFAULT_PERSON_NAME, icon: DEFAULT_PERSON_ICON };
            persons = [defaultPerson];
            savePersonsToStorage();
        }

        normalizePersonIcons();
        savePersonsToStorage();

        const fallbackPersonId = persons[0].id;
        medications = medications.map(med => ({
            ...med,
            personId: persons.some(person => person.id === med.personId) ? med.personId : fallbackPersonId
        }));
        loadDefaultPersonId();
        ensureDefaultPerson();
    }

    function formatDateKey(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${year}-${month}-${day}`;
    }

    function getTodayKey() {
        return formatDateKey(new Date());
    }

    function canCheckMedOnDate(dateKey) {
        return compareDateKeys(dateKey, getTodayKey()) <= 0;
    }

    function getStartDateFromForm() {
        return document.getElementById('medStartDate').value || formatDateKey(new Date());
    }

    function setStartDateInput(dateKey) {
        document.getElementById('medStartDate').value = dateKey;
    }

    function getCheckKey(medId, dateKey, period) {
        return `${medId}|${dateKey}|${period}`;
    }

    function isMedChecked(medId, dateKey, period) {
        return !!medChecks[getCheckKey(medId, dateKey, period)];
    }

    function toggleMedCheck(medId, dateKey, period, checked) {
        if (!canCheckMedOnDate(dateKey)) return;

        const key = getCheckKey(medId, dateKey, period);
        if (checked) {
            medChecks[key] = true;
        } else {
            delete medChecks[key];
        }
        saveChecksToStorage();
        renderPlan();
    }

    function removeChecksForMed(medId) {
        const prefix = `${medId}|`;
        Object.keys(medChecks).forEach(key => {
            if (key.startsWith(prefix)) {
                delete medChecks[key];
            }
        });
        saveChecksToStorage();
    }

    function saveChecksToStorage() {
        localStorage.setItem('medicationsChecks_v1', JSON.stringify(medChecks));
        pushNotificationSchedule();
    }

    function loadChecksFromStorage() {
        const stored = localStorage.getItem('medicationsChecks_v1');
        medChecks = stored ? JSON.parse(stored) : {};
    }

    function formatDateLabel(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${getDaysShort()[date.getDay()]}, ${day}.${month}.${year}`;
    }

    function isMedTakenOnDayOffset(med, dayOffset) {
        const date = new Date();
        date.setHours(0, 0, 0, 0);
        date.setDate(date.getDate() + dayOffset);
        return isMedScheduledOnDate(med, date);
    }

    function formatCalendarMedItem(med, amount, dateKey, period) {
        const unit = getMedUnit(med);
        const isFuture = !canCheckMedOnDate(dateKey);
        const checked = !isFuture && isMedChecked(med.id, dateKey, period);
        const doneClass = checked ? ' calendar-med-item--done' : '';
        const futureClass = isFuture ? ' calendar-med-item--future' : '';
        const checkedAttr = checked ? ' checked' : '';
        const disabledAttr = isFuture ? ' disabled' : '';
        const changeHandler = isFuture
            ? ''
            : ` onchange="toggleMedCheck('${med.id}', '${dateKey}', '${period}', this.checked); this.closest('.calendar-med-item').classList.toggle('calendar-med-item--done', this.checked)"`;

        return `<li class="calendar-med-item${doneClass}${futureClass}">
            <label class="calendar-med-check">
                <input type="checkbox"${checkedAttr}${disabledAttr}${changeHandler}>
                <span class="calendar-med-name-wrap">
                    <span class="calendar-med-name">${med.name}</span>
                    <span class="calendar-med-start">${formatMedStartLabel(med)}</span>
                </span>
            </label>
            <span class="calendar-med-dose">${formatDoseValue(amount, unit)} ${UNIT_LABELS[unit]}</span>
        </li>`;
    }

    function renderCalendarPeriod(periodClass, icon, title, medItems) {
        if (medItems.length === 0) return '';
        return `
            <div class="calendar-period ${periodClass}">
                <div class="calendar-period-title">
                    <span class="calendar-period-icon">${icon}</span>
                    <span>${title}</span>
                </div>
                <ul class="calendar-med-list">${medItems.join('')}</ul>
            </div>`;
    }

    function getYesterdayDate() {
        const yesterday = new Date();
        yesterday.setHours(0, 0, 0, 0);
        yesterday.setDate(yesterday.getDate() - 1);
        return yesterday;
    }

    function getCalendarViewStart() {
        const input = document.getElementById('calendarViewStart');
        return (input && input.value) ? input.value : formatDateKey(new Date());
    }

    function onCalendarViewStartChange() {
        localStorage.setItem('calendarViewStart', getCalendarViewStart());
        updateCalendarRangeHint();
        renderCalendar();
    }

    function shiftCalendarViewStart(weeks) {
        const input = document.getElementById('calendarViewStart');
        if (!input) return;

        const current = parseDateKey(getCalendarViewStart());
        current.setDate(current.getDate() + weeks * 7);
        input.value = formatDateKey(current);
        onCalendarViewStartChange();
    }

    function goToCalendarToday() {
        const input = document.getElementById('calendarViewStart');
        if (!input) return;

        input.value = formatDateKey(new Date());
        onCalendarViewStartChange();
    }

    function updateCalendarRangeHint() {
        const hint = document.getElementById('calendarRangeHint');
        if (!hint) return;

        const viewStart = parseDateKey(getCalendarViewStart());
        const viewEnd = new Date(viewStart);
        viewEnd.setDate(viewEnd.getDate() + 13);

        hint.textContent = t('calendarUntil', { date: formatDateLabel(viewEnd) });
    }

    function initCalendarViewStart() {
        const stored = localStorage.getItem('calendarViewStart');
        const input = document.getElementById('calendarViewStart');
        if (!input) return;

        input.value = stored || formatDateKey(new Date());
        updateCalendarRangeHint();
    }

    function forEachScheduledDoseUntil(med, endDate, callback) {
        const medStart = parseDateKey(getMedStartDate(med));
        let current = new Date(medStart);

        while (current <= endDate) {
            if (isMedScheduledOnDate(med, current)) {
                const dateKey = formatDateKey(current);
                for (const period of PERIODS) {
                    const dose = getDoseForPeriod(med, period);
                    if (dose <= 0) continue;
                    if (getRemainingBeforeDose(med, dateKey, period) < dose - 0.0001) continue;
                    callback(dateKey, period);
                }
            }
            current.setDate(current.getDate() + 1);
        }
    }

    function hasUncheckedDosesUntilYesterday(med) {
        const yesterday = getYesterdayDate();
        const medStart = parseDateKey(getMedStartDate(med));
        if (yesterday < medStart) return false;

        let hasAnyDose = false;
        let hasUnchecked = false;

        forEachScheduledDoseUntil(med, yesterday, (dateKey, period) => {
            hasAnyDose = true;
            if (!isMedChecked(med.id, dateKey, period)) {
                hasUnchecked = true;
            }
        });

        return hasAnyDose && hasUnchecked;
    }

    function autoCheckMedUntilYesterday(medId) {
        const med = medications.find(m => m.id === medId);
        if (!med) return;

        const yesterday = getYesterdayDate();
        let addedChecks = 0;

        forEachScheduledDoseUntil(med, yesterday, (dateKey, period) => {
            if (!isMedChecked(med.id, dateKey, period)) {
                medChecks[getCheckKey(med.id, dateKey, period)] = true;
                addedChecks++;
            }
        });

        if (addedChecks === 0) return;

        saveChecksToStorage();
        renderPlan();
    }

    function renderCalendar() {
        const container = document.getElementById('medCalendar');
        container.innerHTML = '';

        const filteredMeds = getFilteredMedications();
        let hasAnyDay = false;

        const viewStart = parseDateKey(getCalendarViewStart());
        const viewEnd = new Date(viewStart);
        viewEnd.setDate(viewEnd.getDate() + 13);
        const todayKey = formatDateKey(new Date());

        let current = new Date(viewStart);
        while (current <= viewEnd) {
            const date = new Date(current);
            const dateKey = formatDateKey(date);

            const dimMeds = [];
            const pranzMeds = [];
            const searaMeds = [];

            filteredMeds.forEach(med => {
                if (med.dim > 0 && shouldShowDoseInCalendar(med, date, dateKey, 'dim')) {
                    dimMeds.push(formatCalendarMedItem(med, med.dim, dateKey, 'dim'));
                }
                if (med.pranz > 0 && shouldShowDoseInCalendar(med, date, dateKey, 'pranz')) {
                    pranzMeds.push(formatCalendarMedItem(med, med.pranz, dateKey, 'pranz'));
                }
                if (med.seara > 0 && shouldShowDoseInCalendar(med, date, dateKey, 'seara')) {
                    searaMeds.push(formatCalendarMedItem(med, med.seara, dateKey, 'seara'));
                }
            });

            if (dimMeds.length === 0 && pranzMeds.length === 0 && searaMeds.length === 0) {
                current.setDate(current.getDate() + 1);
                continue;
            }

            hasAnyDay = true;
            const dayEl = document.createElement('div');
            let dayClass = 'calendar-day';
            if (dateKey === todayKey) dayClass += ' calendar-day-today';
            if (compareDateKeys(dateKey, todayKey) < 0) dayClass += ' calendar-day-past';
            dayEl.className = dayClass;

            let dayBadge = '';
            if (dateKey === todayKey) {
                dayBadge = `<span class="calendar-day-badge">${t('badgeToday')}</span>`;
            } else if (compareDateKeys(dateKey, todayKey) < 0) {
                dayBadge = `<span class="calendar-day-badge calendar-day-badge--past">${t('badgePast')}</span>`;
            }
            let html = `
                <div class="calendar-day-header">
                    <div class="calendar-day-title">${formatDateLabel(date)}</div>
                    ${dayBadge}
                </div>
                <div class="calendar-periods">`;

            html += renderCalendarPeriod('calendar-period--dim', '🌅', t('periodMorning'), dimMeds);
            html += renderCalendarPeriod('calendar-period--pranz', '☀️', t('periodLunch'), pranzMeds);
            html += renderCalendarPeriod('calendar-period--seara', '🌙', t('periodEvening'), searaMeds);

            html += '</div>';

            dayEl.innerHTML = html;
            container.appendChild(dayEl);
            current.setDate(current.getDate() + 1);
        }

        if (!hasAnyDay) {
            container.innerHTML = `<p class="med-empty">${t('noMedsCalendar')}</p>`;
        }
    }

    function renderPlan() {
        if (showCalendarView) {
            updateCalendarRangeHint();
            renderCalendar();
        } else {
            renderTable();
        }
    }

    function showListView() {
        setPlanTab('list');
    }

    function updatePlanTabsUI() {
        const tabList = document.getElementById('tabPlanList');
        const tabCalendar = document.getElementById('tabPlanCalendar');
        if (!tabList || !tabCalendar) return;

        tabList.classList.toggle('active', !showCalendarView);
        tabList.setAttribute('aria-selected', String(!showCalendarView));
        tabCalendar.classList.toggle('active', showCalendarView);
        tabCalendar.setAttribute('aria-selected', String(showCalendarView));
    }

    function setPlanTab(tab) {
        const isCalendar = tab === 'calendar';

        if (isCalendar) {
            closeMedFormPanel();
            initCalendarViewStart();
        }

        showCalendarView = isCalendar;
        document.getElementById('planListView').classList.toggle('hidden', isCalendar);
        document.getElementById('planCalendarView').classList.toggle('hidden', !isCalendar);
        updatePlanTabsUI();
        renderPlan();
    }

    function openAddMedForm() {
        if (!selectedPersonId) return;

        if (showCalendarView) {
            showListView();
        }

        resetForm();
        document.getElementById('medFormTitle').textContent = t('addMedForm');
        document.getElementById('medFormPanel').classList.remove('hidden');
        medFormOpen = true;
        document.getElementById('medFormPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        document.getElementById('medName').focus();
    }

    function closeMedFormPanel() {
        document.getElementById('medFormPanel')?.classList.add('hidden');
        medFormOpen = false;
        resetForm();
    }

    function fillMedFormFromMedication(med) {
        const unit = getMedUnit(med);

        document.getElementById('medName').value = getBaseMedName(med.name);
        document.getElementById('medQty').value = formatDoseValue(getMedInitialQty(med), unit);
        document.getElementById('medUnit').value = unit;
        setStartDateInput(getMedStartDate(med));
        updateUnitFields();

        document.getElementById('doseDim').value = formatDoseValue(med.dim, unit);
        document.getElementById('dosePranz').value = formatDoseValue(med.pranz, unit);
        document.getElementById('doseSeara').value = formatDoseValue(med.seara, unit);

        document.getElementById('freqType').value = med.freqType;
        toggleFreqFields();

        if (med.freqType === 'interval') {
            document.getElementById('intervalDays').value = String(med.interval);
        } else if (med.freqType === 'days') {
            document.querySelectorAll('.day-checkbox').forEach(cb => {
                cb.checked = med.specificDays.includes(cb.value);
            });
        }
    }

    function scrollToMedItem(medId) {
        requestAnimationFrame(() => {
            const row = document.querySelector(`#medTable tr[data-med-id="${medId}"]`);
            row?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
    }

    // Desenează tabelul pe ecran utilizând datele salvate
    function renderTable() {
        const tableBody = document.querySelector('#medTable tbody');
        tableBody.innerHTML = '';

        const sortedMeds = getFilteredMedications()
            .map(med => ({ med, stockOut: calculateStockOut(med) }))
            .sort((a, b) => a.stockOut.timestamp - b.stockOut.timestamp);

        if (sortedMeds.length === 0) {
            const emptyRow = document.createElement('tr');
            emptyRow.innerHTML = `<td colspan="3" class="med-empty">${t('noMeds')}</td>`;
            tableBody.appendChild(emptyRow);
            return;
        }

        sortedMeds.forEach(({ med, stockOut }) => {
            const unit = getMedUnit(med);
            const remaining = getCurrentRemaining(med);
            const totalDaily = med.dim + med.pranz + med.seara;
            const freqText = formatFreqText(med, totalDaily);

            const statusClass = getStockStatusClass(stockOut);
            const statusIcon = getStockStatusIcon(statusClass);
            const showCheckBtn = hasUncheckedDosesUntilYesterday(med);
            const checkBtn = showCheckBtn
                ? `<button class="check-yesterday-btn" onclick="autoCheckMedUntilYesterday('${med.id}')" title="${t('checkUntilYesterday')}" aria-label="${t('checkUntilYesterday')}">✓</button>`
                : '';

            const startLabel = formatMedStartLabel(med);

            const row = document.createElement('tr');
            row.className = 'med-item';
            row.dataset.medId = med.id;
            row.innerHTML = `
                <td colspan="3">
                    <div class="med-item-inner">
                        <div class="med-name-block">
                            <div class="med-name">${statusIcon}<strong>${med.name}</strong></div>
                            <div class="med-start">${startLabel}</div>
                        </div>
                        <div class="med-stock">
                            <span class="stock-remaining">${formatDoseValue(remaining, unit)}</span>
                            <span class="med-unit">${UNIT_LABELS[unit]}</span>
                        </div>
                        <div class="med-actions-col">
                            <div class="med-actions-group">
                                ${checkBtn}
                                <button class="delete-btn" onclick="deleteMedication('${med.id}')" title="${t('delete')}" aria-label="${t('delete')}">×</button>
                            </div>
                            <button class="copy-form-btn" onclick="copyMedicationToForm('${med.id}')" title="${t('copyToForm')}" aria-label="${t('copyToForm')}">⧉</button>
                        </div>
                        <div class="med-line-bottom">
                            <span class="med-end ${statusClass}">${t('stockOut')}: ${stockOut.label}</span>
                            <span class="med-freq">${freqText}</span>
                        </div>
                    </div>
                </td>
            `;

            tableBody.appendChild(row);
        });
    }

    function getBaseMedName(name) {
        const match = name.match(/^(.+) #\d+$/);
        return match ? match[1] : name;
    }

    function copyMedicationToForm(id) {
        const med = medications.find(m => m.id === id);
        if (!med) return;

        fillMedFormFromMedication(med);
        document.getElementById('medFormTitle').textContent = t('addMedForm');
        document.getElementById('medFormPanel').classList.remove('hidden');
        medFormOpen = true;
        document.getElementById('medFormPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        document.getElementById('medName').focus();
    }

    // Șterge un singur rând din tabel
    function deleteMedication(id) {
        showConfirmModal(t('confirmDeleteMed'), () => {
            medications = medications.filter(m => m.id !== id);
            removeChecksForMed(id);
            saveToStorage();
            renderPlan();
            renderPersonList();
        });
    }

    // Funcția Reset - Golește memoria locală și tabelul
    function resetAll() {
        const person = getSelectedPerson();
        const personName = person?.name || 'această persoană';
        showConfirmModal(t('confirmDeleteAllMeds', { name: personName }), () => {
            const medIdsToRemove = getPersonMedications().map(med => med.id);
            medications = medications.filter(med => med.personId !== selectedPersonId);
            medIdsToRemove.forEach(medId => removeChecksForMed(medId));
            saveChecksToStorage();
            saveToStorage();
            renderPlan();
            renderPersonList();
        });
    }

    function buildBackupPayload() {
        if (!selectedPersonId) {
            throw new Error(t('errorExportNoPerson'));
        }

        const personMeds = getPersonMedications(selectedPersonId);
        const medIds = new Set(personMeds.map(med => med.id));
        const checks = {};

        Object.entries(medChecks).forEach(([key, value]) => {
            if (!value) return;
            const medId = key.split('|')[0];
            if (medIds.has(medId)) {
                checks[key] = true;
            }
        });

        return {
            app: BACKUP_APP_ID,
            version: BACKUP_VERSION,
            exportedAt: new Date().toISOString(),
            medications: personMeds.map(med => ({ ...med })),
            medChecks: checks
        };
    }

    function isValidImportedMedication(med) {
        if (!med || typeof med !== 'object') return false;
        if (typeof med.id !== 'string' || !med.id) return false;
        if (typeof med.name !== 'string' || !med.name.trim()) return false;
        const qty = med.initialQty ?? med.qty;
        if (qty === undefined || qty === null || Number.isNaN(Number(qty))) return false;
        return true;
    }

    function removePersonMedicationsAndChecks(personId) {
        const medIdsToRemove = getPersonMedications(personId).map(med => med.id);
        medications = medications.filter(med => med.personId !== personId);
        medIdsToRemove.forEach(medId => {
            const prefix = `${medId}|`;
            Object.keys(medChecks).forEach(key => {
                if (key.startsWith(prefix)) {
                    delete medChecks[key];
                }
            });
        });
    }

    function parseBackupPayload(text) {
        const trimmed = (text || '').trim();
        if (!trimmed) {
            throw new Error(t('errorImportEmpty'));
        }

        let data;
        try {
            data = JSON.parse(trimmed);
        } catch (error) {
            throw new Error(t('errorImportInvalid'));
        }

        if (!data || data.app !== BACKUP_APP_ID) {
            throw new Error(t('errorImportInvalid'));
        }
        if (data.version !== BACKUP_VERSION) {
            throw new Error(t('errorImportVersion'));
        }
        if (!Array.isArray(data.medications)) {
            throw new Error(t('errorImportInvalid'));
        }
        if (data.medChecks !== undefined && (typeof data.medChecks !== 'object' || Array.isArray(data.medChecks))) {
            throw new Error(t('errorImportInvalid'));
        }

        return data;
    }

    function applyBackupData(data) {
        if (!selectedPersonId) {
            throw new Error(t('errorImportNoPerson'));
        }

        removePersonMedicationsAndChecks(selectedPersonId);

        const existingMedIds = new Set(medications.map(med => med.id));
        const idMap = new Map();
        const importedMeds = [];

        data.medications.filter(isValidImportedMedication).forEach(med => {
            const copy = { ...med, personId: selectedPersonId };
            if (existingMedIds.has(copy.id)) {
                const newId = `${Date.now()}_${Math.random().toString(36).slice(2, 9)}`;
                idMap.set(copy.id, newId);
                copy.id = newId;
            }
            existingMedIds.add(copy.id);
            importedMeds.push(copy);
        });

        if (importedMeds.length === 0 && data.medications.length > 0) {
            throw new Error(t('errorImportInvalid'));
        }

        medications.push(...importedMeds);
        normalizeMedications();

        const importedMedIds = new Set(importedMeds.map(med => med.id));
        Object.entries(data.medChecks || {}).forEach(([key, value]) => {
            if (!value) return;
            const parts = key.split('|');
            if (parts.length < 3) return;

            const originalMedId = parts[0];
            const mappedMedId = idMap.get(originalMedId) || originalMedId;
            if (!importedMedIds.has(mappedMedId)) return;

            medChecks[getCheckKey(mappedMedId, parts[1], parts[2])] = true;
        });

        saveToStorage();
        saveChecksToStorage();
        renderPersonList();
        renderPlan();
    }

    async function exportBackup() {
        if (!navigator.clipboard?.writeText) {
            showAlertModal(t('errorExportClipboard'));
            return;
        }

        try {
            const text = JSON.stringify(buildBackupPayload());
            await navigator.clipboard.writeText(text);
            showAlertModal(t('exportSuccess'));
        } catch (error) {
            showAlertModal(error?.message || t('errorExportClipboard'));
        }
    }

    function importBackup() {
        showConfirmModal(t('importConfirm'), () => {
            importBackupFromClipboard();
        }, t('import'));
    }

    async function importBackupFromClipboard() {
        if (!navigator.clipboard?.readText) {
            showAlertModal(t('errorImportClipboard'));
            return;
        }

        try {
            const text = await navigator.clipboard.readText();
            const data = parseBackupPayload(text);
            applyBackupData(data);
            showAlertModal(t('importSuccess'));
        } catch (error) {
            showAlertModal(error?.message || t('errorImportClipboard'));
        }
    }

    function showAlertModal(message) {
        const modal = document.getElementById('alertModal');
        const messageEl = document.getElementById('alertModalMessage');
        if (!modal || !messageEl) return;

        messageEl.textContent = message;
        modal.classList.remove('hidden');
        document.getElementById('alertModalOk')?.focus();
    }

    function closeAlertModal() {
        const modal = document.getElementById('alertModal');
        if (!modal) return;
        modal.classList.add('hidden');
    }

    function showConfirmModal(message, onConfirm, okLabel) {
        const modal = document.getElementById('confirmModal');
        const messageEl = document.getElementById('confirmModalMessage');
        const okBtn = document.getElementById('confirmModalOk');
        if (!modal || !messageEl) return;

        messageEl.textContent = message;
        confirmModalCallback = onConfirm;
        if (okBtn) {
            okBtn.textContent = okLabel || t('delete');
        }
        modal.classList.remove('hidden');
        okBtn?.focus();
    }

    function closeConfirmModal() {
        const modal = document.getElementById('confirmModal');
        if (!modal) return;

        modal.classList.add('hidden');
        confirmModalCallback = null;
    }

    function confirmModalOk() {
        const callback = confirmModalCallback;
        closeConfirmModal();
        if (callback) callback();
    }

    document.addEventListener('click', (event) => {
        if (!document.getElementById('langSwitcher')?.contains(event.target)) {
            closeLangDropdown();
        }
    });

    document.addEventListener('keydown', (event) => {
        const confirmModal = document.getElementById('confirmModal');
        const alertModal = document.getElementById('alertModal');
        const addPersonModal = document.getElementById('addPersonModal');
        const iconPickerModal = document.getElementById('iconPickerModal');

        if (event.key === 'Escape') {
            if (confirmModal && !confirmModal.classList.contains('hidden')) {
                closeConfirmModal();
            } else if (alertModal && !alertModal.classList.contains('hidden')) {
                closeAlertModal();
            } else if (iconPickerModal && !iconPickerModal.classList.contains('hidden')) {
                closeIconPickerModal();
            } else if (addPersonModal && !addPersonModal.classList.contains('hidden')) {
                closeAddPersonModal();
            } else if (medFormOpen) {
                closeMedFormPanel();
            } else if (personEditMode) {
                cancelPersonEditMode();
            } else {
                closeLangDropdown();
            }
            return;
        }

        if (event.key === 'Enter' && alertModal && !alertModal.classList.contains('hidden')) {
            closeAlertModal();
            return;
        }

        if (event.key === 'Enter' && addPersonModal && !addPersonModal.classList.contains('hidden')) {
            confirmAddPerson();
        }
    });

    // Curăță datele introduse în formular pentru a lăsa loc următorului medicament
    function resetForm() {
        document.getElementById('medName').value = '';
        document.getElementById('medQty').value = '';
        setStartDateInput(formatDateKey(new Date()));
        document.getElementById('medUnit').value = 'caps';
        document.getElementById('freqType').value = 'daily';
        document.getElementById('doseDim').value = '0';
        document.getElementById('dosePranz').value = '0';
        document.getElementById('doseSeara').value = '0';
        document.getElementById('intervalDays').value = '2';
        
        document.querySelectorAll('.day-checkbox').forEach(cb => cb.checked = false);
        updateUnitFields();
        toggleFreqFields();
    }

    // Salvează starea listei în memoria browserului
    function saveToStorage() {
        localStorage.setItem(MEDS_STORAGE_KEY, JSON.stringify(medications));
        pushNotificationSchedule();
    }

    // Încarcă datele salvate la pornirea/reîmprospătarea paginii
    window.onload = function() {
        const stored = localStorage.getItem(MEDS_STORAGE_KEY);
        if (stored) {
            medications = JSON.parse(stored);
            normalizeMedications();
        }
        migrateToPersons();
        loadChecksFromStorage();
        initCalendarViewStart();
        setStartDateInput(formatDateKey(new Date()));
        initLanguage();
        renderPersonList();
        pushNotificationSchedule();
        initAndroidBridge();
    };
</script>
