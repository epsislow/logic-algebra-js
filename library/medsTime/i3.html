<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Stoc Medicamente Persistent</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 350px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1, h2, h3 {
            color: #2c3e50;
            text-align: center;
        }
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        .flex-buttons {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
        }
        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .hidden {
            display: none !important;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 5px 0;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
            cursor: pointer;
        }
        .checkbox-label input {
            width: auto;
        }
        button {
            padding: 10px 15px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            flex: 1;
        }
        .dose-inputs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .btn-add { background-color: #27ae60; }
        .btn-add:hover { background-color: #219653; }
        .btn-reset-all { background-color: #7f8c8d; max-width: 150px; }
        .btn-reset-all:hover { background-color: #616a6b; }
        #medTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            table-layout: fixed;
        }
        #medTable thead {
            display: none;
        }
        #medTable .col-stock {
            width: 56px;
        }
        #medTable .col-actions {
            width: 32px;
        }
        #medTable td {
            padding: 6px 4px;
            text-align: left;
            vertical-align: middle;
        }
        #medTable tr.med-row-bottom td,
        #medTable tr.med-item td {
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }
        #medTable tr.med-item td {
            padding-top: 10px;
        }
        #medTable tr:hover {
            background-color: #f9f9f9;
        }
        .med-item-inner {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            grid-template-rows: auto auto;
            align-items: start;
            gap: 8px;
        }
        .med-line-top {
            display: contents;
        }
        .med-actions-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            align-self: stretch;
            grid-column: 3;
            grid-row: 1 / 3;
            gap: 4px;
        }
        .med-actions-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .copy-form-btn {
            background-color: #3498db;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 17px;
            line-height: 1;
            flex: none;
        }
        .copy-form-btn:hover {
            background-color: #2980b9;
        }
        .check-yesterday-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            flex: none;
        }
        .check-yesterday-btn:hover {
            background-color: #219653;
        }
        .med-line-bottom {
            grid-column: 1 / 3;
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 8px;
            margin-top: 4px;
            font-size: 12px;
        }
        .med-name-block {
            min-width: 0;
        }
        .med-name {
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .med-start {
            font-size: 11px;
            color: #7f8c8d;
            margin-top: 3px;
            padding-left: 18px;
        }
        .med-status-icon {
            flex-shrink: 0;
            font-size: 14px;
            line-height: 1;
        }
        .med-stock {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            text-align: right;
        }
        .stock-remaining {
            font-weight: bold;
            font-size: 15px;
            color: #2c3e50;
            min-width: 60px;
            text-align: right;
        }
        .med-unit {
            flex-shrink: 0;
            width: 24px;
            font-size: 12px;
            color: #7f8c8d;
            white-space: nowrap;
            text-align: left;
        }
        .qty-unit-row {
            display: grid;
            grid-template-columns: 1fr 100px;
            gap: 10px;
            align-items: end;
        }
        .med-end {
            white-space: nowrap;
        }
        .med-freq {
            text-align: right;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .status-urgent {
            color: #c0392b;
            font-weight: bold;
        }
        .status-warning {
            color: #e67e22;
            font-weight: bold;
        }
        .status-ok {
            color: #27ae60;
            font-weight: bold;
        }
        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            flex: none;
        }
        .delete-btn:hover {
            background-color: #c0392b;
        }
        .inline-qty {
            width: 60px;
            padding: 4px;
            text-align: center;
            font-size: 13px;
        }
        .search-box {
            margin-top: 12px;
        }
        .search-box input {
            width: 100%;
        }
        .plan-actions-bar {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .plan-actions-bar button {
            flex: 1;
        }
        .plan-actions-bar .btn-reset-all {
            max-width: none;
        }
        .btn-open-med-form {
            background-color: #27ae60;
        }
        .btn-open-med-form:hover {
            background-color: #219653;
        }
        .med-form-panel {
            margin-top: 16px;
        }
        .med-form-panel .form-group {
            margin-bottom: 0;
        }
        .med-form-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
            padding: 0 2px;
        }
        .med-form-title {
            font-weight: bold;
            font-size: 15px;
            color: #2c3e50;
        }
        .med-form-close-btn {
            width: 28px;
            height: 28px;
            flex: none;
            padding: 0;
            background: #f3f4f6;
            color: #2c3e50;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
        }
        .med-form-close-btn:hover {
            background: #e8eaed;
        }
        .btn-cancel-form {
            background-color: #7f8c8d;
        }
        .btn-cancel-form:hover {
            background-color: #616a6b;
        }
        .med-empty {
            text-align: center;
            padding: 12px;
            color: #7f8c8d;
            font-size: 14px;
        }
        .plan-tabs {
            display: flex;
            margin-top: 16px;
            border-bottom: 2px solid #e2e8f0;
        }
        .plan-tab {
            flex: 1;
            padding: 10px 8px;
            background: transparent;
            color: #7f8c8d;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            border-radius: 0;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .plan-tab:hover {
            color: #2c3e50;
            background: #f9fafb;
        }
        .plan-tab.active {
            color: #2c3e50;
            border-bottom-color: #3498db;
        }
        #medCalendar {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .calendar-day {
            background: #f9fafb;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
        }
        .calendar-day-today {
            border-color: #3498db;
            background: #f0f7ff;
        }
        .calendar-day-past {
            background: #f3f4f6;
            border-color: #d5d8dc;
        }
        .calendar-day-badge--past {
            background: #95a5a6;
        }
        .calendar-toolbar {
            margin-top: 12px;
        }
        .calendar-range label {
            font-size: 13px;
            margin-bottom: 6px;
        }
        .calendar-range-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .calendar-range-row input {
            flex: 1;
            min-width: 0;
        }
        .calendar-week-btn {
            background-color: #7f8c8d;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            flex: none;
            white-space: nowrap;
        }
        .calendar-week-btn:hover {
            background-color: #616a6b;
        }
        .calendar-today-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            flex: none;
            line-height: 1;
            margin-left: 4px;
        }
        .calendar-today-btn:hover {
            background-color: #219653;
        }
        .calendar-range input {
            width: 100%;
        }
        .confirm-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .confirm-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(44, 62, 80, 0.45);
        }
        .confirm-modal-box {
            position: relative;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            padding: 22px 20px 18px;
            max-width: 320px;
            width: 100%;
            z-index: 1;
        }
        .confirm-modal-message {
            margin: 0 0 20px;
            font-size: 15px;
            line-height: 1.45;
            color: #333;
            text-align: center;
        }
        .confirm-modal-actions {
            display: flex;
            gap: 10px;
        }
        .confirm-modal-cancel {
            background-color: #7f8c8d;
            flex: 1;
        }
        .confirm-modal-cancel:hover {
            background-color: #616a6b;
        }
        .confirm-modal-ok {
            background-color: #e74c3c;
            flex: 1;
        }
        .confirm-modal-ok:hover {
            background-color: #c0392b;
        }
        .person-list-heading {
            margin-top: 0;
            text-align: left;
            font-size: 15px;
        }
        #personList {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .person-card {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 14px 12px;
            background: #f9f9f9;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            color: #2c3e50;
            flex: none;
        }
        .person-card:hover {
            background: #f3f4f6;
            border-color: #d5d8dc;
        }
        .person-card-icon {
            font-size: 22px;
            flex: none;
        }
        .person-card-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .person-card-name {
            font-size: 16px;
            font-weight: bold;
        }
        .person-card-count {
            font-size: 12px;
            color: #7f8c8d;
        }
        .person-card-arrow {
            font-size: 22px;
            color: #95a5a6;
            flex: none;
            line-height: 1;
        }
        .btn-add-person {
            width: 100%;
            background-color: #27ae60;
            flex: none;
        }
        .btn-add-person:hover {
            background-color: #219653;
        }
        .person-plan-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0 12px;
            margin-bottom: 8px;
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
        }
        .person-back-btn {
            width: 36px;
            height: 36px;
            flex: none;
            padding: 0;
            background: #f3f4f6;
            color: #2c3e50;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
        }
        .person-back-btn:hover {
            background: #e8eaed;
        }
        .person-plan-title {
            font-weight: bold;
            font-size: 16px;
            color: #2c3e50;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .add-person-modal-input {
            width: 100%;
            margin-bottom: 16px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }
        .confirm-modal-add {
            background-color: #27ae60;
            flex: 1;
        }
        .confirm-modal-add:hover {
            background-color: #219653;
        }
        .calendar-range-hint {
            font-size: 11px;
            color: #7f8c8d;
            margin-top: 4px;
            text-align: center;
        }
        .calendar-day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
        }
        .calendar-day-title {
            font-weight: bold;
            color: #2c3e50;
            font-size: 15px;
        }
        .calendar-day-badge {
            font-size: 11px;
            background: #3498db;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: bold;
        }
        .calendar-periods {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .calendar-period {
            background: #fff;
            border-radius: 6px;
            padding: 10px;
            border-left: 4px solid #bdc3c7;
        }
        .calendar-period--dim {
            border-left-color: #f39c12;
        }
        .calendar-period--pranz {
            border-left-color: #e67e22;
        }
        .calendar-period--seara {
            border-left-color: #8e44ad;
        }
        .calendar-period-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .calendar-period-icon {
            font-size: 16px;
            line-height: 1;
        }
        .calendar-med-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .calendar-med-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: #f4f7f6;
            border-radius: 6px;
            font-size: 13px;
        }
        .calendar-med-item--done {
            background: #eafaf1;
        }
        .calendar-med-item--done .calendar-med-name {
            text-decoration: line-through;
            opacity: 0.7;
        }
        .calendar-med-check {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
            cursor: pointer;
            font-weight: normal;
            margin: 0;
        }
        .calendar-med-check input {
            width: auto;
            flex-shrink: 0;
            margin: 0;
            cursor: pointer;
        }
        .calendar-med-name {
            font-weight: 600;
            color: #2c3e50;
            word-break: break-word;
        }
        .calendar-med-name-wrap {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 0;
        }
        .calendar-med-start {
            font-size: 10px;
            color: #7f8c8d;
            font-weight: normal;
        }
        .calendar-med-dose {
            flex-shrink: 0;
            font-weight: bold;
            color: #fff;
            background: #34495e;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="appTitle">💊 Monitorizare & Calculator Medicamente</h1>

    <div id="personListView">
        <h3 class="person-list-heading">Persoane</h3>
        <div id="personList"></div>
        <button type="button" class="btn-add-person" onclick="openAddPersonModal()">＋ Persoană nouă</button>
    </div>

    <div id="personPlanView" class="hidden">
        <div class="person-plan-header">
            <button type="button" class="person-back-btn" onclick="closePersonPlan()" title="Înapoi" aria-label="Înapoi">←</button>
            <span class="person-plan-title" id="personPlanTitle"></span>
        </div>

        <div class="plan-actions-bar">
            <button type="button" class="btn-open-med-form" onclick="openAddMedForm()">Adaugă 💊</button>
            <button type="button" class="btn-reset-all" onclick="resetAll()">Șterge toate 💊</button>
        </div>
        <div class="search-box">
            <label for="medSearch">Caută medicament</label>
            <input type="search" id="medSearch" placeholder="Ex: Paracetamol" oninput="renderPlan()">
        </div>
        <div class="plan-tabs" role="tablist" aria-label="Vizualizare plan">
            <button type="button" id="tabPlanList" class="plan-tab active" role="tab" aria-selected="true" onclick="setPlanTab('list')">💊 Lista</button>
            <button type="button" id="tabPlanCalendar" class="plan-tab" role="tab" aria-selected="false" onclick="setPlanTab('calendar')">📅 Calendar</button>
        </div>

        <div id="medFormPanel" class="med-form-panel hidden">
            <div class="med-form-header">
                <span class="med-form-title" id="medFormTitle">Adaugă medicament</span>
                <button type="button" class="med-form-close-btn" onclick="closeMedFormPanel()" title="Închide" aria-label="Închide">×</button>
            </div>
            <div class="form-group">
        <div>
            <label for="medName">Nume Medicament</label>
            <input type="text" id="medName" placeholder="Ex: Paracetamol">
        </div>
        <div class="full-width qty-unit-row">
            <div>
                <label for="medQty" id="medQtyLabel">Cantitate inițială</label>
                <input type="number" id="medQty" min="1" step="1" placeholder="Ex: 30">
            </div>
            <div>
                <label for="medUnit">Unitate</label>
                <select id="medUnit" onchange="updateUnitFields()">
                    <option value="caps">Capsule</option>
                    <option value="ml">ml</option>
                    <option value="mg">mg</option>
                </select>
            </div>
        </div>
        <div>
            <label for="medStartDate">Data începerii</label>
            <input type="date" id="medStartDate" lang="ro">
        </div>
        <div>
            <label for="doseType">Doză Administrare</label>
            <div class="dose-inputs">
                <div>
                    <label style="font-size:0.75rem; font-weight:normal;">Dimineața</label>
                    <input type="number" id="doseDim" min="0" value="0">
                </div>
                <div>
                    <label style="font-size:0.75rem; font-weight:normal;">Prânz</label>
                    <input type="number" id="dosePranz" min="0" value="0">
                </div>
                <div>
                    <label style="font-size:0.75rem; font-weight:normal;">Seara</label>
                    <input type="number" id="doseSeara" min="0" value="0">
                </div>
            </div>

        </div>
        <div>
            <label for="freqType">Frecvență Administrare</label>
            <select id="freqType" onchange="toggleFreqFields()">
                <option value="daily">În fiecare zi</option>
                <option value="interval">La interval de zile (ex: o zi da, o zi nu)</option>
                <option value="days">Zile specifice din săptămână</option>
            </select>
        </div>

        <!-- Câmp dinamic pentru intervale (o zi da, o zi nu / o dată la X zile) -->
        <div id="intervalContainer" class="hidden">
            <label for="intervalDays">Repetă la fiecare (zile)</label>
            <select id="intervalDays">
                <option value="2">2 zile (O zi da, o zi nu)</option>
                <option value="3">3 zile (O zi da, două nu)</option>
                <option value="4">4 zile</option>
                <option value="5">5 zile</option>
            </select>
        </div>

        <!-- Câmp dinamic pentru zile specifice din săptămână -->
        <div id="daysContainer" class="full-width hidden">
            <label>Selectează zilele în care iei medicamentul:</label>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" class="day-checkbox" value="1"> Luni</label>
                <label class="checkbox-label"><input type="checkbox" class="day-checkbox" value="2"> Marți</label>
                <label class="checkbox-label"><input type="checkbox" class="day-checkbox" value="3"> Miercuri</label>
                <label class="checkbox-label"><input type="checkbox" class="day-checkbox" value="4"> Joi</label>
                <label class="checkbox-label"><input type="checkbox" class="day-checkbox" value="5"> Vineri</label>
                <label class="checkbox-label"><input type="checkbox" class="day-checkbox" value="6"> Sâmbătă</label>

                <col class="col-name">

                    <input type="date" id="calendarViewStart" lang="ro" onchange="onCalendarViewStartChange()">
                    <button type="button" class="calendar-week-btn" onclick="shiftCalendarViewStart(1)">+1w</button>
                    <button type="button" class="calendar-today-btn" title="Azi" aria-label="Azi" onclick="goToCalendarToday()">↓</button>

    <div class="confirm-modal-backdrop" onclick="closeAddPersonModal()"></div>

        <p id="addPersonModalLabel" class="confirm-modal-message">Persoană nouă</p>
        <input type="text" id="addPersonName" class="add-person-modal-input" placeholder="Ex: Mama" maxlength="50">
        <div class="confirm-modal-actions">
            <button type="button" class="confirm-modal-cancel" onclick="closeAddPersonModal()">Anulează</button>
            <button type="button" class="confirm-modal-add" onclick="confirmAddPerson()">Adaugă</button>

<script>
    // Tabloul global în care stocăm obiectele medicamentelor
    let medications = [];
    let persons = [];
    let selectedPersonId = null;
    let showCalendarView = false;
    let medFormOpen = false;
    let medChecks = {};
    let confirmModalCallback = null;

    const PERSONS_STORAGE_KEY = 'medicationsPersons_v1';
    const MEDS_STORAGE_KEY = 'medicationsStockApp_v2';

    const DAYS_SHORT = ["D", "L", "M", "Mi", "J", "V", "S"];

    const UNIT_LABELS = { caps: 'caps', ml: 'ml', mg: 'mg' };
    const UNIT_STOCK_LABELS = {
        caps: 'Cantitate inițială (caps)',
        ml: 'Cantitate inițială (ml)',
        mg: 'Cantitate inițială (mg)'
    };
    const PERIOD_ORDER = { dim: 0, pranz: 1, seara: 2 };
    const PERIODS = ['dim', 'pranz', 'seara'];

    function getMedUnit(med) {
        return med.unit || 'caps';
    }

    function parseDoseValue(value, unit) {
        const parsed = unit === 'caps' ? parseInt(value, 10) : parseFloat(value);
        return isNaN(parsed) ? 0 : parsed;
    }

    function parseQtyValue(value, unit) {
        const parsed = unit === 'caps' ? parseInt(value, 10) : parseFloat(value);
        return isNaN(parsed) ? NaN : parsed;
    }

    function formatDoseValue(value, unit) {
        if (unit === 'caps') return String(Math.round(value));
        return parseFloat(Number(value).toFixed(2)).toString();
    }

    function updateUnitFields() {
        const unit = document.getElementById('medUnit').value;
        const qtyInput = document.getElementById('medQty');
        const doseIds = ['doseDim', 'dosePranz', 'doseSeara'];

        document.getElementById('medQtyLabel').textContent = UNIT_STOCK_LABELS[unit];

        if (unit === 'caps') {
            qtyInput.step = '1';
            qtyInput.min = '1';
            qtyInput.placeholder = 'Ex: 30';
            doseIds.forEach(id => {
                const el = document.getElementById(id);
                el.step = '1';
                el.min = '0';
            });
        } else {
            qtyInput.step = '0.1';
            qtyInput.min = '0.1';
            qtyInput.placeholder = unit === 'ml' ? 'Ex: 100' : 'Ex: 500';
            doseIds.forEach(id => {
                const el = document.getElementById(id);
                el.step = '0.1';
                el.min = '0';
            });
        }
    }

    function getMedStartDate(med) {
        return med.startDate || formatDateKey(new Date());
    }

    function getMedInitialQty(med) {
        return med.initialQty ?? med.qty ?? 0;
    }

    function parseDateKey(dateKey) {
        const [year, month, day] = dateKey.split('-').map(Number);
        const date = new Date(year, month - 1, day);
        date.setHours(0, 0, 0, 0);
        return date;
    }

    function compareDateKeys(a, b) {
        return a.localeCompare(b);
    }

    function getDoseForPeriod(med, period) {
        if (period === 'dim') return med.dim;
        if (period === 'pranz') return med.pranz;
        return med.seara;
    }

    function getUniqueMedName(inputName) {
        const base = inputName.trim();
        const related = getPersonMedications().filter(med => {
            if (med.name === base) return true;
            const match = med.name.match(/^(.+) #(\d+)$/);
            return match && match[1] === base;
        });

        if (related.length === 0) return base;

        let maxSuffix = 0;
        related.forEach(med => {
            if (med.name === base) {
                maxSuffix = Math.max(maxSuffix, 1);
            } else {
                const match = med.name.match(/ #(\d+)$/);
                if (match) maxSuffix = Math.max(maxSuffix, parseInt(match[1], 10));
            }
        });

        return `${base} #${maxSuffix + 1}`;
    }

    function formatMedStartLabel(med) {
        return `Start: ${formatDateLabel(parseDateKey(getMedStartDate(med)))}`;
    }

    function normalizeMedications() {
        const todayKey = formatDateKey(new Date());
        medications = medications.map(med => ({
            ...med,
            unit: med.unit || 'caps',
            initialQty: med.initialQty ?? med.qty ?? 0,
            startDate: med.startDate || todayKey
        }));
    }

    // Ascunde sau arată câmpurile suplimentare în funcție de frecvența aleasă
    function toggleFreqFields() {
        const type = document.getElementById('freqType').value;
        const intervalDiv = document.getElementById('intervalContainer');
        const daysDiv = document.getElementById('daysContainer');

        if (type === 'interval') {
            intervalDiv.classList.remove('hidden');
            daysDiv.classList.add('hidden');
        } else if (type === 'days') {
            intervalDiv.classList.add('hidden');
            daysDiv.classList.remove('hidden');
        } else {
            intervalDiv.classList.add('hidden');
            daysDiv.classList.add('hidden');
        }
    }

    // Adaugă un medicament nou în memorie și în tabel
    function addMedication() {
        if (!selectedPersonId) return;

        const name = document.getElementById('medName').value.trim();
        const unit = document.getElementById('medUnit').value;
        const qty = parseQtyValue(document.getElementById('medQty').value, unit);
        const freqType = document.getElementById('freqType').value;
        const dim = parseDoseValue(document.getElementById('doseDim').value, unit);
        const pranz = parseDoseValue(document.getElementById('dosePranz').value, unit);
        const seara = parseDoseValue(document.getElementById('doseSeara').value, unit);

        let intervalDays = 1;
        let specificDays = [];

        const startDate = getStartDateFromForm();

        if (!name || isNaN(qty) || qty <= 0) {
            alert("Te rog să introduci un nume valid și cantitatea inițială.");
            return;
        }

        if (!document.getElementById('medStartDate').value) {
            alert("Selectează data începerii.");
            return;
        }

        if (freqType === 'interval') {
            intervalDays = parseInt(document.getElementById('intervalDays').value) || 2;
        } else if (freqType === 'days') {
            const checkedBoxes = document.querySelectorAll('.day-checkbox:checked');
            checkedBoxes.forEach(cb => specificDays.push(cb.value));

            if (specificDays.length === 0) {
                alert("Selectează cel puțin o zi din săptămână.");
                return;
            }
        }

        const totalDaily = dim + pranz + seara;
        if (totalDaily === 0) {
            alert("Introdu doza zilnică (cel puțin o valoare dimineața, la prânz sau seara).");
            return;
        }

        const newMedId = Date.now().toString();
        const newMed = {
            id: newMedId,
            personId: selectedPersonId,
            name: getUniqueMedName(name),
            initialQty: qty,
            startDate,
            unit,
            freqType,
            interval: intervalDays,
            specificDays,
            dim,
            pranz,
            seara
        };

        medications.push(newMed);
        saveToStorage();
        closeMedFormPanel();
        showListView();
        renderPlan();
        renderPersonList();
        scrollToMedItem(newMedId);
    }

    function getCurrentRemaining(med) {
        const epsilon = 0.0001;
        let consumed = 0;
        const startDate = getMedStartDate(med);

        Object.keys(medChecks).forEach(key => {
            if (!medChecks[key]) return;
            const [medId, dateKey, period] = key.split('|');
            if (medId !== med.id) return;
            if (compareDateKeys(dateKey, startDate) < 0) return;
            consumed += getDoseForPeriod(med, period);
        });

        return Math.max(0, getMedInitialQty(med) - consumed);
    }

    function isMedScheduledOnDate(med, date) {
        const dateKey = formatDateKey(date);
        if (compareDateKeys(dateKey, getMedStartDate(med)) < 0) {
            return false;
        }

        if (med.freqType === 'daily') {
            return true;
        }

        const startDate = parseDateKey(getMedStartDate(med));
        const offsetFromStart = Math.round((date - startDate) / (24 * 60 * 60 * 1000));

        if (med.freqType === 'interval') {
            return ((offsetFromStart % med.interval) + med.interval) % med.interval === 0;
        }

        if (med.freqType === 'days') {
            return med.specificDays.includes(date.getDay().toString());
        }

        return false;
    }

    function getRemainingBeforeDose(med, dateKey, period) {
        const epsilon = 0.0001;
        const startDate = getMedStartDate(med);
        const todayKey = formatDateKey(new Date());
        let remaining = getMedInitialQty(med);
        const targetDate = parseDateKey(dateKey);
        let current = parseDateKey(startDate);

        while (current <= targetDate) {
            const currentKey = formatDateKey(current);

            for (const p of PERIODS) {
                if (currentKey === dateKey && p === period) {
                    return remaining;
                }

                if (!isMedScheduledOnDate(med, current)) {
                    continue;
                }

                const dose = getDoseForPeriod(med, p);
                if (dose <= 0) {
                    continue;
                }

                if (isMedChecked(med.id, currentKey, p)) {
                    remaining -= dose;
                } else if (compareDateKeys(currentKey, todayKey) > 0) {
                    remaining -= dose;
                }

                if (remaining < epsilon) {
                    return remaining;
                }
            }

            current.setDate(current.getDate() + 1);
        }

        return remaining;
    }

    function shouldShowDoseInCalendar(med, date, dateKey, period) {
        if (compareDateKeys(dateKey, getMedStartDate(med)) < 0) {
            return false;
        }
        if (!isMedScheduledOnDate(med, date)) {
            return false;
        }

        const dose = getDoseForPeriod(med, period);
        if (dose <= 0) {
            return false;
        }

        return getRemainingBeforeDose(med, dateKey, period) >= dose - 0.0001;
    }

    // Calculează data la care se termină stocul; returnează timestamp pentru sortare și text afișat
    function calculateStockOut(med) {
        const epsilon = 0.0001;
        let currentQty = getCurrentRemaining(med);
        let checkDate = new Date();
        checkDate.setHours(0, 0, 0, 0);

        if (currentQty <= epsilon) {
            const day = String(checkDate.getDate()).padStart(2, '0');
            const month = String(checkDate.getMonth() + 1).padStart(2, '0');
            const year = checkDate.getFullYear();
            return {
                timestamp: checkDate.getTime(),
                label: `${DAYS_SHORT[checkDate.getDay()]}, ${day}.${month}.${year}`
            };
        }

        let iterations = 0;
        const maxSafetyIterations = 5000;

        while (currentQty > epsilon && iterations < maxSafetyIterations) {
            if (isMedScheduledOnDate(med, checkDate)) {
                for (const period of PERIODS) {
                    const dose = getDoseForPeriod(med, period);
                    if (dose <= 0) continue;
                    if (currentQty < dose - epsilon) {
                        iterations = maxSafetyIterations;
                        break;
                    }
                    currentQty -= dose;
                    if (currentQty <= epsilon) break;
                }
            }

            if (currentQty <= epsilon) {
                break;
            }

            checkDate.setDate(checkDate.getDate() + 1);
            iterations++;
        }

        if (iterations >= maxSafetyIterations) {
            return { timestamp: Number.MAX_SAFE_INTEGER, label: "Peste 10+ ani" };
        }

        const day = String(checkDate.getDate()).padStart(2, '0');
        const month = String(checkDate.getMonth() + 1).padStart(2, '0');
        const year = checkDate.getFullYear();
        const dayName = DAYS_SHORT[checkDate.getDay()];

        return {
            timestamp: checkDate.getTime(),
            label: `${dayName}, ${day}.${month}.${year}`
        };
    }

    // Clasă de culoare în funcție de câte zile mai sunt până la epuizarea stocului
    function getStockStatusClass(stockOut) {
        if (stockOut.timestamp === Number.MAX_SAFE_INTEGER) {
            return 'status-ok';
        }

        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const endDate = new Date(stockOut.timestamp);
        const daysUntil = Math.ceil((endDate - today) / (24 * 60 * 60 * 1000));

        if (daysUntil <= 15) return 'status-urgent';
        if (daysUntil <= 30) return 'status-warning';
        return 'status-ok';
    }

    function getStockStatusIcon(statusClass) {
        if (statusClass === 'status-urgent') {
            return '<span class="med-status-icon" title="Stoc epuizat în curând">⚠️</span>';
        }
        if (statusClass === 'status-warning') {
            return '<span class="med-status-icon" title="Stoc limitat">🟠</span>';
        }
        if (statusClass === 'status-ok') {
            return '<span class="med-status-icon" title="Stoc suficient">🟢</span>';
        }
        return '';
    }

    // Formatează frecvența compact: 1/z, 1/3z, L Mi V 1/z
    function formatFreqText(med, totalDaily) {
        const doseText = formatDoseValue(totalDaily, getMedUnit(med));

        if (med.freqType === 'daily') {
            return `${doseText}/z`;
        }
        if (med.freqType === 'interval') {
            return `${doseText}/${med.interval}z`;
        }
        if (med.freqType === 'days') {
            const daysMap = { '1': 'L', '2': 'M', '3': 'Mi', '4': 'J', '5': 'V', '6': 'S', '0': 'D' };
            const dayOrder = ['1', '2', '3', '4', '5', '6', '0'];
            const sorted = med.specificDays.slice().sort((a, b) => dayOrder.indexOf(a) - dayOrder.indexOf(b));
            const days = sorted.map(d => daysMap[d]).join(' ');
            return `${days} ${doseText}/z`;
        }
        return '';
    }

    function getSearchQuery() {
        return (document.getElementById('medSearch')?.value || '').trim().toLowerCase();
    }

    function getFilteredMedications() {
        const searchQuery = getSearchQuery();
        return getPersonMedications()
            .filter(med => !searchQuery || med.name.toLowerCase().includes(searchQuery));
    }

    function getPersonMedications(personId = selectedPersonId) {
        return medications.filter(med => med.personId === personId);
    }

    function getPersonMedCount(personId) {
        return medications.filter(med => med.personId === personId).length;
    }

    function formatMedCountLabel(count) {
        if (count === 1) return '1 medicament';
        return `${count} medicamente`;
    }

    function getSelectedPerson() {
        return persons.find(person => person.id === selectedPersonId) || null;
    }

    function renderPersonList() {
        const container = document.getElementById('personList');
        if (!container) return;

        if (persons.length === 0) {
            container.innerHTML = '<p class="med-empty">Nicio persoană.</p>';
            return;
        }

        container.innerHTML = persons.map(person => {
            const count = getPersonMedCount(person.id);
            const safeName = person.name.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return `<button type="button" class="person-card" onclick="openPerson('${person.id}')">
                <span class="person-card-icon" aria-hidden="true">👤</span>
                <span class="person-card-info">
                    <span class="person-card-name">${safeName}</span>
                    <span class="person-card-count">${formatMedCountLabel(count)}</span>
                </span>
                <span class="person-card-arrow" aria-hidden="true">›</span>
            </button>`;
        }).join('');
    }

    function openPerson(personId) {
        if (!persons.some(person => person.id === personId)) return;

        selectedPersonId = personId;
        showCalendarView = false;
        closeMedFormPanel();

        document.getElementById('personListView').classList.add('hidden');
        document.getElementById('personPlanView').classList.remove('hidden');
        document.getElementById('appTitle').classList.add('hidden');

        const person = getSelectedPerson();
        document.getElementById('personPlanTitle').textContent = `👤 ${person?.name || ''}`;

        showListView();
        renderPlan();
    }

    function closePersonPlan() {
        selectedPersonId = null;
        showCalendarView = false;
        closeMedFormPanel();

        document.getElementById('personPlanView').classList.add('hidden');
        document.getElementById('personListView').classList.remove('hidden');
        document.getElementById('appTitle').classList.remove('hidden');

        renderPersonList();
    }

    function openAddPersonModal() {
        const modal = document.getElementById('addPersonModal');
        const input = document.getElementById('addPersonName');
        if (!modal || !input) return;

        input.value = '';
        modal.classList.remove('hidden');
        input.focus();
    }

    function closeAddPersonModal() {
        document.getElementById('addPersonModal')?.classList.add('hidden');
    }

    function confirmAddPerson() {
        const input = document.getElementById('addPersonName');
        const name = (input?.value || '').trim();
        if (!name) {
            alert('Introdu un nume pentru persoană.');
            input?.focus();
            return;
        }

        const newPerson = {
            id: `person_${Date.now()}`,
            name
        };

        persons.push(newPerson);
        savePersonsToStorage();
        closeAddPersonModal();
        renderPersonList();
        openPerson(newPerson.id);
    }

    function savePersonsToStorage() {
        localStorage.setItem(PERSONS_STORAGE_KEY, JSON.stringify(persons));
    }

    function migrateToPersons() {
        const storedPersons = localStorage.getItem(PERSONS_STORAGE_KEY);
        if (storedPersons) {
            persons = JSON.parse(storedPersons);
        } else {
            const defaultPerson = { id: 'person_default', name: 'Eu' };
            persons = [defaultPerson];
            medications = medications.map(med => ({
                ...med,
                personId: med.personId || defaultPerson.id
            }));
            savePersonsToStorage();
            saveToStorage();
        }

        if (persons.length === 0) {
            const defaultPerson = { id: `person_${Date.now()}`, name: 'Eu' };
            persons = [defaultPerson];
            savePersonsToStorage();
        }

        const fallbackPersonId = persons[0].id;
        medications = medications.map(med => ({
            ...med,
            personId: persons.some(person => person.id === med.personId) ? med.personId : fallbackPersonId
        }));
    }

    function formatDateKey(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${year}-${month}-${day}`;
    }

    function getStartDateFromForm() {
        return document.getElementById('medStartDate').value || formatDateKey(new Date());
    }

    function setStartDateInput(dateKey) {
        document.getElementById('medStartDate').value = dateKey;
    }

    function getCheckKey(medId, dateKey, period) {
        return `${medId}|${dateKey}|${period}`;
    }

    function isMedChecked(medId, dateKey, period) {
        return !!medChecks[getCheckKey(medId, dateKey, period)];
    }

    function toggleMedCheck(medId, dateKey, period, checked) {
        const key = getCheckKey(medId, dateKey, period);
        if (checked) {
            medChecks[key] = true;
        } else {
            delete medChecks[key];
        }
        saveChecksToStorage();
        renderPlan();
    }

    function removeChecksForMed(medId) {
        const prefix = `${medId}|`;
        Object.keys(medChecks).forEach(key => {
            if (key.startsWith(prefix)) {
                delete medChecks[key];
            }
        });
        saveChecksToStorage();
    }

    function saveChecksToStorage() {
        localStorage.setItem('medicationsChecks_v1', JSON.stringify(medChecks));
    }

    function loadChecksFromStorage() {
        const stored = localStorage.getItem('medicationsChecks_v1');
        medChecks = stored ? JSON.parse(stored) : {};
    }

    function formatDateLabel(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${DAYS_SHORT[date.getDay()]}, ${day}.${month}.${year}`;
    }

    function isMedTakenOnDayOffset(med, dayOffset) {
        const date = new Date();
        date.setHours(0, 0, 0, 0);
        date.setDate(date.getDate() + dayOffset);
        return isMedScheduledOnDate(med, date);
    }

    function formatCalendarMedItem(med, amount, dateKey, period) {
        const unit = getMedUnit(med);
        const checked = isMedChecked(med.id, dateKey, period);
        const doneClass = checked ? ' calendar-med-item--done' : '';
        const checkedAttr = checked ? ' checked' : '';

        return `<li class="calendar-med-item${doneClass}">
            <label class="calendar-med-check">
                <input type="checkbox"${checkedAttr} onchange="toggleMedCheck('${med.id}', '${dateKey}', '${period}', this.checked); this.closest('.calendar-med-item').classList.toggle('calendar-med-item--done', this.checked)">
                <span class="calendar-med-name-wrap">
                    <span class="calendar-med-name">${med.name}</span>
                    <span class="calendar-med-start">${formatMedStartLabel(med)}</span>
                </span>
            </label>
            <span class="calendar-med-dose">${formatDoseValue(amount, unit)} ${UNIT_LABELS[unit]}</span>
        </li>`;
    }

    function renderCalendarPeriod(periodClass, icon, title, medItems) {
        if (medItems.length === 0) return '';
        return `
            <div class="calendar-period ${periodClass}">
                <div class="calendar-period-title">
                    <span class="calendar-period-icon">${icon}</span>
                    <span>${title}</span>
                </div>
                <ul class="calendar-med-list">${medItems.join('')}</ul>
            </div>`;
    }

    function getYesterdayDate() {
        const yesterday = new Date();
        yesterday.setHours(0, 0, 0, 0);
        yesterday.setDate(yesterday.getDate() - 1);
        return yesterday;
    }

    function getCalendarViewStart() {
        const input = document.getElementById('calendarViewStart');
        return (input && input.value) ? input.value : formatDateKey(new Date());
    }

    function onCalendarViewStartChange() {
        localStorage.setItem('calendarViewStart', getCalendarViewStart());
        updateCalendarRangeHint();
        renderCalendar();
    }

    function shiftCalendarViewStart(weeks) {
        const input = document.getElementById('calendarViewStart');
        if (!input) return;

        const current = parseDateKey(getCalendarViewStart());
        current.setDate(current.getDate() + weeks * 7);
        input.value = formatDateKey(current);
        onCalendarViewStartChange();
    }

    function goToCalendarToday() {
        const input = document.getElementById('calendarViewStart');
        if (!input) return;

        input.value = formatDateKey(new Date());
        onCalendarViewStartChange();
    }

    function updateCalendarRangeHint() {
        const hint = document.getElementById('calendarRangeHint');
        if (!hint) return;

        const viewStart = parseDateKey(getCalendarViewStart());
        const viewEnd = new Date(viewStart);
        viewEnd.setDate(viewEnd.getDate() + 13);

        hint.textContent = `Până la ${formatDateLabel(viewEnd)} (14 zile)`;
    }

    function initCalendarViewStart() {
        const stored = localStorage.getItem('calendarViewStart');
        const input = document.getElementById('calendarViewStart');
        if (!input) return;

        input.value = stored || formatDateKey(new Date());
        updateCalendarRangeHint();
    }

    function forEachScheduledDoseUntil(med, endDate, callback) {
        const medStart = parseDateKey(getMedStartDate(med));
        let current = new Date(medStart);

        while (current <= endDate) {
            if (isMedScheduledOnDate(med, current)) {
                const dateKey = formatDateKey(current);
                for (const period of PERIODS) {
                    const dose = getDoseForPeriod(med, period);
                    if (dose <= 0) continue;
                    if (getRemainingBeforeDose(med, dateKey, period) < dose - 0.0001) continue;
                    callback(dateKey, period);
                }
            }
            current.setDate(current.getDate() + 1);
        }
    }

    function hasUncheckedDosesUntilYesterday(med) {
        const yesterday = getYesterdayDate();
        const medStart = parseDateKey(getMedStartDate(med));
        if (yesterday < medStart) return false;

        let hasAnyDose = false;
        let hasUnchecked = false;

        forEachScheduledDoseUntil(med, yesterday, (dateKey, period) => {
            hasAnyDose = true;
            if (!isMedChecked(med.id, dateKey, period)) {
                hasUnchecked = true;
            }
        });

        return hasAnyDose && hasUnchecked;
    }

    function autoCheckMedUntilYesterday(medId) {
        const med = medications.find(m => m.id === medId);
        if (!med) return;

        const yesterday = getYesterdayDate();
        let addedChecks = 0;

        forEachScheduledDoseUntil(med, yesterday, (dateKey, period) => {
            if (!isMedChecked(med.id, dateKey, period)) {
                medChecks[getCheckKey(med.id, dateKey, period)] = true;
                addedChecks++;
            }
        });

        if (addedChecks === 0) return;

        saveChecksToStorage();
        renderPlan();
    }

    function renderCalendar() {
        const container = document.getElementById('medCalendar');
        container.innerHTML = '';

        const filteredMeds = getFilteredMedications();
        let hasAnyDay = false;

        const viewStart = parseDateKey(getCalendarViewStart());
        const viewEnd = new Date(viewStart);
        viewEnd.setDate(viewEnd.getDate() + 13);
        const todayKey = formatDateKey(new Date());

        let current = new Date(viewStart);
        while (current <= viewEnd) {
            const date = new Date(current);
            const dateKey = formatDateKey(date);

            const dimMeds = [];
            const pranzMeds = [];
            const searaMeds = [];

            filteredMeds.forEach(med => {
                if (med.dim > 0 && shouldShowDoseInCalendar(med, date, dateKey, 'dim')) {
                    dimMeds.push(formatCalendarMedItem(med, med.dim, dateKey, 'dim'));
                }
                if (med.pranz > 0 && shouldShowDoseInCalendar(med, date, dateKey, 'pranz')) {
                    pranzMeds.push(formatCalendarMedItem(med, med.pranz, dateKey, 'pranz'));
                }
                if (med.seara > 0 && shouldShowDoseInCalendar(med, date, dateKey, 'seara')) {
                    searaMeds.push(formatCalendarMedItem(med, med.seara, dateKey, 'seara'));
                }
            });

            if (dimMeds.length === 0 && pranzMeds.length === 0 && searaMeds.length === 0) {
                current.setDate(current.getDate() + 1);
                continue;
            }

            hasAnyDay = true;
            const dayEl = document.createElement('div');
            let dayClass = 'calendar-day';
            if (dateKey === todayKey) dayClass += ' calendar-day-today';
            if (compareDateKeys(dateKey, todayKey) < 0) dayClass += ' calendar-day-past';
            dayEl.className = dayClass;

            let dayBadge = '';
            if (dateKey === todayKey) {
                dayBadge = '<span class="calendar-day-badge">Azi</span>';
            } else if (compareDateKeys(dateKey, todayKey) < 0) {
                dayBadge = '<span class="calendar-day-badge calendar-day-badge--past">Trecut</span>';
            }
            let html = `
                <div class="calendar-day-header">
                    <div class="calendar-day-title">${formatDateLabel(date)}</div>
                    ${dayBadge}
                </div>
                <div class="calendar-periods">`;

            html += renderCalendarPeriod('calendar-period--dim', '🌅', 'Dimineața', dimMeds);
            html += renderCalendarPeriod('calendar-period--pranz', '☀️', 'Prânz', pranzMeds);
            html += renderCalendarPeriod('calendar-period--seara', '🌙', 'Seara', searaMeds);

            html += '</div>';

            dayEl.innerHTML = html;
            container.appendChild(dayEl);
            current.setDate(current.getDate() + 1);
        }

        if (!hasAnyDay) {
            container.innerHTML = '<p class="med-empty">Niciun medicament de luat în perioada selectată.</p>';
        }
    }

    function renderPlan() {
        if (showCalendarView) {
            updateCalendarRangeHint();
            renderCalendar();
        } else {
            renderTable();
        }
    }

    function showListView() {
        setPlanTab('list');
    }

    function updatePlanTabsUI() {
        const tabList = document.getElementById('tabPlanList');
        const tabCalendar = document.getElementById('tabPlanCalendar');
        if (!tabList || !tabCalendar) return;

        tabList.classList.toggle('active', !showCalendarView);
        tabList.setAttribute('aria-selected', String(!showCalendarView));
        tabCalendar.classList.toggle('active', showCalendarView);
        tabCalendar.setAttribute('aria-selected', String(showCalendarView));
    }

    function setPlanTab(tab) {
        const isCalendar = tab === 'calendar';

        if (isCalendar) {
            closeMedFormPanel();
            initCalendarViewStart();
        }

        showCalendarView = isCalendar;
        document.getElementById('planListView').classList.toggle('hidden', isCalendar);
        document.getElementById('planCalendarView').classList.toggle('hidden', !isCalendar);
        updatePlanTabsUI();
        renderPlan();
    }

    function openAddMedForm() {
        if (!selectedPersonId) return;

        if (showCalendarView) {
            showListView();
        }

        resetForm();
        document.getElementById('medFormTitle').textContent = 'Adaugă medicament';
        document.getElementById('medFormPanel').classList.remove('hidden');
        medFormOpen = true;
        document.getElementById('medFormPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        document.getElementById('medName').focus();
    }

    function closeMedFormPanel() {
        document.getElementById('medFormPanel')?.classList.add('hidden');
        medFormOpen = false;
        resetForm();
    }

    function fillMedFormFromMedication(med) {
        const unit = getMedUnit(med);

        document.getElementById('medName').value = getBaseMedName(med.name);
        document.getElementById('medQty').value = formatDoseValue(getMedInitialQty(med), unit);
        document.getElementById('medUnit').value = unit;
        setStartDateInput(getMedStartDate(med));
        updateUnitFields();

        document.getElementById('doseDim').value = formatDoseValue(med.dim, unit);
        document.getElementById('dosePranz').value = formatDoseValue(med.pranz, unit);
        document.getElementById('doseSeara').value = formatDoseValue(med.seara, unit);

        document.getElementById('freqType').value = med.freqType;
        toggleFreqFields();

        if (med.freqType === 'interval') {
            document.getElementById('intervalDays').value = String(med.interval);
        } else if (med.freqType === 'days') {
            document.querySelectorAll('.day-checkbox').forEach(cb => {
                cb.checked = med.specificDays.includes(cb.value);
            });
        }
    }

    function scrollToMedItem(medId) {
        requestAnimationFrame(() => {
            const row = document.querySelector(`#medTable tr[data-med-id="${medId}"]`);
            row?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
    }

    // Desenează tabelul pe ecran utilizând datele salvate
    function renderTable() {
        const tableBody = document.querySelector('#medTable tbody');
        tableBody.innerHTML = '';

        const sortedMeds = getFilteredMedications()
            .map(med => ({ med, stockOut: calculateStockOut(med) }))
            .sort((a, b) => a.stockOut.timestamp - b.stockOut.timestamp);

        if (sortedMeds.length === 0) {
            const emptyRow = document.createElement('tr');
            emptyRow.innerHTML = `<td colspan="3" class="med-empty">Niciun medicament găsit.</td>`;
            tableBody.appendChild(emptyRow);
            return;
        }

        sortedMeds.forEach(({ med, stockOut }) => {
            const unit = getMedUnit(med);
            const remaining = getCurrentRemaining(med);
            const totalDaily = med.dim + med.pranz + med.seara;
            const freqText = formatFreqText(med, totalDaily);

            const statusClass = getStockStatusClass(stockOut);
            const statusIcon = getStockStatusIcon(statusClass);
            const showCheckBtn = hasUncheckedDosesUntilYesterday(med);
            const checkBtn = showCheckBtn
                ? `<button class="check-yesterday-btn" onclick="autoCheckMedUntilYesterday('${med.id}')" title="Check până ieri" aria-label="Check până ieri">✓</button>`
                : '';

            const startLabel = formatMedStartLabel(med);

            const row = document.createElement('tr');
            row.className = 'med-item';
            row.dataset.medId = med.id;
            row.innerHTML = `
                <td colspan="3">
                    <div class="med-item-inner">
                        <div class="med-name-block">
                            <div class="med-name">${statusIcon}<strong>${med.name}</strong></div>
                            <div class="med-start">${startLabel}</div>
                        </div>
                        <div class="med-stock">
                            <span class="stock-remaining">${formatDoseValue(remaining, unit)}</span>
                            <span class="med-unit">${UNIT_LABELS[unit]}</span>
                        </div>
                        <div class="med-actions-col">
                            <div class="med-actions-group">
                                ${checkBtn}
                                <button class="delete-btn" onclick="deleteMedication('${med.id}')" title="Șterge" aria-label="Șterge">×</button>
                            </div>
                            <button class="copy-form-btn" onclick="copyMedicationToForm('${med.id}')" title="Copiază în formular" aria-label="Copiază în formular">⧉</button>
                        </div>
                        <div class="med-line-bottom">
                            <span class="med-end ${statusClass}">Fără stoc: ${stockOut.label}</span>
                            <span class="med-freq">${freqText}</span>
                        </div>
                    </div>
                </td>
            `;

            tableBody.appendChild(row);
        });
    }

    function getBaseMedName(name) {
        const match = name.match(/^(.+) #\d+$/);
        return match ? match[1] : name;
    }

    function copyMedicationToForm(id) {
        const med = medications.find(m => m.id === id);
        if (!med) return;

        fillMedFormFromMedication(med);
        document.getElementById('medFormTitle').textContent = 'Adaugă medicament';
        document.getElementById('medFormPanel').classList.remove('hidden');
        medFormOpen = true;
        document.getElementById('medFormPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        document.getElementById('medName').focus();
    }

    // Șterge un singur rând din tabel
    function deleteMedication(id) {
        showConfirmModal("Sigur vrei să ștergi acest medicament din listă?", () => {
            medications = medications.filter(m => m.id !== id);
            removeChecksForMed(id);
            saveToStorage();
            renderPlan();
            renderPersonList();
        });
    }

    // Funcția Reset - Golește memoria locală și tabelul
    function resetAll() {
        const person = getSelectedPerson();
        const personName = person?.name || 'această persoană';
        showConfirmModal(`Sigur vrei să ștergi TOATE medicamentele pentru ${personName}? Datele nu vor mai putea fi recuperate.`, () => {
            const medIdsToRemove = getPersonMedications().map(med => med.id);
            medications = medications.filter(med => med.personId !== selectedPersonId);
            medIdsToRemove.forEach(medId => removeChecksForMed(medId));
            saveChecksToStorage();
            saveToStorage();
            renderPlan();
            renderPersonList();
        });
    }

    function showConfirmModal(message, onConfirm) {
        const modal = document.getElementById('confirmModal');
        const messageEl = document.getElementById('confirmModalMessage');
        if (!modal || !messageEl) return;

        messageEl.textContent = message;
        confirmModalCallback = onConfirm;
        modal.classList.remove('hidden');
        document.getElementById('confirmModalOk')?.focus();
    }

    function closeConfirmModal() {
        const modal = document.getElementById('confirmModal');
        if (!modal) return;

        modal.classList.add('hidden');
        confirmModalCallback = null;
    }

    function confirmModalOk() {
        const callback = confirmModalCallback;
        closeConfirmModal();
        if (callback) callback();
    }

    document.addEventListener('keydown', (event) => {
        const confirmModal = document.getElementById('confirmModal');
        const addPersonModal = document.getElementById('addPersonModal');

        if (event.key === 'Escape') {
            if (confirmModal && !confirmModal.classList.contains('hidden')) {
                closeConfirmModal();
            } else if (addPersonModal && !addPersonModal.classList.contains('hidden')) {
                closeAddPersonModal();
            } else if (medFormOpen) {
                closeMedFormPanel();
            }
            return;
        }

        if (event.key === 'Enter' && addPersonModal && !addPersonModal.classList.contains('hidden')) {
            confirmAddPerson();
        }
    });

    // Curăță datele introduse în formular pentru a lăsa loc următorului medicament
    function resetForm() {
        document.getElementById('medName').value = '';
        document.getElementById('medQty').value = '';
        setStartDateInput(formatDateKey(new Date()));
        document.getElementById('medUnit').value = 'caps';
        document.getElementById('freqType').value = 'daily';
        document.getElementById('doseDim').value = '0';
        document.getElementById('dosePranz').value = '0';
        document.getElementById('doseSeara').value = '0';
        document.getElementById('intervalDays').value = '2';
        
        document.querySelectorAll('.day-checkbox').forEach(cb => cb.checked = false);
        updateUnitFields();
        toggleFreqFields();
    }

    // Salvează starea listei în memoria browserului
    function saveToStorage() {
        localStorage.setItem(MEDS_STORAGE_KEY, JSON.stringify(medications));
    }

    // Încarcă datele salvate la pornirea/reîmprospătarea paginii
    window.onload = function() {
        const stored = localStorage.getItem(MEDS_STORAGE_KEY);
        if (stored) {
            medications = JSON.parse(stored);
            normalizeMedications();
        }
        migrateToPersons();
        loadChecksFromStorage();
        initCalendarViewStart();
        setStartDateInput(formatDateKey(new Date()));
        updateUnitFields();
        renderPersonList();
    };
</script>

</body>
</html>
