<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Stoc Medicamente Persistent</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 350px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1, h2, h3 {
            color: #2c3e50;
            text-align: center;
        }
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        .flex-buttons {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
        }
        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .hidden {
            display: none !important;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 5px 0;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
            cursor: pointer;
        }
        .checkbox-label input {
            width: auto;
        }
        button {
            padding: 10px 15px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            flex: 1;
        }
        .dose-inputs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .btn-add { background-color: #27ae60; }
        .btn-add:hover { background-color: #219653; }
        .btn-reset-all { background-color: #7f8c8d; max-width: 150px; }
        .btn-reset-all:hover { background-color: #616a6b; }
        #medTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            table-layout: fixed;
        }
        #medTable thead {
            display: none;
        }
        #medTable .col-stock {
            width: 56px;
        }
        #medTable .col-actions {
            width: 32px;
        }
        #medTable td {
            padding: 6px 4px;
            text-align: left;
            vertical-align: middle;
        }
        #medTable tr.med-row-bottom td,
        #medTable tr.med-item td {
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }
        #medTable tr.med-item td {
            padding-top: 10px;
        }
        #medTable tr:hover {
            background-color: #f9f9f9;
        }
        .med-line-top {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto 28px;
            align-items: center;
            gap: 8px;
        }
        .med-line-bottom {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            align-items: start;
            gap: 8px;
            margin-top: 4px;
            font-size: 12px;
        }
        .med-name {
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .med-status-icon {
            flex-shrink: 0;
            font-size: 14px;
            line-height: 1;
        }
        .med-stock {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            text-align: right;
        }
        .med-unit {
            flex-shrink: 0;
            width: 24px;
            font-size: 12px;
            color: #7f8c8d;
            white-space: nowrap;
            text-align: left;
        }
        .qty-unit-row {
            display: grid;
            grid-template-columns: 1fr 100px;
            gap: 10px;
            align-items: end;
        }
        .med-end {
            white-space: nowrap;
        }
        .med-freq {
            text-align: right;
            overflow-wrap: anywhere;
            padding-right: 40px;
        }
        .status-urgent {
            color: #c0392b;
            font-weight: bold;
        }
        .status-warning {
            color: #e67e22;
            font-weight: bold;
        }
        .status-ok {
            color: #27ae60;
            font-weight: bold;
        }
        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            flex: none;
        }
        .delete-btn:hover {
            background-color: #c0392b;
        }
        .inline-qty {
            width: 60px;
            padding: 4px;
            text-align: center;
            font-size: 13px;
        }
        .search-box {
            margin-top: 16px;
        }
        .search-box input {
            width: 100%;
        }
        .med-empty {
            text-align: center;
            padding: 12px;
            color: #7f8c8d;
            font-size: 14px;
        }
        .plan-toolbar {
            display: flex;
            justify-content: center;
            margin-top: 16px;
        }
        .btn-calendar {
            background-color: #3498db;
            flex: none;
            padding: 8px 16px;
            font-size: 14px;
        }
        .btn-calendar:hover {
            background-color: #2980b9;
        }
        .btn-calendar.active {
            background-color: #2c3e50;
        }
        #medCalendar {
            margin-top: 16px;
        }
        .calendar-day {
            padding: 12px 0;
            border-bottom: 2px solid #e2e8f0;
        }
        .calendar-day:last-child {
            border-bottom: none;
        }
        .calendar-day-title {
            font-weight: bold;
            color: #2c3e50;
            font-size: 14px;
        }
        .calendar-period {
            margin-top: 8px;
        }
        .calendar-period-title {
            font-size: 12px;
            color: #7f8c8d;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .calendar-med-list {
            list-style: none;
            padding: 0;
            margin: 4px 0 0;
            font-size: 13px;
        }
        .calendar-med-list li {
            padding: 2px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💊 Monitorizare & Calculator Medicamente</h1>
    
    <div class="form-group">
        <div>
            <label for="medName">Nume Medicament</label>
            <input type="text" id="medName" placeholder="Ex: Paracetamol">
        </div>
        <div class="full-width qty-unit-row">
            <div>
                <label for="medQty" id="medQtyLabel">Capsule disponibile</label>
                <input type="number" id="medQty" min="1" step="1" placeholder="Ex: 30">
            </div>
            <div>
                <label for="medUnit">Unitate</label>
                <select id="medUnit" onchange="updateUnitFields()">
                    <option value="caps">Capsule</option>
                    <option value="ml">ml</option>
                    <option value="mg">mg</option>
                </select>
            </div>
        </div>
        <div>
            <label for="doseType">Doză Administrare</label>
            <div class="dose-inputs">
                <div>
                    <label style="font-size:0.75rem; font-weight:normal;">Dimineața</label>
                    <input type="number" id="doseDim" min="0" value="0">
                </div>
                <div>
                    <label style="font-size:0.75rem; font-weight:normal;">Prânz</label>
                    <input type="number" id="dosePranz" min="0" value="0">
                </div>
                <div>
                    <label style="font-size:0.75rem; font-weight:normal;">Seara</label>
                    <input type="number" id="doseSeara" min="0" value="0">
                </div>
            </div>

        </div>
        <div>
            <label for="freqType">Frecvență Administrare</label>
            <select id="freqType" onchange="toggleFreqFields()">
                <option value="daily">În fiecare zi</option>
                <option value="interval">La interval de zile (ex: o zi da, o zi nu)</option>
                <option value="days">Zile specifice din săptămână</option>
            </select>
        </div>

        <!-- Câmp dinamic pentru intervale (o zi da, o zi nu / o dată la X zile) -->
        <div id="intervalContainer" class="hidden">
            <label for="intervalDays">Repetă la fiecare (zile)</label>
            <select id="intervalDays">
                <option value="2">2 zile (O zi da, o zi nu)</option>
                <option value="3">3 zile (O zi da, două nu)</option>
                <option value="4">4 zile</option>
                <option value="5">5 zile</option>
            </select>
        </div>

        <!-- Câmp dinamic pentru zile specifice din săptămână -->
        <div id="daysContainer" class="full-width hidden">
            <label>Selectează zilele în care iei medicamentul:</label>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" class="day-checkbox" value="1"> Luni</label>
                <label class="checkbox-label"><input type="checkbox" class="day-checkbox" value="2"> Marți</label>
                <label class="checkbox-label"><input type="checkbox" class="day-checkbox" value="3"> Miercuri</label>
                <label class="checkbox-label"><input type="checkbox" class="day-checkbox" value="4"> Joi</label>
                <label class="checkbox-label"><input type="checkbox" class="day-checkbox" value="5"> Vineri</label>
                <label class="checkbox-label"><input type="checkbox" class="day-checkbox" value="6"> Sâmbătă</label>
                <label class="checkbox-label"><input type="checkbox" class="day-checkbox" value="0"> Duminică</label>
            </div>
        </div>
            

        <div class="flex-buttons">
            <button class="btn-add" onclick="addMedication()">Adaugă în Plan</button>
            <button class="btn-reset-all" onclick="resetAll()">Șterge Tot</button>
        </div>
    </div>

    <h3>📋 Planul tău curent (Salvat automat)</h3>
    <div class="search-box">
        <label for="medSearch">Caută medicament</label>
        <input type="search" id="medSearch" placeholder="Ex: Paracetamol" oninput="renderPlan()">
    </div>
    <div class="plan-toolbar">
        <button type="button" id="btnToggleCalendar" class="btn-calendar" onclick="toggleCalendarView()">📅 Calendar 2 săpt.</button>
    </div>
    <div id="planListView">
        <table id="medTable">
            <colgroup>
                <col class="col-name">
                <col class="col-stock">
                <col class="col-actions">
            </colgroup>
            <tbody>
                <!-- Datele se încarcă din JavaScript -->
            </tbody>
        </table>
    </div>
    <div id="planCalendarView" class="hidden">
        <div id="medCalendar"></div>
    </div>
</div>

<script>
    // Tabloul global în care stocăm obiectele medicamentelor
    let medications = [];
    let showCalendarView = false;

    const DAYS_SHORT = ["D", "L", "M", "Mi", "J", "V", "S"];

    const UNIT_LABELS = { caps: 'caps', ml: 'ml', mg: 'mg' };
    const UNIT_STOCK_LABELS = {
        caps: 'Capsule disponibile',
        ml: 'Cantitate disponibilă (ml)',
        mg: 'Cantitate disponibilă (mg)'
    };

    function getMedUnit(med) {
        return med.unit || 'caps';
    }

    function parseDoseValue(value, unit) {
        const parsed = unit === 'caps' ? parseInt(value, 10) : parseFloat(value);
        return isNaN(parsed) ? 0 : parsed;
    }

    function parseQtyValue(value, unit) {
        const parsed = unit === 'caps' ? parseInt(value, 10) : parseFloat(value);
        return isNaN(parsed) ? NaN : parsed;
    }

    function formatDoseValue(value, unit) {
        if (unit === 'caps') return String(Math.round(value));
        return parseFloat(Number(value).toFixed(2)).toString();
    }

    function updateUnitFields() {
        const unit = document.getElementById('medUnit').value;
        const qtyInput = document.getElementById('medQty');
        const doseIds = ['doseDim', 'dosePranz', 'doseSeara'];

        document.getElementById('medQtyLabel').textContent = UNIT_STOCK_LABELS[unit];

        if (unit === 'caps') {
            qtyInput.step = '1';
            qtyInput.min = '1';
            qtyInput.placeholder = 'Ex: 30';
            doseIds.forEach(id => {
                const el = document.getElementById(id);
                el.step = '1';
                el.min = '0';
            });
        } else {
            qtyInput.step = '0.1';
            qtyInput.min = '0.1';
            qtyInput.placeholder = unit === 'ml' ? 'Ex: 100' : 'Ex: 500';
            doseIds.forEach(id => {
                const el = document.getElementById(id);
                el.step = '0.1';
                el.min = '0';
            });
        }
    }

    function normalizeMedications() {
        medications = medications.map(med => ({
            ...med,
            unit: med.unit || 'caps'
        }));
    }

    // Ascunde sau arată câmpurile suplimentare în funcție de frecvența aleasă
    function toggleFreqFields() {
        const type = document.getElementById('freqType').value;
        const intervalDiv = document.getElementById('intervalContainer');
        const daysDiv = document.getElementById('daysContainer');

        if (type === 'interval') {
            intervalDiv.classList.remove('hidden');
            daysDiv.classList.add('hidden');
        } else if (type === 'days') {
            intervalDiv.classList.add('hidden');
            daysDiv.classList.remove('hidden');
        } else {
            intervalDiv.classList.add('hidden');
            daysDiv.classList.add('hidden');
        }
    }

    // Adaugă un medicament nou în memorie și în tabel
    function addMedication() {
        const name = document.getElementById('medName').value.trim();
        const unit = document.getElementById('medUnit').value;
        const qty = parseQtyValue(document.getElementById('medQty').value, unit);
        const freqType = document.getElementById('freqType').value;
        const dim = parseDoseValue(document.getElementById('doseDim').value, unit);
        const pranz = parseDoseValue(document.getElementById('dosePranz').value, unit);
        const seara = parseDoseValue(document.getElementById('doseSeara').value, unit);

        let intervalDays = 1;
        let specificDays = [];

        if (!name || isNaN(qty) || qty <= 0) {
            alert("Te rog să introduci un nume valid și o cantitate în stoc.");
            return;
        }

        if (freqType === 'interval') {
            intervalDays = parseInt(document.getElementById('intervalDays').value) || 2;
        } else if (freqType === 'days') {
            const checkedBoxes = document.querySelectorAll('.day-checkbox:checked');
            checkedBoxes.forEach(cb => specificDays.push(cb.value));

            if (specificDays.length === 0) {
                alert("Selectează cel puțin o zi din săptămână.");
                return;
            }
        }

        const totalDaily = dim + pranz + seara;
        if (totalDaily === 0) {
            alert("Introdu doza zilnică (cel puțin o valoare dimineața, la prânz sau seara).");
            return;
        }

        const newMed = {
            id: Date.now().toString(),
            name,
            qty,
            unit,
            freqType,
            interval: intervalDays,
            specificDays,
            dim,
            pranz,
            seara
        };

        medications.push(newMed);
        saveToStorage();
        renderPlan();
        resetForm();
    }

    // Calculează data la care se termină stocul; returnează timestamp pentru sortare și text afișat
    function calculateStockOut(med) {
        let currentQty = med.qty;
        let checkDate = new Date();
        checkDate.setHours(0, 0, 0, 0);
        const dailyDose = med.dim + med.pranz + med.seara;
        const epsilon = 0.0001;

        if (dailyDose <= 0) {
            return { timestamp: Number.MAX_SAFE_INTEGER, label: "Nu se consumă" };
        }

        let daysCounter = 0;
        const maxSafetyIterations = 5000;

        while (currentQty > epsilon && daysCounter < maxSafetyIterations) {
            let takesMedicineToday = false;

            if (med.freqType === 'daily') {
                takesMedicineToday = true;
            } else if (med.freqType === 'interval') {
                if (daysCounter % med.interval === 0) {
                    takesMedicineToday = true;
                }
            } else if (med.freqType === 'days') {
                const currentDayOfWeek = checkDate.getDay().toString();
                if (med.specificDays.includes(currentDayOfWeek)) {
                    takesMedicineToday = true;
                }
            }

            if (takesMedicineToday) {
                if (currentQty < dailyDose - epsilon) {
                    break;
                }
                currentQty -= dailyDose;
            }

            if (currentQty <= epsilon) {
                break;
            }

            checkDate.setDate(checkDate.getDate() + 1);
            daysCounter++;
        }

        if (daysCounter >= maxSafetyIterations) {
            return { timestamp: Number.MAX_SAFE_INTEGER, label: "Peste 10+ ani" };
        }

        const day = String(checkDate.getDate()).padStart(2, '0');
        const month = String(checkDate.getMonth() + 1).padStart(2, '0');
        const year = checkDate.getFullYear();
        const dayName = DAYS_SHORT[checkDate.getDay()];

        return {
            timestamp: checkDate.getTime(),
            label: `${dayName}, ${day}.${month}.${year}`
        };
    }

    // Clasă de culoare în funcție de câte zile mai sunt până la epuizarea stocului
    function getStockStatusClass(stockOut) {
        if (stockOut.timestamp === Number.MAX_SAFE_INTEGER) {
            return 'status-ok';
        }

        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const endDate = new Date(stockOut.timestamp);
        const daysUntil = Math.ceil((endDate - today) / (24 * 60 * 60 * 1000));

        if (daysUntil <= 15) return 'status-urgent';
        if (daysUntil <= 30) return 'status-warning';
        return 'status-ok';
    }

    function getStockStatusIcon(statusClass) {
        if (statusClass === 'status-urgent') {
            return '<span class="med-status-icon" title="Stoc epuizat în curând">⚠️</span>';
        }
        if (statusClass === 'status-warning') {
            return '<span class="med-status-icon" title="Stoc limitat">🟠</span>';
        }
        if (statusClass === 'status-ok') {
            return '<span class="med-status-icon" title="Stoc suficient">🟢</span>';
        }
        return '';
    }

    // Formatează frecvența compact: 1/z, 1/3z, L Mi V 1/z
    function formatFreqText(med, totalDaily) {
        const doseText = formatDoseValue(totalDaily, getMedUnit(med));

        if (med.freqType === 'daily') {
            return `${doseText}/z`;
        }
        if (med.freqType === 'interval') {
            return `${doseText}/${med.interval}z`;
        }
        if (med.freqType === 'days') {
            const daysMap = { '1': 'L', '2': 'M', '3': 'Mi', '4': 'J', '5': 'V', '6': 'S', '0': 'D' };
            const dayOrder = ['1', '2', '3', '4', '5', '6', '0'];
            const sorted = med.specificDays.slice().sort((a, b) => dayOrder.indexOf(a) - dayOrder.indexOf(b));
            const days = sorted.map(d => daysMap[d]).join(' ');
            return `${days} ${doseText}/z`;
        }
        return '';
    }

    function getSearchQuery() {
        return (document.getElementById('medSearch')?.value || '').trim().toLowerCase();
    }

    function getFilteredMedications() {
        const searchQuery = getSearchQuery();
        return medications.filter(med => !searchQuery || med.name.toLowerCase().includes(searchQuery));
    }

    function formatDateLabel(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${DAYS_SHORT[date.getDay()]}, ${day}.${month}.${year}`;
    }

    function isMedTakenOnDayOffset(med, dayOffset) {
        if (med.freqType === 'daily') {
            return true;
        }
        if (med.freqType === 'interval') {
            return dayOffset % med.interval === 0;
        }
        if (med.freqType === 'days') {
            const date = new Date();
            date.setHours(0, 0, 0, 0);
            date.setDate(date.getDate() + dayOffset);
            return med.specificDays.includes(date.getDay().toString());
        }
        return false;
    }

    function formatCalendarDose(med, amount) {
        const unit = getMedUnit(med);
        return `${med.name} — ${formatDoseValue(amount, unit)} ${UNIT_LABELS[unit]}`;
    }

    function renderCalendar() {
        const container = document.getElementById('medCalendar');
        container.innerHTML = '';

        const filteredMeds = getFilteredMedications();
        let hasAnyDay = false;

        for (let dayOffset = 0; dayOffset < 14; dayOffset++) {
            const date = new Date();
            date.setHours(0, 0, 0, 0);
            date.setDate(date.getDate() + dayOffset);

            const dimMeds = [];
            const pranzMeds = [];
            const searaMeds = [];

            filteredMeds.forEach(med => {
                if (!isMedTakenOnDayOffset(med, dayOffset)) return;
                if (med.dim > 0) dimMeds.push(formatCalendarDose(med, med.dim));
                if (med.pranz > 0) pranzMeds.push(formatCalendarDose(med, med.pranz));
                if (med.seara > 0) searaMeds.push(formatCalendarDose(med, med.seara));
            });

            if (dimMeds.length === 0 && pranzMeds.length === 0 && searaMeds.length === 0) {
                continue;
            }

            hasAnyDay = true;
            const dayEl = document.createElement('div');
            dayEl.className = 'calendar-day';

            let html = `<div class="calendar-day-title">${formatDateLabel(date)}</div>`;

            if (dimMeds.length > 0) {
                html += `
                    <div class="calendar-period">
                        <div class="calendar-period-title">Dimineața</div>
                        <ul class="calendar-med-list">${dimMeds.map(item => `<li>${item}</li>`).join('')}</ul>
                    </div>`;
            }
            if (pranzMeds.length > 0) {
                html += `
                    <div class="calendar-period">
                        <div class="calendar-period-title">Prânz</div>
                        <ul class="calendar-med-list">${pranzMeds.map(item => `<li>${item}</li>`).join('')}</ul>
                    </div>`;
            }
            if (searaMeds.length > 0) {
                html += `
                    <div class="calendar-period">
                        <div class="calendar-period-title">Seara</div>
                        <ul class="calendar-med-list">${searaMeds.map(item => `<li>${item}</li>`).join('')}</ul>
                    </div>`;
            }

            dayEl.innerHTML = html;
            container.appendChild(dayEl);
        }

        if (!hasAnyDay) {
            container.innerHTML = '<p class="med-empty">Niciun medicament de luat în următoarele 2 săptămâni.</p>';
        }
    }

    function renderPlan() {
        if (showCalendarView) {
            renderCalendar();
        } else {
            renderTable();
        }
    }

    function toggleCalendarView() {
        showCalendarView = !showCalendarView;
        document.getElementById('planListView').classList.toggle('hidden', showCalendarView);
        document.getElementById('planCalendarView').classList.toggle('hidden', !showCalendarView);

        const btn = document.getElementById('btnToggleCalendar');
        if (showCalendarView) {
            btn.textContent = '📋 Înapoi la listă';
            btn.classList.add('active');
        } else {
            btn.textContent = '📅 Calendar 2 săpt.';
            btn.classList.remove('active');
        }

        renderPlan();
    }

    // Desenează tabelul pe ecran utilizând datele salvate
    function renderTable() {
        const tableBody = document.querySelector('#medTable tbody');
        tableBody.innerHTML = '';

        const sortedMeds = getFilteredMedications()
            .map(med => ({ med, stockOut: calculateStockOut(med) }))
            .sort((a, b) => a.stockOut.timestamp - b.stockOut.timestamp);

        if (sortedMeds.length === 0) {
            const emptyRow = document.createElement('tr');
            emptyRow.innerHTML = `<td colspan="3" class="med-empty">Niciun medicament găsit.</td>`;
            tableBody.appendChild(emptyRow);
            return;
        }

        sortedMeds.forEach(({ med, stockOut }) => {
            const unit = getMedUnit(med);
            const totalDaily = med.dim + med.pranz + med.seara;
            const freqText = formatFreqText(med, totalDaily);
            const qtyStep = unit === 'caps' ? '1' : '0.1';

            const statusClass = getStockStatusClass(stockOut);
            const statusIcon = getStockStatusIcon(statusClass);

            const row = document.createElement('tr');
            row.className = 'med-item';
            row.innerHTML = `
                <td colspan="3">
                    <div class="med-line-top">
                        <div class="med-name">${statusIcon}<strong>${med.name}</strong></div>
                        <div class="med-stock">
                            <input type="number" class="inline-qty" value="${formatDoseValue(med.qty, unit)}" step="${qtyStep}" min="0" onchange="updateStock('${med.id}', this.value)">
                            <span class="med-unit">${UNIT_LABELS[unit]}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteMedication('${med.id}')" title="Șterge" aria-label="Șterge">×</button>
                    </div>
                    <div class="med-line-bottom">
                        <span class="med-end ${statusClass}">Fără stoc: ${stockOut.label}</span>
                        <span class="med-freq">${freqText}</span>
                    </div>
                </td>
            `;

            tableBody.appendChild(row);
        });
    }

    // Funcție apelată când modifici stocul manual în interiorul tabelului
    function updateStock(id, newQty) {
        const med = medications.find(m => m.id === id);
        if (!med) return;

        const unit = getMedUnit(med);
        const qtyValue = parseQtyValue(newQty, unit);
        if (isNaN(qtyValue) || qtyValue < 0) {
            alert("Introdu o cantitate validă.");
            renderPlan();
            return;
        }

        med.qty = qtyValue;
        saveToStorage();
        renderPlan();
    }
    // Șterge un singur rând din tabel
    function deleteMedication(id) {
        if (confirm("Sigur vrei să ștergi acest medicament din listă?")) {
            medications = medications.filter(m => m.id !== id);
            saveToStorage();
            renderPlan();
        }
    }

    // Funcția Reset - Golește memoria locală și tabelul
    function resetAll() {
        if (confirm("Sigur vrei să ștergi TOATE medicamentele salvate? Datele nu vor mai putea fi recuperate.")) {
            medications = [];
            saveToStorage();
            renderPlan();
        }
    }

    // Curăță datele introduse în formular pentru a lăsa loc următorului medicament
    function resetForm() {
        document.getElementById('medName').value = '';
        document.getElementById('medQty').value = '';
        document.getElementById('medUnit').value = 'caps';
        document.getElementById('freqType').value = 'daily';
        document.getElementById('doseDim').value = '0';
        document.getElementById('dosePranz').value = '0';
        document.getElementById('doseSeara').value = '0';
        document.getElementById('intervalDays').value = '2';
        
        document.querySelectorAll('.day-checkbox').forEach(cb => cb.checked = false);
        updateUnitFields();
        toggleFreqFields();
    }

    // Salvează starea listei în memoria browserului
    function saveToStorage() {
        localStorage.setItem('medicationsStockApp_v2', JSON.stringify(medications));
    }

    // Încarcă datele salvate la pornirea/reîmprospătarea paginii
    window.onload = function() {
        const stored = localStorage.getItem('medicationsStockApp_v2');
        if (stored) {
            medications = JSON.parse(stored);
            normalizeMedications();
        }
        updateUnitFields();
        renderPlan();
    };
</script>

</body>
</html>
