<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ierarhie UX Stabilă - Proiecție în Față</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: white;
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1200px;
        }

        .tree-container {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        /* Toate elementele încep aliniate fix la stânga (fără margin-left) */
        .node {
            background-color: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(71, 85, 105, 0.6);
            border-radius: 8px;
            padding: 20px;
            font-weight: 500;
            margin-top: 15px;
            width: 100%;
            position: relative;
            margin-left: 0px !important;
            padding-left: 20px !important;
            
            /* Setează punctul de ancoră al transformării în centrul rândului */
            transform-origin: center center;
            
            /* Animare fină pe X și Scale pentru a simula adâncimea în față */
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        /* Culori de identificare pe margini */
        .node[data-level="1"] { border-left: 4px solid #38bdf8; }
        .node[data-level="2"] { border-left: 4px solid #a855f7; }
        .node[data-level="3"] { border-left: 4px solid #f43f5e; }

        /* Nodul activ (cel mai de sus/în față) */
        .node.active {
            border-color: #38bdf8 !important;
            background-color: rgba(30, 58, 138, 0.95) !important;
        }
    </style>
</head>
<body>

    <div class="tree-container">
        <!-- STRUCTURĂ NATIIVĂ DIV ÎN DIV EXACT CA ÎN JSONEDITOR -->
        <div class="node" id="div1" data-level="1">
            Nod 1 (Nivel 1)
            
            <div class="node" id="div2" data-level="2">
                Nod 2 (Nivel 2 - Copil din 1)
                
                <div class="node" id="div3" data-level="3">
                    Nod 3 (Nivel 3 - Nepot din 2)
                </div>
            </div>

            <div class="node" id="div4" data-level="2">
                Nod 4 (Nivel 2 - Frate cu 2, Copil din 1)
            </div>
        </div>
        
        <div class="node" id="div5" data-level="1">
            Nod 5 (Nivel 1 - Frate cu 1)
        </div>
    </div>

    <script>
        const container = document.querySelector('.tree-container');
        const nodes = document.querySelectorAll('.node');

        window.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            const centerX = window.innerWidth / 2;
            const normalizedX = (mouseX - centerX) / centerX; // Valoare între -1 și 1

            // 1. Rotația unitară a întregului grup pe Y
            const globalRotateY = normalizedX * 25; 
            container.style.transform = `rotateY(${globalRotateY}deg)`;

            // 2. Detecția precisă a nodului activ cel mai adânc de sub mouse
            let activeNode = null;
            nodes.forEach(node => {
                const rect = node.getBoundingClientRect();
                if (mouseY >= rect.top && mouseY <= rect.bottom) {
                    if (!activeNode || parseInt(node.getAttribute('data-level')) > parseInt(activeNode.getAttribute('data-level'))) {
                        activeNode = node;
                    }
                }
            });

            if (!activeNode) return;

            const activeLevel = parseInt(activeNode.getAttribute('data-level'));

            // 3. LOGICA PARALAXEI MODIFICATĂ PENTRU EFECTUL „ÎN FAȚĂ” (POP-UP)
            nodes.forEach(node => {
                node.classList.remove('active');
                const currentLevel = parseInt(node.getAttribute('data-level'));
                
                // Calculăm distanța relativă (exact ca în propunerea ta)
                let nivelRelativ = currentLevel - activeLevel;

                // FORMULA INVERSATĂ ȘI AMPIFICATĂ PENTRU EFECTUL DE POP-UP ÎN FAȚĂ:
                // Când normalizedX e pozitiv (mouse la dreapta), sub-divurile se deplasează mai mult în direcția mouse-ului
                let shiftX = nivelRelativ * normalizedX * 20; 
                
                // Scalare progresivă: elementele mai adânce (copii/nepoți) cresc în dimensiune, 
                // iar părinții (nivel relativ negativ) scad sub 1, ducându-se vizibil în fundal
                let scaleFactor = 1 + (nivelRelativ * 0.06);

                // Controlul umbrelor pentru iluzia de stivuire verticală spre ecran
                if (nivelRelativ === 0) {
                    // Nodul focusat primește o umbră exterioară mare, ridicându-se deasupra tuturor
                    node.style.boxShadow = "0 20px 40px rgba(0,0,0,0.6), 0 0 15px rgba(56, 189, 248, 0.3)";
                    node.style.zIndex = "100";
                } else if (nivelRelativ > 0) {
                    // Sub-nivelurile (dacă există) plutesc și ele în fața ancorei
                    node.style.boxShadow = "0 10px 20px rgba(0,0,0,0.4)";
                    node.style.zIndex = "90";
                } else {
                    // Părinții cad în fundal (umbră plată și z-index mic)
                    node.style.boxShadow = "0 2px 5px rgba(0,0,0,0.1)";
                    node.style.zIndex = "1";
                }

                // Aplicăm transformarea combinată
                node.style.transform = `translateX(${shiftX}px) scale(${scaleFactor})`;
            });

            activeNode.classList.add('active');
        });

        // Resetare completă la poziția neutră la ieșirea mouse-ului din pagină
        document.addEventListener('mouseleave', () => {
            container.style.transform = 'rotateY(0deg)';
            nodes.forEach(node => {
                node.style.transform = 'translateX(0px) scale(1)';
                node.style.boxShadow = "0 4px 10px rgba(0,0,0,0.4)";
                node.style.zIndex = "auto";
                node.classList.remove('active');
            });
        });
    </script>
</body>
</html>
