<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ierarhie 3D Unitară (DIV în DIV)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: white;
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 2000px; /* Perspectivă mare pentru un efect 3D stabil */
        }

        .tree-container {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        /* Fiecare nod pornește aliniat la stânga, FĂRĂ margin-left */
        .node {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            font-weight: 500;
            margin-top: 12px;
            width: 100%;
            
            /* TRANZIȚIE DOAR PE APĂSARE/HOVER, PENTRU MIȘCARE DE SEPARARE CURSIVĂ */
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.3s, background-color 0.3s;
            
            /* CRUCIAL: Permite copiilor din interior să se randeze în spațiul 3D al părintelui */
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        /* Culori discrete pe margini ca să distingem nivelul structural în 2D */
        .node[data-level="1"] { border-left: 4px solid #64748b; }
        .node[data-level="2"] { border-left: 4px solid #475569; }
        .node[data-level="3"] { border-left: 4px solid #334155; }

        /* Clasat activată din JS pe divul unde se află mouse-ul */
        .node.active {
            border-color: #38bdf8 !important;
            background-color: rgba(3, 105, 161, 0.9) !important;
        }
    </style>
</head>
<body>

    <div class="tree-container">
        <!-- STRUCTURĂ REALĂ STRUCTURATĂ IERARHIC: DIV ÎN DIV -->
        <div class="node" id="div1" data-level="1">
            Nod 1 (Nivel 1)
            
            <div class="node" id="div2" data-level="2">
                Nod 2 (Nivel 2 - Copil din 1)
                
                <div class="node" id="div3" data-level="3">
                    Nod 3 (Nivel 3 - Nepot din 2)
                </div>
            </div>

            <div class="node" id="div4" data-level="2">
                Nod 4 (Nivel 2 - Frate cu 2, Copil din 1)
            </div>
        </div>
        
        <div class="node" id="div5" data-level="1">
            Nod 5 (Nivel 1 - Frate cu 1)
        </div>
    </div>

    <script>
        const container = document.querySelector('.tree-container');
        const nodes = document.querySelectorAll('.node');

        window.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            const centerX = window.innerWidth / 2;
            const normalizedX = (mouseX - centerX) / centerX;

            // 1. Rotația rigidă sincronă a întregii structuri pe Y
            const globalRotateY = normalizedX * 25; 
            container.style.transform = `rotateY(${globalRotateY}deg)`;

            // 2. Scanare pe verticală: Găsim elementul cel mai specific (cel mai adânc în DOM) aflat sub mouse
            let activeNode = null;
            nodes.forEach(node => {
                const rect = node.getBoundingClientRect();
                if (mouseY >= rect.top && mouseY <= rect.bottom) {
                    // Dacă se suprapun (pentru că sunt imbricate), îl alegem pe cel imbricat adânc
                    if (!activeNode || node.contains(activeNode)) {
                        activeNode = node;
                    }
                }
            });

            if (!activeNode) return;

            const activeLevel = parseInt(activeNode.getAttribute('data-level'));

            // 3. Modificare de Nivel Unitară: Mutăm planul de bază 3D global
            nodes.forEach(node => {
                node.classList.remove('active');
                
                const currentLevel = parseInt(node.getAttribute('data-level'));
                
                // FORMULA PROPUSĂ DE TINE:
                // Diferența dintre nivelul curent al elementului și nivelul unde stă mouse-ul
                // Multiplicăm cu 50px pentru a distanța straturile vizual în adâncime
                let targetZ = (currentLevel - activeLevel) * -50;

                // Aplicăm mutarea pe axa Z
                node.style.transform = `translateZ(${targetZ}px)`;
            });

            // Adăugăm clasa activă doar pe elementul focusat direct
            activeNode.classList.add('active');
        });

        // Resetare completă când mouse-ul părăsește ecranul
        document.addEventListener('mouseleave', () => {
            container.style.transform = 'rotateY(0deg)';
            nodes.forEach(node => {
                node.style.transform = 'translateZ(0px)';
                node.classList.remove('active');
            });
        });
    </script>
</body>
</html>
