<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ierarhie 3D Unitară - Focus în Față</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: white;
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Perspectivă accentuată pentru a scoate detaliile în față */
            perspective: 1000px; 
        }

        .tree-container {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        /* Nodurile au fundal semi-transparent pentru a vedea straturile din spate */
        .node {
            background-color: rgba(30, 41, 59, 0.6);
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 20px;
            font-weight: 500;
            margin-top: 15px;
            width: 100%;
            
            /* Tranziție rapidă și fluidă pentru axa Z */
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.2s, background-color 0.2s;
            
            /* Păstrează spațiul 3D deschis pentru sub-divuri */
            transform-style: preserve-3d;
            backface-visibility: hidden;
            position: relative;
        }

        /* Linii de ghidaj pe margini */
        .node[data-level="1"] { border-left: 4px solid #38bdf8; }
        .node[data-level="2"] { border-left: 4px solid #a855f7; }
        .node[data-level="3"] { border-left: 4px solid #f43f5e; }

        /* Nodul direct de sub mouse */
        .node.active {
            border-color: #38bdf8 !important;
            background-color: rgba(30, 58, 138, 0.85) !important;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body>

    <div class="tree-container">
        <!-- STRUCTURĂ IERARHICĂ REALĂ (DIV ÎN DIV) -->
        <div class="node" id="div1" data-level="1">
            Nod 1 (Nivel 1)
            
            <div class="node" id="div2" data-level="2">
                Nod 2 (Nivel 2 - Copil din 1)
                
                <div class="node" id="div3" data-level="3">
                    Nod 3 (Nivel 3 - Nepot din 2)
                </div>
            </div>

            <div class="node" id="div4" data-level="2">
                Nod 4 (Nivel 2 - Frate cu 2, Copil din 1)
            </div>
        </div>
        
        <div class="node" id="div5" data-level="1">
            Nod 5 (Nivel 1 - Frate cu 1)
        </div>
    </div>

    <script>
        const container = document.querySelector('.tree-container');
        const nodes = document.querySelectorAll('.node');

        window.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            const centerX = window.innerWidth / 2;
            const normalizedX = (mouseX - centerX) / centerX;

            // 1. Rotația de grup stabilă a panoului pe Y
            const globalRotateY = normalizedX * 30; 
            container.style.transform = `rotateY(${globalRotateY}deg)`;

            // 2. Detecția strictă a celui mai adânc element (sub-div-ul real)
            let activeNode = null;
            nodes.forEach(node => {
                const rect = node.getBoundingClientRect();
                if (mouseY >= rect.top && mouseY <= rect.bottom) {
                    if (!activeNode || activeNode.contains(node) || node.contains(activeNode)) {
                        // Verificăm care dintre ele are nivelul mai mare (este mai adânc în interior)
                        if (!activeNode || parseInt(node.getAttribute('data-level')) > parseInt(activeNode.getAttribute('data-level'))) {
                            activeNode = node;
                        }
                    }
                }
            });

            if (!activeNode) return;

            const activeLevel = parseInt(activeNode.getAttribute('data-level'));

            // 3. Calculul unitar inversat: aduce elementul curent în planul cel mai apropiat
            nodes.forEach(node => {
                node.classList.remove('active');
                const currentLevel = parseInt(node.getAttribute('data-level'));
                
                // Schimbăm dinamica: diferența se înmulțește direct cu valoare pozitivă (50px)
                // Adăugăm și un mic offset de 20px pentru a ridica copiii deasupra planului părintelui în mod nativ
				
				
                let targetZ = (currentLevel - activeLevel) * 50;

                // Dacă mouse-ul e pe un sub-div, forțăm restul ierarhiei superioare (părinții) să cadă în spate

                if (currentLevel < activeLevel) {
                    //targetZ = (currentLevel - activeLevel) * 100; 
                }

                node.style.transform = `translateZ(${targetZ}px)`;
            });

            activeNode.classList.add('active');
        });

        // Resetare completă la părăsirea ferestrei
        document.addEventListener('mouseleave', () => {
            container.style.transform = 'rotateY(0deg)';
            nodes.forEach(node => {
                node.style.transform = 'translateZ(0px)';
                node.classList.remove('active');
            });
        });
    </script>
</body>
</html>
