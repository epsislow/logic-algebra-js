<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator JSON Schema și Date Complexe</title>
    
    <!-- JSON-Editor CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/json-editor/2.15.1/jsoneditor.min.js"></script>
    
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .main-layout { display: flex; gap: 20px; max-width: 1600px; margin: 0 auto; }
        .column { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); min-width: 350px; }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-top: 0; font-size: 18px; color: #007bff; }
        h3 { font-size: 14px; margin-top: 15px; }
        
        #submit-btn { background-color: #28a745; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 20px; width: 100%; }
        #submit-btn:hover { background-color: #218838; }
        
        .output-box { margin-top: 20px; background: #272822; color: #f8f8f2; padding: 15px; border-radius: 6px; overflow-x: auto; }
        pre { margin: 0; font-size: 12px; }

        /* Stiluri pentru a face editorul de scheme din stânga mai aerisit și ierarhic */
        #schema_editor_holder .je-object__container, 
        #schema_editor_holder .je-indented-panel {
            margin-left: 15px !important;
            border-left: 2px solid #007bff33 !important;
            padding-left: 10px !important;
            background: rgba(0,0,0,0.01);
        }

        /* Stil global pentru inputuri */
        input[type="text"], input[type="number"], select { 
            width: 100% !important; max-width: 280px !important; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 13px; margin-bottom: 5px;
        }
        
        /* Butoane interfață */
        .json-editor-btn-add, .json-editor-btntype-add, .json-editor-btntype-properties { background: #007bff !important; color: white !important; border: none !important; padding: 5px 10px !important; border-radius: 4px !important; cursor: pointer !important; font-size: 11px !important; margin: 2px !important; }
        .json-editor-btntype-delete, .json-editor-btntype-deletelast { background: #dc3545 !important; color: white !important; border: none !important; padding: 5px 10px !important; border-radius: 4px !important; font-size: 11px !important; margin: 2px !important; }
    </style>
</head>
<body>

<div class="main-layout">
    <!-- STÂNGA: Definitoreul de Structură Recursivă -->
    <div class="column">
        <h2>1. Configurează Structura (Suportă Liste/Obiecte imbricate)</h2>
        <div id="schema_editor_holder"></div>
    </div>
    
    <!-- DREAPTA: Formularul rezultat din structura de mai sus -->
    <div class="column">
        <h2>2. Completează Datele din Formularul Generat</h2>
        <div id="data_editor_holder"></div>
        
        <button id="submit-btn">Generează JSON Final</button>

        <div class="output-box">
            <h3>JSON Rezultat:</h3>
            <pre id="output_json">{}</pre>
        </div>
    </div>
</div>

<script>
    // Această definiție este RECURSIVĂ. Un element poate fi definit ca tip "object" (care conține alte elemente) sau "array" (care conține un sub-element tip)
    const recursiveItemSchema = {
        "type": "object",
        "title": "Proprietate / Element",
        "headerTemplate": "{{self.key}} [{{self.type}}]",
        "properties": {
            "key": { "type": "string", "title": "Cheie JSON (ex: nume_utilizator, port)", "default": "camp_nou" },
            "title": { "type": "string", "title": "Etichetă Vizuală (Titlu)", "default": "Noul Câmp" },
            "type": { 
                "type": "string", 
                "title": "Tip Structură Dată", 
                "enum": ["string", "integer", "number", "boolean", "object", "array"], 
                "default": "string" 
            },
            "default": { "type": "string", "title": "Valoare Implicită (Doar pt text/numere)" },
            // Dacă tipul e "object", definim proprietățile lui interioare
            "properties": {
                "type": "array",
                "title": "Proprietăți Interioare Obiect",
                "items": { "$ref": "#" } // 👈 Trucul magic: Se auto-apelează recursiv!
            },
            // Dacă tipul e "array", definim ce tip de date se află în acea listă
            "array_items": {
                "type": "object",
                "title": "Configurare elemente din Listă (Array)",
                "$ref": "#" // 👈 Se auto-apelează din nou recursiv!
            }
        },
        "required": ["key", "title", "type"]
    };

    const rootMetaSchema = {
        "type": "object",
        "title": "Configurație Rădăcină Formular",
        "properties": {
            "root_type": { "type": "string", "title": "Tipul Principal al JSON-ului", "enum": ["array", "object"], "default": "array" },
            "structure": {
                "type": "array",
                "title": "Elemente Formular",
                "items": recursiveItemSchema
            }
        }
    };

    // Structura ta inițială tradusă în noul format recursiv
    const initialStructure = {
        "root_type": "array",
        "structure": [
            { "key": "setare1", "title": "Setare 1", "type": "integer", "default": "1" },
            { "key": "setare2", "title": "Setare 2", "type": "integer", "default": "2" },
            { "key": "id_unic", "title": "ID Unic", "type": "integer", "default": "7" },
            { 
                "key": "detalii_tehnice", 
                "title": "Detalii Tehnice", 
                "type": "object",
                "properties": [
                    { "key": "port", "title": "Port Conexiune", "type": "integer", "default": "8080" },
                    { "key": "protocol", "title": "Protocol", "type": "string", "default": "HTTPS" }
                ]
            },
            {
                "key": "lista_utilizatori",
                "title": "Listă Utilizatori",
                "type": "array",
                "array_items": { "key": "item_nume", "title": "Nume Utilizator", "type": "string", "default": "Ion" }
            }
        ]
    };

    let schemaEditor = new JSONEditor(document.getElementById('schema_editor_holder'), {
        schema: rootMetaSchema,
        theme: 'html',
        disable_collapse: false,
        disable_edit_json: true,
        disable_properties: true,
        startval: initialStructure
    });

    let dataEditor;

    // Funcție recursivă care convertește configurarea din stânga în JSON Schema standard
    function parseStructureToSchema(item) {
        let schemaNode = {
            title: item.title,
            type: item.type
        };

        if (item.default && item.type !== 'object' && item.type !== 'array') {
            schemaNode.default = (item.type === 'integer' || item.type === 'number') ? Number(item.default) : item.default;
        }

        if (item.type === 'object' && item.properties && item.properties.length > 0) {
            schemaNode.properties = {};
            item.properties.forEach(subItem => {
                schemaNode.properties[subItem.key] = parseStructureToSchema(subItem);
            });
        } 
        
        if (item.type === 'array' && item.array_items) {
            schemaNode.items = parseStructureToSchema(item.array_items);
        }

        return schemaNode;
    }

    function updateDataEditor() {
        const config = schemaEditor.getValue();
        let targetSchema = {};

        if (config.root_type === 'array') {
            // Dacă rădăcina e un șir de elemente cu chei/structuri predefinite diferite
            const itemsArray = (config.structure || []).map(item => parseStructureToSchema(item));
            targetSchema = {
                type: "array",
                minItems: itemsArray.length,
                maxItems: itemsArray.length,
                items: itemsArray
            };
        } else {
            // Dacă rădăcina este direct un obiect cu chei unice
            targetSchema = {
                type: "object",
                properties: {}
            };
            (config.structure || []).forEach(item => {
                targetSchema.properties[item.key] = parseStructureToSchema(item);
            });
        }

        if (dataEditor) { dataEditor.destroy(); }

        dataEditor = new JSONEditor(document.getElementById('data_editor_holder'), {
            schema: targetSchema,
            theme: 'html',
            disable_collapse: true,
            disable_edit_json: true,
            disable_properties: true,
            disable_array_reorder: true
        });
    }

    schemaEditor.on('change', () => {
        updateDataEditor();
    });

    document.getElementById('submit-btn').addEventListener('click', function() {
        if (dataEditor) {
            document.getElementById('output_json').textContent = JSON.stringify(dataEditor.getValue(), null, 2);
        }
    });
</script>

</body>
</html>
