<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor JSON Profesional - Soluție Integrată și Stabilă</title>
    
    <!-- JSON-Editor CDN -->
    <script src="jsoneditor.min.js"></script>
    
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .main-layout { display: flex; flex-direction: column; gap: 16px; max-width: 1280px; margin: 0 auto; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-top: 0; font-size: 18px; color: #007bff; }
        h3 { font-size: 14px; margin-top: 15px; color: #555; }
        
        .import-box { background: #e9ecef; padding: 15px; border-radius: 6px; border: 1px solid #ced4da; }
        .import-textarea { width: 100%; height: 100px; font-family: monospace; font-size: 12px; box-sizing: border-box; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; resize: vertical; }
        
        .btn-green { background-color: #28a745 !important; color: white !important; }
        .btn-green:hover { background-color: #218838 !important; }
        .btn-blue { background-color: #007bff !important; color: white !important; }
        .btn-blue:hover { background-color: #0069d9 !important; }
        
        #submit-btn, .action-btn { color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; display: block; text-align: center; box-sizing: border-box; }
        
        .output-box { margin-top: 15px; background: #272822; color: #f8f8f2; padding: 15px; border-radius: 6px; overflow-x: auto; }
        .schema-box { margin-top: 25px; background: #1e1e1e; color: #a6e22e; padding: 15px; border-radius: 6px; overflow-x: auto; border: 1px solid #333; }
        pre { margin: 0; font-size: 12px; font-family: monospace; }
        .copy-btn { margin-top: 8px; background: #495057; color: white; border: none; padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; }
        .copy-btn:hover { background: #343a40; }
        .copy-btn.copied { background: #28a745; }

        .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .panel-header h2 { border-bottom: none; padding-bottom: 0; margin: 0; flex: 1; }
        .toggle-btn { background: #6c757d; color: white; border: none; padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        .toggle-btn:hover { background: #5a6268; }
        .panel.collapsed .panel-body { display: none; }
        .panel.collapsed .panel-header { border-bottom: none; padding-bottom: 0; }

        /* Master-detail: tree stânga + formular nod dreapta */
        .schema-master-detail {
            display: flex;
            gap: 14px;
            align-items: stretch;
            height: 400px;
            min-height: 320px;
        }
        .schema-tree {
            width: 280px;
            flex: 0 0 280px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            background: #f8f9fa;
            padding: 8px 6px;
            overflow: auto;
            height: 100%;
            max-height: none;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.45;
            user-select: none;
            box-sizing: border-box;
        }
        .schema-tree-row {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        .schema-tree-row:hover { background: #e9ecef; }
        .schema-tree-row.is-selected {
            background: #007bff;
            color: #fff;
        }
        .schema-tree-row.is-selected .schema-tree-twist {
            color: #fff;
            border-color: rgba(255,255,255,0.55);
			background: #007bff;
        }
        .schema-tree-twist {
            flex: 0 0 22px;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #adb5bd;
            border-radius: 3px;
            background: #fff;
            color: #495057;
            font-size: 12px;
            font-weight: bold;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }
        .schema-tree-twist.is-leaf {
            visibility: hidden;
            pointer-events: none;
        }
        .schema-tree-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .schema-tree-children { margin-left: 14px; border-left: 1px dotted #ced4da; padding-left: 4px; }
        .schema-detail-col {
            flex: 1;
            min-width: 0;
            position: relative;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 12px;
            background: #fff;
            height: 100%;
            overflow: auto;
            box-sizing: border-box;
        }
        .schema-detail-pane { min-height: 40px; }
        .schema-master-detail.show-node #schema_editor_holder {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            border: 0 !important;
        }

        #schema_editor_holder .je-object__container,
        #schema_editor_holder .je-indented-panel,
        #schema_detail_pane .je-object__container,
        #schema_detail_pane .je-indented-panel {
            margin-left: 10px !important;
            border-left: 3px solid #007bff22 !important;
            padding-left: 10px !important;
            margin-bottom: 5px !important;
            background: rgba(0, 0, 0, 0.005);
        }

        /* La root: ascunde formularele copiilor (rămân Add / tip rădăcină) */
        #schema_editor_holder.md-root-view .je-child-editor-holder.je-object__container {
            display: none !important;
        }
        /* În detaliu nod: ascunde sub-nodurile (obiecte imbricate), nu câmpurile simple */
        #schema_detail_pane .md-detail-node .je-object__container {
            display: none !important;
        }
        #schema_detail_pane .md-detail-node .je-child-editor-holder {
            display: none !important;
        }
        #schema_detail_pane .md-detail-node {
            margin-left: 0 !important;
            border-left: none !important;
            padding-left: 0 !important;
        }

        input[type="text"], input[type="number"], select { 
            width: 100% !important; max-width: 280px !important; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 13px; margin-bottom: 4px; display: block;
        }

        /* Mobil: tree deasupra, detaliu pe lățime plină dedesubt */
        @media (max-width: 800px) {
            body { margin: 10px; }
            .main-layout { max-width: 100%; }
            .panel { padding: 12px; }
            .schema-master-detail {
                flex-direction: column;
                height: auto;
                min-height: 0;
                gap: 10px;
            }
            .schema-tree {
                width: 100%;
                flex: 0 0 auto;
                height: 200px;
                max-height: 32vh;
            }
            .schema-detail-col {
                width: 100%;
                height: min(58vh, 520px);
                min-height: 260px;
            }
            .schema-detail-col input[type="text"],
            .schema-detail-col input[type="number"],
            .schema-detail-col select,
            #schema_editor_holder input[type="text"],
            #schema_editor_holder input[type="number"],
            #schema_editor_holder select,
            #schema_detail_pane input[type="text"],
            #schema_detail_pane input[type="number"],
            #schema_detail_pane select {
                max-width: 100% !important;
            }
        }
        
        .json-editor-btn-add, .json-editor-btntype-add, .json-editor-btntype-properties { background: #007bff !important; color: white !important; border: none !important; padding: 4px 8px !important; border-radius: 4px !important; cursor: pointer !important; font-size: 11px !important; margin: 2px 1px !important; display: inline-block; }
        .json-editor-btn-delete, .json-editor-btntype-delete, .json-editor-btntype-deletelast { background: #dc3545 !important; color: white !important; border: none !important; padding: 4px 8px !important; border-radius: 4px !important; font-size: 11px !important; margin: 2px 1px !important; display: inline-block; }

        #data_editor_holder [data-schemaid="root"] > .je-header { display: none !important; }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="panel import-box">
        <label style="font-weight: bold; margin-bottom: 5px; display: block;">Lipește un JSON Schema valid (din caseta verde):</label>
        <textarea id="import_schema_json" class="import-textarea" placeholder='{ "type": "object", "properties": { ... } }'></textarea>
        <button id="import-btn" class="action-btn btn-blue" style="padding: 8px 16px; font-size: 13px; margin-top: 5px; width: auto;">Transformă și Încarcă în Formular</button>
    </div>

    <div class="panel" id="panel-schema">
        <div class="panel-header">
            <h2>1. Configurator Structură Formular</h2>
            <button type="button" class="toggle-btn" data-panel="panel-schema">Collapse</button>
        </div>
        <div class="panel-body">
            <div class="schema-master-detail" id="schema_master_detail">
                <aside id="schema_tree" class="schema-tree" aria-label="Arbore structură formular"></aside>
                <div class="schema-detail-col">
                    <div id="schema_detail_pane" class="schema-detail-pane"></div>
                    <div id="schema_editor_holder"></div>
                </div>
            </div>
            <div class="schema-box">
                <h3>[LIVE] JSON Schema Generat:</h3>
                <pre id="output_schema">{}</pre>
                <button type="button" class="copy-btn" data-copy-target="output_schema">Copiază Schema</button>
            </div>
        </div>
    </div>

    <div class="panel" id="panel-data">
        <div class="panel-header">
            <h2>2. Completează Datele Formularului</h2>
            <button type="button" class="toggle-btn" data-panel="panel-data">Collapse</button>
        </div>
        <div class="panel-body">
            <div id="data_editor_holder"></div>
            <button id="submit-btn" class="btn-green">Generează JSON Final</button>
            <div class="output-box">
                <h3>JSON Rezultat:</h3>
                <pre id="output_json">{}</pre>
                <button type="button" class="copy-btn" data-copy-target="output_json">Copiază JSON</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Generăm definițiile structurii stabile pe 5 niveluri
    function genereazaNodCimp(nivel) {
        let definitie = {
            "type": "object",
            "title": "Câmp Nivel " + nivel,
            "headerTemplate": "{{self.key}} [{{self.type}}]",
            "properties": {
                "key": { "type": "string", "title": "Cheie în JSON (Ignorat la rând listă)", "default": "cheie_noua" },
                "title": { "type": "string", "title": "Nume Afișat", "default": "Nume Câmp" },
                "type": { 
                    "type": "string", 
                    "title": "Tip Dată", 
                    "enum": ["string", "integer", "number", "boolean", "object", "array"], 
                    "default": "string" 
                },
                "default": { "type": "string", "title": "Valoare Implicită", "default": "" },
                "enum": {
                    "type": "array",
                    "title": "Opțiuni fixe limitate (Enum - Opțional):",
                    "item_title": "Opțiune",
                    "default": [],
                    "items": { "type": "string", "title": "Valoare fixă" }
                }
            },
            "required": ["key", "title", "type", "default", "enum"]
        };

        if (nivel < 5) {
            definitie.properties.sub_properties = {
                "type": "array",
                "title": "Proprietăți interioare Obiect:",
                "items": genereazaNodCimp(nivel + 1),
                "options": { "dependencies": { "type": "object" } }
            };
            definitie.properties.array_mode = {
                "type": "string",
                "title": "Mod Array",
                "enum": ["list", "tuple"],
                "default": "list",
                "options": {
                    "enum_titles": [
                        "listă variabilă (un tip de element)",
                        "tuple — poziții fixe"
                    ],
                    "dependencies": { "type": "array" }
                }
            };
            // Listă omogenă: un singur șablon de element
            definitie.properties.array_items = {
                "type": "object",
                "title": "Șablon element (listă):",
                "target": "properties",
                "properties": genereazaNodCimp(nivel + 1).properties,
                "required": ["title", "type", "default", "enum"],
                "options": { "dependencies": { "type": "array", "array_mode": "list" } }
            };
            // Tuple: câte un schema pe fiecare poziție
            definitie.properties.array_tuple_items = {
                "type": "array",
                "title": "Poziții tuple (fixe):",
                "items": genereazaNodCimp(nivel + 1),
                "options": { "dependencies": { "type": "array", "array_mode": "tuple" } }
            };
        }

        return definitie;
    }

    const rootMetaSchema = {
        "type": "object",
        "title": "Configurație Generală",
        "properties": {
            "root_type": {
                "type": "string",
                "title": "Tipul Rădăcină al JSON-ului",
                "enum": ["object", "array_tuple", "array_list"],
                "default": "object",
                "options": {
                    "enum_titles": [
                        "object",
                        "array — poziții fixe (tuple)",
                        "array — listă variabilă"
                    ]
                }
            },
            "structure": {
                "type": "array",
                "title": "Arbore Formular",
                "items": genereazaNodCimp(1)
            }
        }
    };

    // Structura inițială default pe care o randează pagina la pornire
    const initialStructure = {
        "root_type": "object",
        "structure": [
            {
                "key": "register",
                "title": "Grup Înregistrare",
                "type": "object",
                "sub_properties": [
                    {
                        "key": "data",
                        "title": "Date Interne (Data)",
                        "type": "object",
                        "sub_properties": [
                            {
                                "key": "label",
                                "title": "Etichetă Obiect (Label)",
                                "type": "object",
                                "sub_properties": [
                                    { "key": "text", "title": "Textul Mesajului", "type": "string", "default": "hello" }
                                ]
                            }
                        ]
                    }
                ]
            }
        ]
    };

    let schemaEditor = new JSONEditor(document.getElementById('schema_editor_holder'), {
        schema: rootMetaSchema,
        theme: 'html',
        disable_collapse: false,
        disable_edit_json: true,
        disable_properties: true,
        startval: initialStructure
    });

    let dataEditor;

    // --- Navigare master-detail: tree stânga + detaliu nod dreapta ---
    (function initSchemaTreeNav() {
        const master = document.getElementById('schema_master_detail');
        const treeEl = document.getElementById('schema_tree');
        const detailPane = document.getElementById('schema_detail_pane');
        const holder = document.getElementById('schema_editor_holder');

        let selectedPath = 'root';
        let expanded = new Set(['root']);
        let moved = null;
        let lastTreeSig = '';
        let applyingSelection = false;

        function nodeLabel(node, fallback) {
            const key = (node && node.key) ? node.key : fallback;
            let type = (node && node.type) ? node.type : '?';
            if (type === 'array') {
                const mode = (node && node.array_mode) ? node.array_mode : 'list';
                type = 'array:' + mode;
            }
            return key + ' [' + type + ']';
        }

        function collectChildren(node, basePath) {
            const kids = [];
            if (!node) return kids;
            if (node.type === 'object' && Array.isArray(node.sub_properties)) {
                node.sub_properties.forEach((child, i) => {
                    kids.push({
                        path: basePath + '.sub_properties.' + i,
                        label: nodeLabel(child, 'field_' + i),
                        node: child
                    });
                });
            }
            if (node.type === 'array') {
                const mode = node.array_mode || 'list';
                if (mode === 'tuple' && Array.isArray(node.array_tuple_items)) {
                    node.array_tuple_items.forEach((child, i) => {
                        kids.push({
                            path: basePath + '.array_tuple_items.' + i,
                            label: '[' + i + '] ' + nodeLabel(child, 'pos_' + i),
                            node: child
                        });
                    });
                } else if (node.array_items && typeof node.array_items === 'object') {
                    kids.push({
                        path: basePath + '.array_items',
                        label: 'items [' + (node.array_items.type || '?') + ']',
                        node: node.array_items
                    });
                }
            }
            return kids;
        }

        function buildTreeNodes(config) {
            return (config.structure || []).map((item, i) => ({
                path: 'root.structure.' + i,
                label: nodeLabel(item, 'item_' + i),
                node: item
            }));
        }

        function treeSignature(config) {
            // Doar structură (tipuri + număr copii), nu etichete — ca să nu re-mutăm DOM-ul la fiecare tastă
            function walk(node) {
                if (!node) return '';
                let s = (node.type || '') + ';';
                if (node.type === 'object' && Array.isArray(node.sub_properties)) {
                    s += 'sp' + node.sub_properties.length + '[' + node.sub_properties.map(walk).join(',') + ']';
                }
                if (node.type === 'array') {
                    const mode = node.array_mode || 'list';
                    s += 'am:' + mode + ';';
                    if (mode === 'tuple' && Array.isArray(node.array_tuple_items)) {
                        s += 'at' + node.array_tuple_items.length + '[' + node.array_tuple_items.map(walk).join(',') + ']';
                    } else if (node.array_items) {
                        s += 'ai[' + walk(node.array_items) + ']';
                    }
                }
                return s;
            }
            return (config.root_type || '') + '#' + (config.structure || []).length + '|' + (config.structure || []).map(walk).join('|');
        }

        function ensureAncestorsExpanded(path) {
            expanded.add('root');
            if (path === 'root') return;
            const rest = path.replace(/^root\./, '');
            const tokens = rest.match(/structure\.\d+|sub_properties\.\d+|array_tuple_items\.\d+|array_items/g) || [];
            let acc = 'root';
            tokens.forEach(tok => {
                acc += '.' + tok;
                if (acc !== path) expanded.add(acc);
            });
        }

        function pathExists(config, path) {
            if (path === 'root') return true;
            if (!path.startsWith('root.')) return false;
            const parts = path.slice('root.'.length).split('.');
            let cur = config;
            for (let i = 0; i < parts.length; i++) {
                const p = parts[i];
                if (p === 'structure' || p === 'sub_properties' || p === 'array_tuple_items') {
                    const idx = Number(parts[++i]);
                    if (!cur[p] || !cur[p][idx]) return false;
                    cur = cur[p][idx];
                } else if (p === 'array_items') {
                    if (!cur.array_items) return false;
                    cur = cur.array_items;
                } else {
                    return false;
                }
            }
            return true;
        }

        function restoreMoved() {
            if (!moved) return;
            const el = moved.el;
            const parent = moved.parent;
            const next = moved.next;
            moved = null;
            if (!el) return;
            el.classList.remove('md-detail-node');
            if (!el.isConnected && !(parent && parent.isConnected)) {
                return; // DOM recreat de JSON Editor — nodul vechi e invalid
            }
            if (parent && parent.isConnected) {
                try {
                    if (next && next.parentNode === parent) {
                        parent.insertBefore(el, next);
                    } else {
                        parent.appendChild(el);
                    }
                } catch (e) { /* ignore */ }
            }
        }

        function applySelection() {
            applyingSelection = true;
            try {
                restoreMoved();
                holder.classList.remove('md-root-view');
                master.classList.remove('show-node');
                while (detailPane.firstChild) {
                    detailPane.removeChild(detailPane.firstChild);
                }

                const config = schemaEditor.getValue();
                if (!pathExists(config, selectedPath)) {
                    selectedPath = 'root';
                }

                if (selectedPath === 'root') {
                    holder.classList.add('md-root-view');
                    highlightTreeSelection();
                    return;
                }

                const ed = schemaEditor.getEditor(selectedPath);
                if (!ed || !ed.container) {
                    selectedPath = 'root';
                    holder.classList.add('md-root-view');
                    highlightTreeSelection();
                    return;
                }

                const el = ed.container;
                el.classList.add('md-detail-node');
                moved = { el: el, parent: el.parentNode, next: el.nextSibling };
                detailPane.appendChild(el);
                master.classList.add('show-node');
                highlightTreeSelection();
            } finally {
                applyingSelection = false;
            }
        }

        function highlightTreeSelection() {
            treeEl.querySelectorAll('.schema-tree-row').forEach(row => {
                row.classList.toggle('is-selected', row.getAttribute('data-path') === selectedPath);
            });
        }

        function scrollDetailIntoViewOnMobile() {
            if (!window.matchMedia('(max-width: 800px)').matches) return;
            const detailCol = document.querySelector('.schema-detail-col');
            if (detailCol) {
                detailCol.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function renderTreeNode(item, into) {
            const kids = collectChildren(item.node, item.path);
            const hasKids = kids.length > 0;
            const isOpen = expanded.has(item.path);

            const row = document.createElement('div');
            row.className = 'schema-tree-row';
            row.setAttribute('data-path', item.path);
            if (item.path === selectedPath) row.classList.add('is-selected');

            const twist = document.createElement('button');
            twist.type = 'button';
            twist.className = 'schema-tree-twist' + (hasKids ? '' : ' is-leaf');
            twist.textContent = hasKids ? (isOpen ? '-' : '+') : '';
            twist.title = hasKids ? (isOpen ? 'Collapse' : 'Expand') : '';
            twist.addEventListener('click', (ev) => {
                ev.stopPropagation();
                if (!hasKids) return;
                if (expanded.has(item.path)) expanded.delete(item.path);
                else expanded.add(item.path);
                renderTree();
            });

            const label = document.createElement('span');
            label.className = 'schema-tree-label';
            label.textContent = item.label;

            row.appendChild(twist);
            row.appendChild(label);
            row.addEventListener('click', () => {
                selectedPath = item.path;
                ensureAncestorsExpanded(item.path);
                applySelection();
                highlightTreeSelection();
                scrollDetailIntoViewOnMobile();
            });
            into.appendChild(row);

            if (hasKids && isOpen) {
                const childWrap = document.createElement('div');
                childWrap.className = 'schema-tree-children';
                kids.forEach(k => renderTreeNode(k, childWrap));
                into.appendChild(childWrap);
            }
        }

        function renderTree() {
            const config = schemaEditor.getValue();
            treeEl.innerHTML = '';

            const rootRow = {
                path: 'root',
                label: 'root [' + (config.root_type || 'object') + ']',
                node: null
            };

            const rootKids = buildTreeNodes(config);
            const rootHasKids = rootKids.length > 0;
            const rootOpen = expanded.has('root');

            const row = document.createElement('div');
            row.className = 'schema-tree-row';
            row.setAttribute('data-path', 'root');
            if (selectedPath === 'root') row.classList.add('is-selected');

            const twist = document.createElement('button');
            twist.type = 'button';
            twist.className = 'schema-tree-twist' + (rootHasKids ? '' : ' is-leaf');
            twist.textContent = rootHasKids ? (rootOpen ? '-' : '+') : '';
            twist.addEventListener('click', (ev) => {
                ev.stopPropagation();
                if (!rootHasKids) return;
                if (expanded.has('root')) expanded.delete('root');
                else expanded.add('root');
                renderTree();
            });

            const label = document.createElement('span');
            label.className = 'schema-tree-label';
            label.textContent = rootRow.label;

            row.appendChild(twist);
            row.appendChild(label);
            row.addEventListener('click', () => {
                selectedPath = 'root';
                applySelection();
                highlightTreeSelection();
                scrollDetailIntoViewOnMobile();
            });
            treeEl.appendChild(row);

            if (rootHasKids && rootOpen) {
                const childWrap = document.createElement('div');
                childWrap.className = 'schema-tree-children';
                rootKids.forEach(k => renderTreeNode(k, childWrap));
                treeEl.appendChild(childWrap);
            }
        }

        function refreshTreeNav(forceSelection) {
            if (applyingSelection) return;
            const config = schemaEditor.getValue();
            const sig = treeSignature(config);
            const structureChanged = sig !== lastTreeSig;
            lastTreeSig = sig;

            if (structureChanged) {
                restoreMoved();
                while (detailPane.firstChild) {
                    detailPane.removeChild(detailPane.firstChild);
                }
                master.classList.remove('show-node');
            } else if (moved && moved.el && !moved.el.isConnected) {
                moved = null;
            }

            if (!pathExists(config, selectedPath)) {
                selectedPath = 'root';
                forceSelection = true;
            }

            renderTree();

            if (structureChanged || forceSelection) {
                requestAnimationFrame(() => applySelection());
            } else {
                highlightTreeSelection();
            }
        }

        schemaEditor.on('ready', () => {
            lastTreeSig = treeSignature(schemaEditor.getValue());
            renderTree();
            applySelection();
        });

        schemaEditor.on('change', () => {
            refreshTreeNav(false);
        });

        // dacă ready a trecut deja (unele versiuni), inițializează acum
        if (schemaEditor.ready) {
            lastTreeSig = treeSignature(schemaEditor.getValue());
            renderTree();
            applySelection();
        }
    })();

    function parseNodeToSchema(node) {
        let schemaNode = { title: node.title, type: node.type };

        if (node.type === 'object') {
            schemaNode.properties = {};
            if (node.sub_properties && node.sub_properties.length > 0) {
                node.sub_properties.forEach(subNode => {
                    schemaNode.properties[subNode.key] = parseNodeToSchema(subNode);
                });
            }
        } else if (node.type === 'array') {
            const mode = node.array_mode || 'list';
            if (mode === 'tuple' && Array.isArray(node.array_tuple_items)) {
                const itemsArray = node.array_tuple_items.map(item => parseNodeToSchema(item));
                schemaNode.items = itemsArray;
                schemaNode.minItems = itemsArray.length;
                schemaNode.maxItems = itemsArray.length;
            } else if (node.array_items) {
                schemaNode.items = parseNodeToSchema(node.array_items);
            } else {
                schemaNode.items = { type: "string", title: "Element" };
            }
        } else {
            if (node.default !== undefined && node.default !== "") {
                schemaNode.default = (node.type === 'integer' || node.type === 'number') ? Number(node.default) : node.default;
            }
            if (node.enum && node.enum.length > 0) {
                schemaNode.enum = node.enum.map(val => (node.type === 'integer' || node.type === 'number') ? Number(val) : val);
            }
        }

        return schemaNode;
    }

    let enforcingRootListLimit = false;

    function syncRootArrayListLock(config) {
        const structureEd = schemaEditor.getEditor('root.structure');
        if (!structureEd) return false;

        const isList = config.root_type === 'array_list';

        if (isList) {
            structureEd.schema.maxItems = 1;
            if ((config.structure || []).length > 1) {
                if (enforcingRootListLimit) return false;
                enforcingRootListLimit = true;
                try {
                    schemaEditor.setValue(Object.assign({}, config, {
                        structure: config.structure.slice(0, 1)
                    }));
                } finally {
                    enforcingRootListLimit = false;
                }
                return true;
            }
        } else {
            delete structureEd.schema.maxItems;
        }

        // Ascunde / reactivează butonul Add pe array-ul din root
        const canAdd = !isList || (config.structure || []).length < 1;
        if (structureEd.add_row_button && typeof structureEd.setButtonState === 'function') {
            structureEd.setButtonState(structureEd.add_row_button, canAdd && !structureEd.hide_add_button);
        } else if (structureEd.container) {
            structureEd.container.querySelectorAll('.json-editor-btntype-add, .json-editor-btn-add').forEach(btn => {
                // doar butoanele de pe acest array, nu cele din sub-editori mutați în detaliu
                const inChildRow = btn.closest('.je-child-editor-holder');
                if (inChildRow && structureEd.container.contains(inChildRow)) return;
                btn.style.display = canAdd ? '' : 'none';
                btn.disabled = !canAdd;
            });
        }

        if (structureEd.schema) {
            if (isList) {
                structureEd.schema.title = 'Șablon element listă (un singur tip)';
            } else if (config.root_type === 'array_tuple' || config.root_type === 'array') {
                structureEd.schema.title = 'Poziții tuple (fixe)';
            } else {
                structureEd.schema.title = 'Arbore Formular';
            }
            if (typeof structureEd.updateHeaderText === 'function') {
                structureEd.updateHeaderText();
            } else if (structureEd.header_text) {
                structureEd.header_text.textContent = structureEd.schema.title;
            }
        }

        return false;
    }

    function updateDataEditor(config) {
        if (syncRootArrayListLock(config)) {
            return; // setValue va re-declanșa change
        }

        let targetSchema = {};

        if (config.root_type === 'array_list') {
            // Listă omogenă: un tip de element; lungime liberă în panoul din dreapta
            const template = (config.structure && config.structure[0])
                ? parseNodeToSchema(config.structure[0])
                : { type: "string", title: "Element" };
            targetSchema = { type: "array", title: "Listă", items: template };
        } else if (config.root_type === 'array_tuple' || config.root_type === 'array') {
            // Tuple: fiecare câmp din structură = o poziție fixă
            // (păstrăm și "array" pentru compatibilitate cu valori vechi)
            const itemsArray = (config.structure || []).map(item => parseNodeToSchema(item));
            targetSchema = { type: "array", minItems: itemsArray.length, maxItems: itemsArray.length, items: itemsArray };
        } else {
            targetSchema = { type: "object", properties: {} };
            (config.structure || []).forEach(item => {
                targetSchema.properties[item.key] = parseNodeToSchema(item);
            });
        }

        // Afișăm în timp real schema generată în panoul verde din stânga
        document.getElementById('output_schema').textContent = JSON.stringify(targetSchema, null, 2);

        if (dataEditor) { dataEditor.destroy(); }

        dataEditor = new JSONEditor(document.getElementById('data_editor_holder'), {
            schema: targetSchema,
            theme: 'html',
            disable_collapse: true,
            disable_edit_json: true,
            disable_properties: true,
            disable_array_reorder: true
        });
    }

    // Atașăm un singur ascultător global curat pentru modificări de structură
    schemaEditor.on('change', () => {
        const config = schemaEditor.getValue();
        updateDataEditor(config);
    });

    // Funcție recursivă inversă: Traduce JSON Schema standard în structură acceptată de formulare
    function inverseazaSchemaInConfig(cheie, schemaNod) {
        let nodConfig = {
            key: cheie || "cheie",
            title: schemaNod.title || cheie || "Nume Câmp",
            type: schemaNod.type || "string",
            default: schemaNod.default !== undefined ? String(schemaNod.default) : ""
        };

        if (schemaNod.enum && Array.isArray(schemaNod.enum)) {
            nodConfig.enum = schemaNod.enum.map(v => String(v));
        }

        if (schemaNod.type === 'object' && schemaNod.properties) {
            nodConfig.sub_properties = [];
            for (let subCheie in schemaNod.properties) {
                nodConfig.sub_properties.push(inverseazaSchemaInConfig(subCheie, schemaNod.properties[subCheie]));
            }
        } else if (schemaNod.type === 'array' && schemaNod.items !== undefined) {
            if (Array.isArray(schemaNod.items)) {
                nodConfig.array_mode = 'tuple';
                nodConfig.array_tuple_items = schemaNod.items.map((item, index) =>
                    inverseazaSchemaInConfig("item_" + index, item)
                );
            } else if (schemaNod.items && typeof schemaNod.items === 'object') {
                nodConfig.array_mode = 'list';
                nodConfig.array_items = inverseazaSchemaInConfig("element", schemaNod.items);
            } else {
                nodConfig.array_mode = 'list';
                nodConfig.array_items = {
                    key: "element",
                    title: "Element",
                    type: "string",
                    default: ""
                };
            }
        }

        return nodConfig;
    }

    // Mecanismul de Import și parsare automată din JSON Schema standard
    document.getElementById('import-btn').addEventListener('click', function() {
        const rawJson = document.getElementById('import_schema_json').value.trim();
        if (!rawJson) {
            alert('Te rog să lipești un JSON Schema valid în căsuță înainte de a apăsa butonul!');
            return;
        }

        try {
            const schemaExterna = JSON.parse(rawJson);
            let configuratieNoua = {
                root_type: 'object',
                structure: []
            };

            if (schemaExterna.type === 'object' && schemaExterna.properties) {
                configuratieNoua.root_type = 'object';
                for (let cheie in schemaExterna.properties) {
                    configuratieNoua.structure.push(inverseazaSchemaInConfig(cheie, schemaExterna.properties[cheie]));
                }
            } else if (schemaExterna.type === 'array' && schemaExterna.items) {
                if (Array.isArray(schemaExterna.items)) {
                    configuratieNoua.root_type = 'array_tuple';
                    schemaExterna.items.forEach((item, index) => {
                        configuratieNoua.structure.push(inverseazaSchemaInConfig("item_" + index, item));
                    });
                } else {
                    configuratieNoua.root_type = 'array_list';
                    configuratieNoua.structure.push(inverseazaSchemaInConfig("element", schemaExterna.items));
                }
            } else {
                alert('JSON Schema nu pare să aibă o structură standard recunoscută (lipsește "properties" sau "items").');
                return;
            }

            // Populăm editorul din stânga, declanșând automat updateDataEditor în lanț
            schemaEditor.setValue(configuratieNoua);
            alert('Schema a fost importată și transformată în formulare cu succes!');
        } catch (e) {
            alert('Eroare la procesarea JSON Schema: ' + e.message + '\nAsigură-te că ai copiat codul complet și corect.');
        }
    });

    // Extrage valoarea completată în formular la click pe butonul de trimitere
    document.getElementById('submit-btn').addEventListener('click', function() {
        if (dataEditor) {
            document.getElementById('output_json').textContent = JSON.stringify(dataEditor.getValue(), null, 2);
        }
    });

    async function copiazaTextDin(elementId, buton) {
        const text = document.getElementById(elementId).textContent || '';
        try {
            await navigator.clipboard.writeText(text);
        } catch (e) {
            const zona = document.createElement('textarea');
            zona.value = text;
            document.body.appendChild(zona);
            zona.select();
            document.execCommand('copy');
            document.body.removeChild(zona);
        }
        const eticheta = buton.textContent;
        buton.textContent = 'Copiat!';
        buton.classList.add('copied');
        setTimeout(() => {
            buton.textContent = eticheta;
            buton.classList.remove('copied');
        }, 1500);
    }

    document.querySelectorAll('.copy-btn').forEach(buton => {
        buton.addEventListener('click', () => copiazaTextDin(buton.getAttribute('data-copy-target'), buton));
    });

    document.querySelectorAll('.toggle-btn').forEach(buton => {
        buton.addEventListener('click', () => {
            const panel = document.getElementById(buton.getAttribute('data-panel'));
            const collapsed = panel.classList.toggle('collapsed');
            buton.textContent = collapsed ? 'Expand' : 'Collapse';
        });
    });
</script>
