<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor JSON Profesional - Soluție Integrată și Stabilă</title>
    
    <!-- JSON-Editor CDN -->
    <script src="jsoneditor.min.js"></script>
    
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .main-layout { display: flex; gap: 20px; max-width: 1600px; margin: 0 auto; align-items: flex-start; }
        .column { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); min-width: 350px; }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-top: 0; font-size: 18px; color: #007bff; }
        h3 { font-size: 14px; margin-top: 15px; color: #555; }
        
        .import-box { background: #e9ecef; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #ced4da; }
        .import-textarea { width: 100%; height: 100px; font-family: monospace; font-size: 12px; box-sizing: border-box; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; resize: vertical; }
        
        .btn-green { background-color: #28a745 !important; color: white !important; }
        .btn-green:hover { background-color: #218838 !important; }
        .btn-blue { background-color: #007bff !important; color: white !important; }
        .btn-blue:hover { background-color: #0069d9 !important; }
        
        #submit-btn, .action-btn { color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; display: block; text-align: center; box-sizing: border-box; }
        
        .output-box { margin-top: 15px; background: #272822; color: #f8f8f2; padding: 15px; border-radius: 6px; overflow-x: auto; }
        .schema-box { margin-top: 25px; background: #1e1e1e; color: #a6e22e; padding: 15px; border-radius: 6px; overflow-x: auto; border: 1px solid #333; }
        pre { margin: 0; font-size: 12px; font-family: monospace; }

        /* Stiluri ierarhice pentru configuratorul din stânga */
        #schema_editor_holder .je-object__container, 
        #schema_editor_holder .je-indented-panel {
            margin-left: 10px !important;
            border-left: 3px solid #007bff22 !important;
            padding-left: 10px !important;
            margin-bottom: 5px !important;
            background: rgba(0, 0, 0, 0.005);
        }

        input[type="text"], input[type="number"], select { 
            width: 100% !important; max-width: 280px !important; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 13px; margin-bottom: 4px; display: block;
        }
        
        .json-editor-btn-add, .json-editor-btntype-add, .json-editor-btntype-properties { background: #007bff !important; color: white !important; border: none !important; padding: 4px 8px !important; border-radius: 4px !important; cursor: pointer !important; font-size: 11px !important; margin: 2px 1px !important; display: inline-block; }
        .json-editor-btn-delete, .json-editor-btntype-delete, .json-editor-btntype-deletelast { background: #dc3545 !important; color: white !important; border: none !important; padding: 4px 8px !important; border-radius: 4px !important; font-size: 11px !important; margin: 2px 1px !important; display: inline-block; }

        #data_editor_holder [data-schemaid="root"] > .je-header { display: none !important; }
    </style>
</head>
<body>

<div class="main-layout">
    <!-- COLOANA STÂNGA -->
    <div class="column">
        <!-- Secțiunea de Import Inteligent JSON Schema -->
        <div class="import-box">
            <label style="font-weight: bold; margin-bottom: 5px; display: block;">Lipește un JSON Schema valid (din caseta verde):</label>
            <textarea id="import_schema_json" class="import-textarea" placeholder='{ "type": "object", "properties": { ... } }'></textarea>
            <button id="import-btn" class="action-btn btn-blue" style="padding: 8px 16px; font-size: 13px; margin-top: 5px; width: auto;">Transformă și Încarcă în Formular</button>
        </div>

        <h2>1. Configurator Structură Formular</h2>
        <div id="schema_editor_holder"></div>
        
        <div class="schema-box">
            <h3>[LIVE] JSON Schema Generat:</h3>
            <pre id="output_schema">{}</pre>
        </div>
    </div>
    
    <!-- COLOANA DREAPTA -->
    <div class="column">
        <h2>2. Completează Datele Formularului</h2>
        <div id="data_editor_holder"></div>
        
        <button id="submit-btn" class="btn-green">Generează JSON Final</button>

        <div class="output-box">
            <h3>JSON Rezultat:</h3>
            <pre id="output_json">{}</pre>
        </div>
    </div>
</div>

<script>
    // Generăm definițiile structurii stabile pe 5 niveluri
    function genereazaNodCimp(nivel) {
        let definitie = {
            "type": "object",
            "title": "Câmp Nivel " + nivel,
            "headerTemplate": "{{self.key}} [{{self.type}}]",
            "properties": {
                "key": { "type": "string", "title": "Cheie în JSON (Ignorat la rând listă)", "default": "cheie_noua" },
                "title": { "type": "string", "title": "Nume Afișat", "default": "Nume Câmp" },
                "type": { 
                    "type": "string", 
                    "title": "Tip Dată", 
                    "enum": ["string", "integer", "number", "boolean", "object", "array"], 
                    "default": "string" 
                },
                "default": { "type": "string", "title": "Valoare Implicită", "default": "" },
                "enum": {
                    "type": "array",
                    "title": "Opțiuni fixe limitate (Enum - Opțional):",
                    "item_title": "Opțiune",
                    "default": [],
                    "items": { "type": "string", "title": "Valoare fixă" }
                }
            },
            "required": ["key", "title", "type", "default", "enum"]
        };

        if (nivel < 5) {
            definitie.properties.sub_properties = {
                "type": "array",
                "title": "Proprietăți interioare Obiect:",
                "items": genereazaNodCimp(nivel + 1),
                "options": { "dependencies": { "type": "object" } }
            };
            definitie.properties.array_items = {
                "type": "object",
                "title": "Configurare elemente din Listă (Array):",
                "target": "properties",
                "properties": genereazaNodCimp(nivel + 1).properties,
                "required": ["title", "type", "default", "enum"],
                "options": { "dependencies": { "type": "array" } }
            };
        }

        return definitie;
    }

    const rootMetaSchema = {
        "type": "object",
        "title": "Configurație Generală",
        "properties": {
            "root_type": { "type": "string", "title": "Tipul Rădăcină al JSON-ului", "enum": ["object", "array"], "default": "object" },
            "array_mode": {
                "type": "string",
                "title": "Mod Array Rădăcină",
                "enum": ["tuple", "list"],
                "default": "tuple",
                "options": {
                    "enum_titles": [
                        "Poziții fixe (tuple) — lungime = nr. câmpuri",
                        "Listă variabilă — adaugi elemente în dreapta"
                    ],
                    "dependencies": { "root_type": "array" }
                }
            },
            "structure": {
                "type": "array",
                "title": "Arbore Formular",
                "items": genereazaNodCimp(1)
            }
        }
    };

    // Structura inițială default pe care o randează pagina la pornire
    const initialStructure = {
        "root_type": "object",
        "structure": [
            {
                "key": "register",
                "title": "Grup Înregistrare",
                "type": "object",
                "sub_properties": [
                    {
                        "key": "data",
                        "title": "Date Interne (Data)",
                        "type": "object",
                        "sub_properties": [
                            {
                                "key": "label",
                                "title": "Etichetă Obiect (Label)",
                                "type": "object",
                                "sub_properties": [
                                    { "key": "text", "title": "Textul Mesajului", "type": "string", "default": "hello" }
                                ]
                            }
                        ]
                    }
                ]
            }
        ]
    };

    let schemaEditor = new JSONEditor(document.getElementById('schema_editor_holder'), {
        schema: rootMetaSchema,
        theme: 'html',
        disable_collapse: false,
        disable_edit_json: true,
        disable_properties: true,
        startval: initialStructure
    });

    let dataEditor;

    function parseNodeToSchema(node) {
        let schemaNode = { title: node.title, type: node.type };

        if (node.type === 'object') {
            schemaNode.properties = {};
            if (node.sub_properties && node.sub_properties.length > 0) {
                node.sub_properties.forEach(subNode => {
                    schemaNode.properties[subNode.key] = parseNodeToSchema(subNode);
                });
            }
        } else if (node.type === 'array') {
            if (node.array_items) {
                schemaNode.items = parseNodeToSchema(node.array_items);
            } else {
                schemaNode.items = { type: "string", title: "Element" };
            }
        } else {
            if (node.default !== undefined && node.default !== "") {
                schemaNode.default = (node.type === 'integer' || node.type === 'number') ? Number(node.default) : node.default;
            }
            if (node.enum && node.enum.length > 0) {
                schemaNode.enum = node.enum.map(val => (node.type === 'integer' || node.type === 'number') ? Number(val) : val);
            }
        }

        return schemaNode;
    }

    function updateDataEditor(config) {
        let targetSchema = {};

        if (config.root_type === 'array') {
            if (config.array_mode === 'list') {
                // Un singur tip de element; lungime liberă în panoul din dreapta
                const template = (config.structure && config.structure[0])
                    ? parseNodeToSchema(config.structure[0])
                    : { type: "string", title: "Element" };
                targetSchema = { type: "array", title: "Listă", items: template };
            } else {
                // Tuple: fiecare câmp din structură = o poziție fixă
                const itemsArray = (config.structure || []).map(item => parseNodeToSchema(item));
                targetSchema = { type: "array", minItems: itemsArray.length, maxItems: itemsArray.length, items: itemsArray };
            }
        } else {
            targetSchema = { type: "object", properties: {} };
            (config.structure || []).forEach(item => {
                targetSchema.properties[item.key] = parseNodeToSchema(item);
            });
        }

        // Afișăm în timp real schema generată în panoul verde din stânga
        document.getElementById('output_schema').textContent = JSON.stringify(targetSchema, null, 2);

        if (dataEditor) { dataEditor.destroy(); }

        dataEditor = new JSONEditor(document.getElementById('data_editor_holder'), {
            schema: targetSchema,
            theme: 'html',
            disable_collapse: true,
            disable_edit_json: true,
            disable_properties: true,
            disable_array_reorder: true
        });
    }

    // Atașăm un singur ascultător global curat pentru modificări de structură
    schemaEditor.on('change', () => {
        const config = schemaEditor.getValue();
        updateDataEditor(config);
    });

    // Funcție recursivă inversă: Traduce JSON Schema standard în structură acceptată de formulare
    function inverseazaSchemaInConfig(cheie, schemaNod) {
        let nodConfig = {
            key: cheie || "cheie",
            title: schemaNod.title || cheie || "Nume Câmp",
            type: schemaNod.type || "string",
            default: schemaNod.default !== undefined ? String(schemaNod.default) : ""
        };

        if (schemaNod.enum && Array.isArray(schemaNod.enum)) {
            nodConfig.enum = schemaNod.enum.map(v => String(v));
        }

        if (schemaNod.type === 'object' && schemaNod.properties) {
            nodConfig.sub_properties = [];
            for (let subCheie in schemaNod.properties) {
                nodConfig.sub_properties.push(inverseazaSchemaInConfig(subCheie, schemaNod.properties[subCheie]));
            }
        } else if (schemaNod.type === 'array' && schemaNod.items) {
            nodConfig.array_items = inverseazaSchemaInConfig("element", schemaNod.items);
        }

        return nodConfig;
    }

    // Mecanismul de Import și parsare automată din JSON Schema standard
    document.getElementById('import-btn').addEventListener('click', function() {
        const rawJson = document.getElementById('import_schema_json').value.trim();
        if (!rawJson) {
            alert('Te rog să lipești un JSON Schema valid în căsuță înainte de a apăsa butonul!');
            return;
        }

        try {
            const schemaExterna = JSON.parse(rawJson);
            let configuratieNoua = {
                root_type: schemaExterna.type === 'array' ? 'array' : 'object',
                array_mode: 'tuple',
                structure: []
            };

            if (configuratieNoua.root_type === 'object' && schemaExterna.properties) {
                for (let cheie in schemaExterna.properties) {
                    configuratieNoua.structure.push(inverseazaSchemaInConfig(cheie, schemaExterna.properties[cheie]));
                }
            } else if (configuratieNoua.root_type === 'array' && schemaExterna.items) {
                if (Array.isArray(schemaExterna.items)) {
                    configuratieNoua.array_mode = 'tuple';
                    schemaExterna.items.forEach((item, index) => {
                        configuratieNoua.structure.push(inverseazaSchemaInConfig("item_" + index, item));
                    });
                } else {
                    configuratieNoua.array_mode = 'list';
                    configuratieNoua.structure.push(inverseazaSchemaInConfig("element", schemaExterna.items));
                }
            } else {
                alert('JSON Schema nu pare să aibă o structură standard recunoscută (lipsește "properties" sau "items").');
                return;
            }

            // Populăm editorul din stânga, declanșând automat updateDataEditor în lanț
            schemaEditor.setValue(configuratieNoua);
            alert('Schema a fost importată și transformată în formulare cu succes!');
        } catch (e) {
            alert('Eroare la procesarea JSON Schema: ' + e.message + '\nAsigură-te că ai copiat codul complet și corect.');
        }
    });

    // Extrage valoarea completată în formular la click pe butonul de trimitere
    document.getElementById('submit-btn').addEventListener('click', function() {
        if (dataEditor) {
            document.getElementById('output_json').textContent = JSON.stringify(dataEditor.getValue(), null, 2);
        }
    });
</script>

</body>
</html>
